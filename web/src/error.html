<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>%sveltekit.status% · Something went wrong — Together We Own</title>
<style>
:root { color-scheme: dark light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #121719;
  color: #f5f5eb;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
}
main {
  max-width: 38rem;
  margin: 0 auto;
  padding: 3rem 1.5rem;
}
.brand {
  margin: 0 0 1.5rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.status {
  display: block;
  font-size: 1rem;
  font-weight: 600;
  color: #c2f45b;
}
h1 {
  margin: 0 0 1rem;
  font-size: 1.75rem;
  line-height: 1.25;
}
p { margin: 0 0 1rem; }
nav ul {
  list-style: none;
  margin: 1.5rem 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}
a {
  display: inline-block;
  padding: 0.625rem 1.25rem;
  border: 2px solid #c2f45b;
  border-radius: 0.5rem;
  background: #c2f45b;
  color: #14200a;
  font-weight: 600;
  text-decoration: none;
}
a.secondary {
  background: transparent;
  color: #c2f45b;
}
a:focus-visible {
  outline: 3px solid #ffffff;
  outline-offset: 3px;
}
@media (forced-colors: active) {
  body { background: Canvas; color: CanvasText; }
  .status { color: CanvasText; }
  a { background: ButtonFace; border-color: ButtonText; color: ButtonText; }
  a.secondary { background: Canvas; border-color: LinkText; color: LinkText; }
  a:focus-visible { outline-color: Highlight; }
}
</style>
</head>
<body>
<main>
<p class="brand">Together We Own</p>
<h1><span class="status">%sveltekit.status%</span> Something went wrong</h1>
<p>Something went wrong on our side, so this page is unavailable right now. Please try again in a little while, or head somewhere safe:</p>
<nav aria-label="Recovery">
<ul>
<li><a href="/">Home</a></li>
<li><a class="secondary" href="/events">Browse all events</a></li>
</ul>
</nav>
</main>
</body>
</html>
