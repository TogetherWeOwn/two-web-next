name: release

# Release on production promote (replaces the release-please release PR).
# deploy-production calls this after a successful production deploy with the
# exact deployed SHA. It tags that commit vX.Y.Z and publishes a GitHub Release
# whose notes come from the Conventional Commit subjects since the previous
# tag (ci/release-on-promote.cjs). Bump rules and note sections stay in
# release-please-config.json, so versions continue the existing tag line.
# No release PR: nothing new needs CI or review, nothing goes stale, and main
# never needs a freeze. Manual dispatch repairs a missed tag for a deployed SHA.

on:
  workflow_call:
    inputs:
      sha:
        description: Deployed commit to tag
        type: string
        required: true
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-hex commit on main that is live in production
        type: string
        required: true
      dry_run:
        description: Print the version and notes without publishing
        type: boolean
        default: false

# Least privilege: no workflow-wide token; the job grants only its own.
permissions: {}

jobs:
  tag:
    name: tag-release
    permissions:
      contents: write # Create the tag and its GitHub Release.
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # One release at a time; a queued promote waits instead of racing the tag.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history and tags: the version and notes come from the commits
          # since the previous vX.Y.Z tag.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Tag the deployed commit and publish its release
        run: node ci/release-on-promote.cjs
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
