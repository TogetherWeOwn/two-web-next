name: Event form capture

# Single-revision evidence only; this workflow never deploys.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/event-form-capture.yml
      - e2e/admin-event-form.capture.ts
      - playwright.event-form-capture.config.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: two_web_next
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d two_web_next"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://agent_test@127.0.0.1:5432/two_web_next
      WRANGLER_SEND_METRICS: "false"
      EVENT_FORM_CAPTURE_DIR: ${{ runner.temp }}/event-form-capture
      REQUESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Verify checkout
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Install locked dependencies without lifecycle hooks
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          node ci/build-leaf-css.mjs
      - name: Verify CI and disposable database isolation
        run: node e2e/prepare.mjs
      - name: Apply migrations to disposable Postgres
        run: npm run db:migrate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture native event form round trip
        env:
          NODE_OPTIONS: --import=tsx
        run: npx playwright test --config playwright.event-form-capture.config.ts
      - name: Upload event form evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-form-single-revision-${{ github.run_id }}
          path: ${{ runner.temp }}/event-form-capture/
          if-no-files-found: error
          retention-days: 7
