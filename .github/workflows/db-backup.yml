name: db-backup

# Nightly pg_dump of the PlanetScale staging branch to R2 `two-web-next-backups`.
# Staging is dumped nightly by the schedule; production is dumped only by manual
# dispatch with `target: production`, behind the `production` Environment.
# See docs/db-migrations.md and bin/db-backup.sh.
# CISO condition (TOG-9837): member-data dumps land ONLY in the
# EU-jurisdiction-pinned `two-web-next-backups` bucket (every wrangler r2
# object call passes --jurisdiction eu). The legacy `paperclip-backups`
# bucket (jurisdiction default / ENAM) is out of scope for member-data dumps.
# Secrets (operator-provisioned, never in logs): PLANETSCALE_STAGING_DATABASE_URL (staging), PRODUCTION_BACKUP_DATABASE_URL (production, read-only role on the
# PlanetScale direct endpoint); Cloudflare credentials resolve per target from
# the bound Environment: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (staging
# Environment) or PRODUCTION_CLOUDFLARE_API_TOKEN / PRODUCTION_CLOUDFLARE_ACCOUNT_ID
# (production Environment), mapped behind the same inputs.target guard.
# While a target is unprovisioned the probe step skips the rest green so the
# schedule is quiet, not red.
# Environment scoping: the job binds `production` only when the production
# target is dispatched, so PRODUCTION_BACKUP_DATABASE_URL (provisioned on the
# production Environment only, never at repo scope) is readable only after the
# Environment's required reviewers and main-only branch policy pass. The
# schedule and staging dispatches bind `staging`, and the production secret is
# never mapped into their steps (ci/check-production-secrets.test.mjs).

on:
  schedule:
    # 03:17Z nightly: off-peak for EU, outside the 10-min reconcile cron.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Database to dump (staging and production = PlanetScale)"
        default: "staging"
        required: false
        type: choice
        options: [staging, production]
      branch:
        description: "Branch prefix: empty (default per target), equal to target, or test-*; other values refuse"
        default: ""
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: backup
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    # Required reviewers + main-only branch policy are live repo settings on
    # the `production` Environment, not YAML.
    environment: ${{ inputs.target || 'staging' }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      BACKUP_TARGET: ${{ inputs.target || 'staging' }}
      BRANCH: ${{ inputs.branch || (inputs.target == 'production' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate branch and target
        run: |
          set -euo pipefail
          python3 bin/backup/branch-target-helper "$BACKUP_TARGET" "$BRANCH" >/dev/null

      - id: probe
        name: Probe provisioning
        env:
          STAGING_URL: ${{ secrets.PLANETSCALE_STAGING_DATABASE_URL }}
          PRODUCTION_URL: ${{ inputs.target == 'production' && secrets.PRODUCTION_BACKUP_DATABASE_URL || '' }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging) ready="$STAGING_URL" ;;
            production) ready="$PRODUCTION_URL" ;;
            *) echo "Unknown backup target: $TARGET" >&2; exit 1 ;;
          esac
          if [ -n "$ready" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Backup target $TARGET not provisioned yet; skipping."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.probe.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.probe.outputs.ready == 'true'

      - name: Install pg_dump 18 (PGDG)
        if: steps.probe.outputs.ready == 'true'
        run: bash bin/backup-bootstrap.sh

      - name: Backup to R2
        if: steps.probe.outputs.ready == 'true'
        env:
          # Staging reads the PlanetScale staging secret; production reads the PlanetScale
          # direct-endpoint secret. The script only ever sees DATABASE_URL.
          DATABASE_URL: ${{ inputs.target == 'production' && secrets.PRODUCTION_BACKUP_DATABASE_URL || secrets.PLANETSCALE_STAGING_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.target == 'production' && secrets.PRODUCTION_CLOUDFLARE_API_TOKEN || inputs.target != 'production' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.target == 'production' && secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID || inputs.target != 'production' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        run: ./bin/db-backup.sh backup "$BRANCH"

      - name: Promote weekly + rotate (Sundays)
        if: steps.probe.outputs.ready == 'true' && github.event.schedule != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.target == 'production' && secrets.PRODUCTION_CLOUDFLARE_API_TOKEN || inputs.target != 'production' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.target == 'production' && secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID || inputs.target != 'production' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        run: |
          set -euo pipefail
          if [ "$(date -u +%u)" = 7 ]; then
            ./bin/db-backup.sh promote-weekly "$BRANCH"
          fi
          ./bin/db-backup.sh rotate "$BRANCH" --apply

      - name: Verify all keys
        if: steps.probe.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.target == 'production' && secrets.PRODUCTION_CLOUDFLARE_API_TOKEN || inputs.target != 'production' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.target == 'production' && secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID || inputs.target != 'production' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        run: ./bin/db-backup.sh check "$BRANCH"
