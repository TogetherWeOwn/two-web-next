name: XFS qualification fixture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualify_cutover:
        description: "Retain the parity-tested all-off Kit and compatible Hono build packet"
        type: boolean
        default: false
      cutover_profile:
        description: "Runtime profile to qualify on isolated staging when retaining a packet"
        type: choice
        options: [all-off, ember]
        default: all-off

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.0, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install XFS tools on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xfsprogs
      - name: Prove mounts and successful cleanup
        run: bash ci/xfs-qualification-fixture.sh node ci/xfs-qualification-fixture.test.mjs
      - name: Qualify public lock helper on real mounts
        run: bash ci/xfs-qualification-fixture.sh node ci/kit-lock-xfs.test.mjs
      - name: Prove cleanup after command failure
        shell: bash
        run: |
          set +e
          bash ci/xfs-qualification-fixture.sh node ci/xfs-qualification-fixture.test.mjs fail
          result=$?
          set -e
          test "$result" -eq 42

  kit-fatal-proof:
    outputs:
      cutover_digest: ${{ steps.production-parity.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac # 17.12-trixie
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: two_web_next
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U agent_test -d two_web_next"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # The recorder identifies the most recent Hono runtime-input commit.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the runner's XFS tool and install locked Node tooling
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          sudo mkfs.xfs -V
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix web --include=dev --ignore-scripts --no-audit --no-fund
      - name: Build stock Kit output
        run: npm run build --prefix web
      - name: Install Chromium for the installed Kit homepage proof
        if: github.event_name != 'workflow_dispatch'
        run: npx --no-install playwright install --with-deps chromium
      - name: Prove installed Kit Worker fatal path and cleanup
        id: fatal
        shell: bash
        run: |
          mkdir -p artifacts/kit-worker-fatal
          bash ci/xfs-qualification-fixture.sh node --import tsx --test --test-timeout=180000 \
            --test-reporter=tap --test-reporter-destination=artifacts/kit-worker-fatal/report.tap \
            ci/kit-worker-fatal.test.mjs | tee artifacts/kit-worker-fatal/cleanup.log
          grep -Fx 'Fixture mounts and backing file removed' artifacts/kit-worker-fatal/cleanup.log
          node ci/rsvp-focus-require-executed.mjs artifacts/kit-worker-fatal/report.tap "Kit built Worker fatal path" 7
      - name: Retain Kit proof evidence
        if: always() && steps.fatal.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-worker-fatal-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
          path: artifacts/kit-worker-fatal/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare disposable runtime role
        env:
          DATABASE_URL: postgres://agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/two_web_next
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ci/disposable-runtime-role.sql -f ci/disposable-runtime-role.sql
      - name: Migrate loopback Postgres and check migration history
        env:
          DATABASE_URL: postgres://agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/two_web_next
        run: |
          npm run db:migrate
          npm run db:check
      - name: Run Kit and Hono against the installed XFS output
        id: installed
        shell: bash
        env:
          KIT_WORKER_TEST_DATABASE_URL: postgres://agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/two_web_next
          KIT_PUBLIC_VOICE_SCREENSHOTS: ${{ runner.temp }}/kit-public-voice
        run: |
          result=0
          proof=()
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            proof=(--public-voice-browser)
          fi
          bash ci/xfs-qualification-fixture.sh bash ci/kit-worker-installed-output.sh "${proof[@]}" \
            | tee "$RUNNER_TEMP/kit-installed-output.log" || result=$?
          grep -Fx 'Fixture mounts and backing file removed' "$RUNNER_TEMP/kit-installed-output.log"
          exit "$result"
      - name: Retain installed Kit public voice screenshots
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && steps.installed.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-public-voice-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kit-public-voice/
          if-no-files-found: ${{ steps.installed.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 14
      - name: Build the Kit cutover server readiness profile
        run: npm run build --prefix web
        env:
          TWO_WEB_1033_COMPAT: "true"
      - name: Record all-off production Kit parity
        id: production-parity
        shell: bash
        env:
          CUTOVER_PACKET_DIR: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.qualify_cutover && format('{0}/kit-cutover-packet', runner.temp) || '' }}
          PARITY_DATABASE_URL: postgres://agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/two_web_next
        run: |
          out=artifacts/production-kit-parity
          mkdir -p "$out"
          rm -f "$out/comparison.json" "$out/upload-rehearsal.json"
          node --test --test-reporter=tap ci/parity/upload-rehearsal.test.mjs | tee "$out/upload-fixtures.tap"
          result=0
          bash ci/xfs-qualification-fixture.sh node --import tsx ci/parity/production.mjs 2>&1 \
            | tee "$out/runner.log" || result=$?
          grep -Fx 'Fixture mounts and backing file removed' "$out/runner.log"
          if (( result == 0 )); then
            node ci/parity/verify-upload-rehearsal.mjs "$out"
          fi
          exit "$result"
      - name: Retain production-config parity evidence
        if: always() && steps.production-parity.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-kit-parity-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
          path: artifacts/production-kit-parity/
          if-no-files-found: error
          retention-days: 14
      - name: Retain exact modules and assets for isolated cutover
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.qualify_cutover
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-cutover-packet-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kit-cutover-packet/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Verify loopback Postgres stopped
        if: always()
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker stop "$POSTGRES_CONTAINER"
          test "$(docker inspect --format '{{.State.Running}}' "$POSTGRES_CONTAINER")" = false
          printf '%s\n' 'Disposable Postgres stopped; the runner removes job services at teardown'

  isolated-cutover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.qualify_cutover
    needs: kit-fatal-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix web --include=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kit-cutover-packet-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kit-cutover-packet
      - name: Stage Hono, exercise Kit, and restore the exact Hono UUID
        timeout-minutes: 15
        run: node ci/kit-cutover-staging.mjs "$RUNNER_TEMP/kit-cutover-packet" "$RUNNER_TEMP/proof.json"
        env:
          CUTOVER_PACKET_DIGEST: ${{ needs.kit-fatal-proof.outputs.cutover_digest }}
          CUTOVER_PROFILE: ${{ inputs.cutover_profile }}
          KIT_CUTOVER_TEST_DATABASE_HOST: ${{ vars.KIT_CUTOVER_TEST_DATABASE_HOST }}
          KIT_CUTOVER_TEST_DATABASE_URL: ${{ secrets.KIT_CUTOVER_TEST_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      - name: Remove this attempt's isolated Worker, database and login
        if: always()
        run: node ci/kit-cutover-staging.mjs --cleanup
        env:
          KIT_CUTOVER_TEST_DATABASE_HOST: ${{ vars.KIT_CUTOVER_TEST_DATABASE_HOST }}
          KIT_CUTOVER_TEST_DATABASE_URL: ${{ secrets.KIT_CUTOVER_TEST_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Retain successful isolated cutover proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-cutover-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof.json
          if-no-files-found: error
          retention-days: 30
