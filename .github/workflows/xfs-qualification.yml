name: XFS qualification fixture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.0, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install XFS tools on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xfsprogs
      - name: Prove mounts and successful cleanup
        run: bash ci/xfs-qualification-fixture.sh node ci/xfs-qualification-fixture.test.mjs
      - name: Qualify public lock helper on real mounts
        run: bash ci/xfs-qualification-fixture.sh node ci/kit-lock-xfs.test.mjs
      - name: Prove cleanup after command failure
        shell: bash
        run: |
          set +e
          bash ci/xfs-qualification-fixture.sh node ci/xfs-qualification-fixture.test.mjs fail
          result=$?
          set -e
          test "$result" -eq 42
