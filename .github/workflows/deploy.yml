name: deploy
# The deployed commit, queryable later: workflow_run runs record main's tip as head_sha.
run-name: deploy ${{ github.event.workflow_run.head_sha || github.sha }}

# Staging deploy after successful full CI on main. Production (togetherweown.com) is only
# switched at cutover (plan TOG-9671, W16): there is deliberately no prod job here.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      kit_route_family:
        description: Kit staging route family; the default keeps all routes on Hono
        type: choice
        required: true
        default: hono
        options:
          - hono
          - archive
          - archive-static

permissions:
  contents: read
  actions: read

jobs:
  deploy-staging:
    name: deploy-staging
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Rejected completion events must not replace a successful pending deploy.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # The org's two-selfhosted runner group refuses public repositories, so a
    # fixed self-hosted label strands this job while the repo is public
    # (TOG-12326). Public: GitHub-hosted, free for public repos. Private:
    # back on the self-hosted fleet with no workflow change.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # The canonical GitHub Deployment record for this deploy event.
      deployments: write
    # Environment secrets and the deployed staging URL. Exact-SHA CI, the
    # staging hold and post-deploy verification are the automated release gates.
    environment:
      name: staging
      url: https://next.togetherweown.com
    # Self-hosted runners share one Docker host, so wrangler's dev ports
    # collide across concurrent jobs. A job container has its own network
    # namespace.
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's github.sha is main's tip, not the successful CI SHA.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Two commits of history: the smoke-scope step below diffs the
          # deployed HEAD against its parent.
          fetch-depth: 2
          persist-credentials: false
      - name: Staging admission hold (before dependencies or mutations)
        # Staging-only containment: only exactly "false" releases the direct
        # staging migration path. Absent, "true" and malformed values all hold.
        # Never applies to production.
        # The deploy-staging job runs in a container where the default run
        # shell is sh (dash), which rejects `set -o pipefail` and `[[ ]]`.
        # Keep this script POSIX and pin bash so it passes under either shell.
        shell: bash
        env:
          STAGING_MIGRATION_HOLD: ${{ vars.STAGING_MIGRATION_HOLD }}
        run: |
          set -eu
          [ "${STAGING_MIGRATION_HOLD:-}" = false ] || { printf '%s\n' 'Staging migrations are held (STAGING_MIGRATION_HOLD is not exactly "false").' >&2; exit 1; }
      - name: Require successful exact-SHA full CI
        run: node ci/staging-deploy-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Worker bundle imports web/src modules, so wrangler needs the Kit
      # workspace dependencies (same install as ci.yml).
      - run: npm ci --prefix web --include=dev --no-audit --no-fund
      - name: Select Kit route families
        id: kit-route-flags
        env:
          KIT_ROUTE_FAMILY: ${{ github.event_name == 'workflow_dispatch' && inputs.kit_route_family || 'hono' }}
        run: node ci/kit-route-flags.mjs
      # No test re-run here: the exact-SHA gate above (re-checked before each
      # mutation below) requires full CI, which already ran every `npm run
      # check` part on this commit. A second copy outgrew this job's timeout.
      # Deploy build step: regenerate the served public/ assets from assets/
      # with esbuild --minify and refuse drift. Deterministic: a no-op when
      # CI's drift check passed, so the deployed bytes are the reviewed bytes.
      - name: Build minified public assets (esbuild, drift fails closed)
        run: npm run build:assets:check
      # Build identity (source SHA, build ID, input-set digest) is generated
      # BEFORE the single compile and compiled into the payload. The
      # environment deploy event and GitHub Deployment ID are not compiled:
      # they are attached to the Worker Version below as runtime bindings.
      - name: Generate build stamp (before the compile)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t inputs < <(bash ci/build-stamp-inputs.sh)
          args=()
          for f in "${inputs[@]}"; do args+=(--input "$f"); done
          # The checkout above is already the CI-verified commit.
          node ci/deploy-identity.mjs stamp --sha "$(git rev-parse HEAD)" --build-id "${BUILD_ID:?}" --out src/build-stamp.ts "${args[@]}"
        env:
          BUILD_ID: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build Kit staging Worker
        run: npm run build --prefix web
      - name: Moderator role-config preflight (before any Cloudflare mutation)
        # Read the same top-level source var Wrangler deploys, not a CI secret.
        run: npm run check:worker-moderators
      - name: Capture pre-deploy dead-letter baseline
        id: dead-letter-baseline
        # Read-only GET before any DB or Cloudflare mutation (migrations run
        # below can enqueue work): queue.failed counts retained rows in
        # queue_failed_jobs, so the post-deploy smoke fails only on growth
        # past this count. Retried, then an unreadable /up leaves the baseline
        # empty and the smoke skips the dead-letter gate on history (warning
        # below) instead of failing on any positive count. Never fails the
        # deploy on its own.
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          for i in 1 2 3 4 5; do
            candidate="$(node -e 'fetch("https://next.togetherweown.com/up", { signal: AbortSignal.timeout(10000) }).then((r) => r.json()).then((d) => { const f = d && d.queue ? d.queue.failed : undefined; if (typeof f === "number" && Number.isInteger(f) && f >= 0) process.stdout.write(String(f)); }).catch(() => {})' || true)"
            if [ -n "$candidate" ]; then baseline="$candidate"; break; fi
            if [ "$i" -lt 5 ]; then sleep 5; fi
          done
          if [ -z "$baseline" ]; then echo "::warning::dead-letter baseline unreadable after 5 attempts; smoke will skip the dead-letter gate on history"; fi
          echo "failed=$baseline" >> "$GITHUB_OUTPUT"
          echo "dead-letter baseline: ${baseline:-unknown}"
      # Staging web schema (TOG-12965). The Worker's /up gate and event queries
      # need the migrations of the SHA being deployed, so apply them after every
      # check has passed and before the first Cloudflare mutation: a failed plan,
      # apply or verify fails the job here and nothing reaches Cloudflare. Same
      # ci/db-migrate.mjs as db-migrate.yml (journal-prefix check, advisory
      # lock, PITR timestamp, zero-pending post-check). Staging only: production
      # is never migrated from this workflow.
      - name: Plan staging web migrations (read-only journal diff)
        run: node ci/db-migrate.mjs plan
        env: &staging-migration-env
          MIGRATION_TARGET: staging
          STAGING_MIGRATION_HOLD: ${{ vars.STAGING_MIGRATION_HOLD }}
          # `staging` Environment secret of this job; no DATABASE_URL fallback.
          PLANETSCALE_STAGING_DATABASE_URL: ${{ secrets.PLANETSCALE_STAGING_DATABASE_URL }}
          # workflow_run's GITHUB_SHA is main's tip; the receipt must name the CI-verified checkout.
          GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Re-verify exact-SHA full CI before staging migration
        # DDL is a remote mutation too; the checks above may outlive the accepted CI attempt.
        run: node ci/staging-deploy-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Apply staging web migrations (advisory lock, PITR timestamp)
        run: node ci/db-migrate.mjs apply
        env: *staging-migration-env
      - name: Verify zero pending staging web migrations
        run: node ci/db-migrate.mjs verify
        env: *staging-migration-env
      # Rollback pointer, read from the live Worker before any Cloudflare
      # mutation. /up reports the Worker Version ID that `wrangler rollback`
      # takes; this only logs it, so a Worker that predates the marker, or an
      # unreachable /up, never fails the deploy.
      - name: Record live revision (rollback pointer)
        run: node bin/revision-check.mjs https://next.togetherweown.com
      - name: Verify jobs Worker BOT secrets exist (fail-closed)
        # Read-only preflight before the first Cloudflare mutation (queue
        # creation below). The jobs deploy attaches the jobs consumer
        # automatically; without its BOT_* secrets every bot job fails
        # terminally and the consumer acks the message
        # (src/jobs/consumer.ts), so deliveries leave the queue and need a
        # manual replay. Fail here, before anything mutates, when a name is
        # missing. Names only, never values (docs/jobs-handoff.md).
        run: node ci/check-jobs-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure queues exist
        # Idempotent: "already exists" is fine; a real permission error surfaces at deploy.
        run: |
          for q in two-sync-event two-internal-action; do
            # Preparation or an earlier mutation may outlive the accepted CI attempt.
            node ci/staging-deploy-gate.mjs || exit 1
            npx wrangler queues create "$q" || true
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Re-verify exact-SHA full CI before Tail Worker deploy
        # The Tail Worker is a Cloudflare mutation too; queue creation may outlive the accepted CI attempt.
        run: node ci/staging-deploy-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy alert Tail Worker before attaching the app
        # The app's tail_consumers binding needs the consumer to exist first.
        run: npx wrangler deploy --config tail/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The deploy event ID is minted and its canonical Deployment record is
      # created BEFORE the Version upload, because the numeric Deployment ID is
      # a runtime binding of that Version. The deploy-staging concurrency group
      # serializes the lane, so the same-day counter cannot race itself.
      - name: Allocate deploy event ID (environment-scoped, UTC-dated)
        id: deploy-event
        run: node ci/deploy-identity.mjs next --environment staging --sha "$(git rev-parse HEAD)" --saved "${RUNNER_TEMP:?}/deploy-event-id.txt" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create canonical GitHub Deployment record
        id: deployment
        run: node ci/deploy-identity.mjs create --environment staging --sha "$(git rev-parse HEAD)" --deploy-event-id "${DEPLOY_EVENT_ID:?}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_EVENT_ID: ${{ steps.deploy-event.outputs.DEPLOY_EVENT_ID }}
      - name: Re-verify exact-SHA full CI before Worker deploy
        # Queue creation or the Tail deploy may outlive the accepted CI attempt; this step runs directly before the deploy.
        run: node ci/staging-deploy-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare Workers
        # The Version is tagged with the CI-verified commit; /up reads the tag
        # back as revision.commit (a full lowercase SHA only). The Kit Worker
        # only produces after the handoff. Deploying the consumer-free config
        # does NOT detach the existing consumers: Wrangler only adds or updates
        # the consumers listed in the deployed config, never deletes a dropped
        # one. The detach step below removes them explicitly before the jobs
        # Worker attaches, so two consumers never exist. Route flags come only
        # from the validated workflow input and default to Hono ownership.
        run: npx wrangler deploy --config web/wrangler.staging.jsonc --tag "${DEPLOY_SHA:?}" --var "KIT_ROUTE_ARCHIVE:${{ steps.kit-route-flags.outputs.archive }}" --var "KIT_ROUTE_STATIC:${{ steps.kit-route-flags.outputs.static }}" --var "DEPLOY_EVENT_ID:${DEPLOY_EVENT_ID:?}" --var "DEPLOYMENT_ENVIRONMENT:${DEPLOYMENT_ENVIRONMENT:?}" --var "GITHUB_DEPLOYMENT_ID:${GITHUB_DEPLOYMENT_ID:?}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # workflow_run's github.sha is main's tip; tag the CI-verified checkout.
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Version-scoped, non-secret runtime identity (never in wrangler config).
          DEPLOY_EVENT_ID: ${{ steps.deploy-event.outputs.DEPLOY_EVENT_ID }}
          DEPLOYMENT_ENVIRONMENT: staging
          GITHUB_DEPLOYMENT_ID: ${{ steps.deployment.outputs.GITHUB_DEPLOYMENT_ID }}
      - name: Re-verify exact-SHA full CI before detaching web consumers
        # The web deploy may outlive the accepted CI attempt; this step runs directly before the detach.
        run: node ci/staging-deploy-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Detach staging web queue consumers (idempotent)
        # The consumer-free web deploy above leaves worker:two-web-next attached
        # to both staging queues. Remove it explicitly so the jobs deploy below
        # does not collide with a conflicting consumer. Idempotent: the list
        # check makes a re-run after a partial detach a no-op, and removing an
        # already-absent consumer is never an error here.
        run: |
          for q in two-sync-event two-internal-action; do
            # Preparation or an earlier mutation may outlive the accepted CI attempt.
            node ci/staging-deploy-gate.mjs || exit 1
            # The step shell is dash without pipefail: a failed list piped
            # into grep reads as "no consumer" and the jobs deploy then
            # collides with the still-attached web consumer. Capture first so
            # a failed list fails the job instead.
            out=$(npx wrangler queues consumer list "$q") || exit 1
            if printf '%s' "$out" | grep -q "two-web-next"; then
              npx wrangler queues consumer remove "$q" two-web-next
            else
              echo "no two-web-next consumer on $q"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Re-verify exact-SHA full CI before jobs Worker deploy
        # The web deploy may outlive the accepted CI attempt; this step runs directly before the jobs deploy.
        run: node ci/staging-deploy-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy staging jobs Worker (queues + cron owner)
        # two-web-jobs consumes the staging queues and owns both crons
        # (docs/jobs-handoff.md). Same tag as the web Worker. Its BOT_*
        # secrets are Operator-provisioned, never in source, and verified by
        # the preflight above; QA_AUTH_TOKEN stays optional (probe-only).
        run: npx wrangler deploy --config wrangler.jobs.jsonc --tag "${DEPLOY_SHA:?}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # Runs on every deploy (the smoke steps below skip docs-only ones): the
      # live Worker must report the commit this job just deployed, with the
      # Version ID it will be rolled back from. Retries while the old Version
      # still serves.
      - name: Verify deployed revision
        run: node bin/revision-check.mjs https://next.togetherweown.com "$DEPLOY_SHA"
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # The live Worker must answer exactly the identity just recorded. Retries
      # while the old Version still serves; fails closed when it never matches.
      - name: Verify deployed identity (/version and /readyz)
        run: |
          for i in 1 2 3 4 5 6; do
            if node ci/deploy-identity.mjs verify --origin https://next.togetherweown.com --sha "$(git rev-parse HEAD)" --deploy-event-id "${DEPLOY_EVENT_ID:?}" --deployment-id "${GITHUB_DEPLOYMENT_ID:?}"; then
              exit 0
            fi
            if [ "$i" -lt 6 ]; then
              echo "identity attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::deployed identity did not match the recorded deploy event"
          exit 1
        env:
          DEPLOY_EVENT_ID: ${{ steps.deploy-event.outputs.DEPLOY_EVENT_ID }}
          GITHUB_DEPLOYMENT_ID: ${{ steps.deployment.outputs.GITHUB_DEPLOYMENT_ID }}
      # Post-deploy smoke scope (mirrors e2e-staging.yml): a deploy whose
      # head commit only touches docs prose or the `test/` unit tree the
      # checkers never execute skips the smoke steps below — the full suite,
      # including those tests, already passed in the exact-SHA full CI run.
      # ci/change-scope.sh fails closed: every other path runs the smoke.
      - name: Scope post-deploy smoke to web-affecting changes
        id: smoke-scope
        # The deploy-staging job runs in a container where the default run
        # shell is sh (dash), which rejects `set -o pipefail`. Run this step
        # under bash.
        shell: bash
        run: |
          set -euo pipefail
          # A deploy with no parent (practically impossible on main) fails
          # closed: run the smoke rather than failing the deploy on scope.
          if ! git rev-parse --verify --quiet "HEAD~1" >/dev/null; then
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same shape as the pull-request files API that ci/change-scope.sh
          # reads in e2e.yml: one `filename<TAB>previous_filename` line per
          # changed file. Rename rows print old-then-new, so they are swapped.
          git diff --name-status -M "HEAD~1" HEAD \
            | awk -F'\t' '{ if ($1 ~ /^R/) print $3 "\t" $2; else print $2 "\t" }' > "$RUNNER_TEMP/deployed-files.tsv"
          EXPECTED=$(wc -l < "$RUNNER_TEMP/deployed-files.tsv")
          bash ci/change-scope.sh "$RUNNER_TEMP/deployed-files.tsv" "$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Smoke test staging public routes
        if: steps.smoke-scope.outputs.skip_e2e != 'true'
        # bin/smoke.mjs requires /up db:ok + pending_migrations:0, fails
        # only on new dead letters (a positive numeric queue.failed above the
        # pre-deploy baseline fails the deploy with the count; null/missing
        # never fails on its own; an unreadable baseline skips the gate via
        # SMOKE_ALLOW_MISSING_BASELINE instead of failing on history), and
        # fails closed on a stuck queue via --fail-on-ready-wait-critical
        # (S6, staging-only: the age reflects the shared queue_jobs table,
        # not the version under test, so production promote and post-rollback
        # smoke omit the flag and stay warn-only). Queue-only
        # degraded/unknown still pass.
        env:
          SMOKE_FAILED_BASELINE: ${{ steps.dead-letter-baseline.outputs.failed }}
          SMOKE_ALLOW_MISSING_BASELINE: "1"
        run: |
          for i in 1 2 3 4 5 6; do
            if node bin/smoke.mjs https://next.togetherweown.com --fail-on-ready-wait-critical; then
              echo "staging smoke ok (attempt $i)"
              exit 0
            fi
            if [ "$i" -lt 6 ]; then
              echo "attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::staging public-route smoke failed after deploy"
          exit 1
      - name: Smoke test staging event JSON contract
        if: steps.smoke-scope.outputs.skip_e2e != 'true'
        # Authenticated JSON show/paging probe through the staging QA seam.
        # Needs the staging-environment QA_AUTH_TOKEN secret: it is never a
        # repository secret/value in this file, only a name. When the secret is
        # absent the step replays a per-check SKIP ledger (the probe's own
        # --skip-ledger mode, same check names) for evidence and then fails
        # closed, so the missing token fails the deploy instead of passing
        # with unverified guards. Skipped exposure guards stay loud:
        # every skipped guard is named with its reason in the log, in an
        # error annotation and in the step summary, pointing at tracked
        # follow-up #531. A passed probe with skipped guards warns the same
        # way. The reporting lines below must never mask the failure themselves.
        run: |
          LEDGER="$RUNNER_TEMP/json-smoke-ledger.json"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ -z "${QA_AUTH_TOKEN:-}" ]; then
            echo "json-smoke skipped: staging QA_AUTH_TOKEN is not configured"
            node bin/json-smoke.mjs --skip-ledger "staging QA_AUTH_TOKEN is not configured" --ledger "$LEDGER" || echo "::warning::staging json-smoke skipped with unverified exposure guards (ledger write failed). Tracked follow-up: #531"
            if [ -f "$LEDGER" ]; then
              node bin/json-smoke.mjs --report-ledger "$LEDGER" "Staging event-JSON smoke: skipped (no QA token)" "staging json-smoke skipped with unverified exposure guards" >> "$SUMMARY" || echo "::warning::staging json-smoke skipped with unverified exposure guards (ledger report failed). Tracked follow-up: #531"
            else
              echo "::warning::staging json-smoke skipped with unverified exposure guards (ledger unwritten). Tracked follow-up: #531"
            fi
            echo "::error::staging event-JSON smoke missing QA token: exposure guards unverified"
            exit 1
          fi
          for i in 1 2 3 4 5 6; do
            if node bin/json-smoke.mjs --ledger "$LEDGER" https://next.togetherweown.com; then
              echo "staging json-smoke ok (attempt $i)"
              if [ -f "$LEDGER" ]; then
                node bin/json-smoke.mjs --report-ledger "$LEDGER" "Staging event-JSON smoke: passed (attempt $i)" "staging json-smoke passed with skipped exposure guards" >> "$SUMMARY" || echo "::warning::staging json-smoke passed with skipped exposure guards (ledger report failed). Tracked follow-up: #531"
              fi
              exit 0
            fi
            if [ "$i" -lt 6 ]; then
              echo "attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::staging event-JSON smoke failed after deploy"
          exit 1
        env:
          QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      # Truthful final status, posted only after the deployed-revision,
      # identity and public-route proofs above all passed.
      - name: Record final Deployment status (success)
        id: final-status
        run: node ci/deploy-identity.mjs status --deployment-id "${GITHUB_DEPLOYMENT_ID:?}" --deploy-event-id "${DEPLOY_EVENT_ID:?}" --state success --run-url "${RUN_URL:?}" --environment-url https://next.togetherweown.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_EVENT_ID: ${{ steps.deploy-event.outputs.DEPLOY_EVENT_ID }}
          GITHUB_DEPLOYMENT_ID: ${{ steps.deployment.outputs.GITHUB_DEPLOYMENT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Only when the lane failed before the success status ran. Best effort:
      # it never replaces the failure that triggered it.
      - name: Record failure Deployment status
        if: failure() && steps.deployment.outputs.GITHUB_DEPLOYMENT_ID != '' && steps.final-status.outcome == 'skipped'
        run: node ci/deploy-identity.mjs status --deployment-id "${GITHUB_DEPLOYMENT_ID:?}" --deploy-event-id "${DEPLOY_EVENT_ID:?}" --state failure --run-url "${RUN_URL:?}" --environment-url https://next.togetherweown.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_EVENT_ID: ${{ steps.deploy-event.outputs.DEPLOY_EVENT_ID }}
          GITHUB_DEPLOYMENT_ID: ${{ steps.deployment.outputs.GITHUB_DEPLOYMENT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
