name: deploy

# Staging deploy on merge to main. Production (togetherweown.com) is only
# switched at cutover (plan TOG-9671, W16): there is deliberately no prod job here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: deploy-staging
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 15
    # Production-style gate: GitHub Environment protection rules (required
    # reviewers, etc.) apply to staging deploys the same way they would to prod.
    environment:
      name: staging
      url: https://next.togetherweown.com
    # Match CI's disposable SQL target; never run tests on the staging binding.
    # Self-hosted runners share one Docker host, so a published 5432 (and
    # wrangler's dev ports) collide across concurrent jobs. A job container has
    # its own network namespace; localhost:5432 is forwarded to the service.
    container:
      image: node:24-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Job-private localhost:5432 forward to the Postgres service
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends socat postgresql-client >/dev/null
          nohup setsid socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 >/dev/null 2>&1 &
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -U postgres && exit 0; sleep 1; done
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply test migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      - run: npm run check
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      - name: Moderator role-config preflight (before any Cloudflare mutation)
        # Read the same top-level source var Wrangler deploys, not a CI secret.
        run: npm run check:worker-moderators
      - name: Ensure queues exist
        # Idempotent: "already exists" is fine; a real permission error surfaces at deploy.
        run: |
          for q in two-sync-event two-internal-action; do npx wrangler queues create "$q" || true; done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test /up
        # /up is always 200: degraded/unknown queue health must not fail a deploy.
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 10 -o "$RUNNER_TEMP/up.json" -w "%{http_code}" https://next.togetherweown.com/up) || code="000"
            if [ "$code" = "200" ] && node -e '
              try {
                const body = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
                process.exit(["healthy", "degraded"].includes(body?.status) && ["healthy", "degraded", "unknown"].includes(body?.queue?.status) ? 0 : 1);
              } catch { process.exit(1); }
            ' "$RUNNER_TEMP/up.json"; then
              echo "smoke ok (attempt $i)"
              exit 0
            fi
            echo "attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "::error::staging /up did not return 200 with the expected health envelope after deploy"
          exit 1
