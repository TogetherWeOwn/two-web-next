name: Candidate staging fixtures

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - 'ci/candidate-staging-*.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-staging-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: candidate-staging-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Existing locked YAML/esbuild/Wrangler libraries are fixture dependencies.
      # No lifecycle script, provider token, database or deployment is needed.
      - name: Install locked fixture dependencies without lifecycle hooks
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          NPM_CONFIG_MIN_RELEASE_AGE: '3'
        run: |
          npm --version
          env -u NPM_CONFIG_MIN_RELEASE_AGE npm config list --long | grep -q '^min-release-age = '
          npm ci --include=dev --ignore-scripts
      # Drafts execute these fixtures; their normal full CI gates stay unchanged.
      - name: Record tested head and run inert qualification fixtures
        run: |
          git rev-parse HEAD
          node --test ci/candidate-staging-*.test.mjs
