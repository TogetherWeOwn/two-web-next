name: PR lint

# Org convention for every change that lands on main (TogetherWeOwn GitHub standard):
#   * PR title = Conventional Commits header: `type(scope): summary`, <= 100 chars, no trailing period.
#     Types: feat fix perf refactor test docs build ci chore revert style security.
#     Put the card ID in the body (`Refs: TOG-1234`), not in the title.
#   * PR body explains what changed, why, and how it was tested.
#   * Repos are squash-merge only and the squash commit title is the PR title, so the history on
#     main is one conventional commit per PR. The push job below flags any commit that bypasses it
#     (for example a merge call that passes its own commit_title).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Dispatched by the release workflow (TOG-9865) on release-please branches:
  # PRs opened with GITHUB_TOKEN trigger no workflows, so the required
  # `pr-lint` check would never run on the release PR without this path.
  # The release workflow passes the release PR number; this job fetches the
  # title/body via the API (needs pull-requests: read) and validates them with
  # the same ci/check-pr-conventions.py script as the pull_request path.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Release PR number to validate"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-lint-${{ github.event.pull_request.number || inputs.pr_number || github.sha }}
  cancel-in-progress: true

env:
  REQUIRE_CARD_REF: "true"

jobs:
  pr-lint:
    name: pr-lint
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bind PR metadata to its head, not a merge whose base may have advanced.
          # https://github.com/actions/checkout/blob/v7.0.1/README.md#checkout-pull-request-head-commit-instead-of-merge-commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve PR title/body
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 ci/pr-lint-output.py resolve

      - name: Check title, body and commits
        env:
          PR_METADATA_PATH: ${{ steps.pr.outputs.metadata }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: python3 ci/pr-lint-output.py check
