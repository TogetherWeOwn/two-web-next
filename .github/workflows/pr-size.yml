# Pull-request size labels + required size gate (TogetherWeOwn standard;
# see STANDARD.md in TogetherWeOwn/.github, "Advisory PR-size labels" and
# "PR size gate").
#
# The org reusable gate runs the advisory labeller before evaluating the required
# size limit. A label failure only warns, including on forks with read-only
# tokens. The required context is `pr-size-gate / gate`.
#
# The gate fails closed on measurement. Label changes and submitted or
# dismissed reviews re-evaluate an exception without a manual re-run.
#
# The weekly tally's schedule lives here, in the caller, because the tally
# is per-repository. It calls a SEPARATE reusable file so this job can stay
# read-only: GitHub checks a reusable workflow's nested-job permissions
# against the caller job's grant when parsing the workflow, ignoring `if:`,
# so each caller job below grants only what the file it calls requests.

name: pr-size

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to label and gate now (blank runs the weekly tally)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-size-gate:
    name: pr-size-gate
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || inputs.pr_number != ''
    permissions:
      contents: read
      issues: write # Create advisory size labels and the size-exception label.
      pull-requests: write # Apply advisory size labels and maintain the PR comments.
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-gate.yml@649943c1ed8a1af8f8760e075f3923237dd72e50
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      exclude-extra: "public/islands/**,public/styles.css,drizzle/meta/**"
      advisory-label: true

  pr-size-weekly:
    name: pr-size-weekly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
    permissions:
      contents: read
      issues: read # Read size labels for the weekly tally.
      pull-requests: read # Read merged PRs for the weekly tally.
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-weekly.yml@649943c1ed8a1af8f8760e075f3923237dd72e50
