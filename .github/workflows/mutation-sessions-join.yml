name: mutation-sessions-join

# Nightly mutation signal for the auth blast radius (`src/sessions.ts`,
# `src/join/service.ts`, `src/join/route-start.ts` / `src/join/route-callback.ts`,
# RSVP write admission in `src/events/routes-rsvp.tsx` / `src/events/rsvp.ts`,
# admin write admission in `src/admin/guard.ts` / `src/admin/writeback.ts`,
# moderator recompute in `src/roles.ts`, wall-time admission in
# `src/admin/validation-wall-time.ts`, and the agent-events ingress in
# `src/agent-events/ingress.ts` / `src/agent-events/route.ts`). The runner weakens one
# auth check at a time and runs the hermetic DB-free kill suite against it;
# survivors are coverage gaps and are listed in the uploaded report artifact.
# Hermetic on purpose: no database, no Discord, no secrets, so a schedule tick
# can never be blocked on a service.
#
# Non-blocking by design: this workflow gates no merge. The required checks
# stay exactly `ci-ok`, `gitleaks`, `e2e-ok` and `pr-lint`; there is
# deliberately no
# aggregator job here, so a red or skipped nightly never blocks anything.

on:
  # After the ci nightly full run, on an off-minute so fleet wake-ups spread.
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-sessions-join
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation
    # Public repo: standard GitHub-hosted Linux only, no larger or third-party runner.
    runs-on: ubuntu-latest
    # 30 kill runs, each capped at 5 minutes by the runner, plus setup.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Mutation harness selftest
        run: npm run mutation:sessions-join:selftest
      - name: Mutation run (sessions + join + rsvp + admin + agent-events)
        run: npm run mutation:sessions-join
      - name: Surviving-mutant report summary
        if: always() && hashFiles('artifacts/mutation-sessions-join/report.md') != ''
        run: cat artifacts/mutation-sessions-join/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Surviving-mutant report artifact (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-sessions-join-${{ github.sha }}
          path: artifacts/mutation-sessions-join/
          if-no-files-found: warn
          retention-days: 14
