name: pr-evidence
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  workflow_run:
    workflows: [ci, e2e, pr-gates, pr-size, "PR standards (required entry point)"]
    types: [requested, in_progress, completed]
permissions: {}

jobs:
  route:
    if: >-
      github.event_name == 'pull_request_target' && github.base_ref == 'main' ||
      contains(fromJSON('["pull_request","pull_request_review"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      numbers: ${{ steps.route.outputs.numbers }}
    steps:
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            numbers=$(jq -ce '[.number]' "$GITHUB_EVENT_PATH")
          else
            sha=$(jq -er '.workflow_run.head_sha | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")
            # The event's association can be empty for fork PRs.
            numbers=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$sha/pulls?per_page=100" |
              jq -ce '[.[][] | select(.state == "open" and .base.ref == "main") | .number] | unique')
          fi
          numbers=$(jq -ce 'select(all(.[]; type == "number" and . > 0 and floor == .))' <<< "$numbers")
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

  publish:
    needs: route
    if: needs.route.outputs.numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.route.outputs.numbers) }}
    concurrency:
      group: pr-evidence-${{ matrix.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # The updater executes only the trusted workflow revision, even for fork PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish current PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.number }}
        run: python3 ci/pr_evidence.py
