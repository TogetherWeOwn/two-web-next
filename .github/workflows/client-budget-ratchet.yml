name: client-budget-ratchet

# Never workflow_run, pull_request_target or a PR artifact. Both jobs use the
# exact trusted main push; generated data is parsed, not executed by the writer.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-budget-ratchet
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Locked install and credential-free measurement
        run: |
          npm ci --include=dev
          npm ci --prefix web --include=dev
          npm run build --prefix web
          node --test ci/check-kit-route-perf.test.mjs ci/kit-client-ratchet.test.mjs
          npm run budget
          node ci/check-kit-perf.mjs
          node ci/check-kit-route-perf.mjs
          node ci/kit-client-ratchet.mjs measure "$RUNNER_TEMP/client-measurement.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-measurement
          path: ${{ runner.temp }}/client-measurement.json
          if-no-files-found: error
          retention-days: 14

  propose:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: client-measurement
          path: ${{ runner.temp }}/client-ratchet-data
      - name: Propose lower-only draft with expected-head protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/kit-client-ratchet.mjs publish "$RUNNER_TEMP/client-ratchet-data/client-measurement.json"
