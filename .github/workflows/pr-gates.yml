name: pr-gates

# Lightweight PR gates (TOG-11811): PR-title lint + full-history secret scan in
# ONE workflow with sequential jobs, so a PR push occupies one runner slot at a
# time instead of two parallel `pr-lint` + `secret-scan` runs.
#
# Required-check names are the JOB names, not the workflow name, and are pinned
# equal to the ids: `pr-lint` (ruleset pr-conventions) and `gitleaks` (ruleset
# protect-main). Keep both names byte-identical or merges block.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Dispatched by the release workflow (TOG-9865) on release-please branches:
  # PRs opened with GITHUB_TOKEN trigger no workflows, so the required
  # `pr-lint` check would never run on the release PR without this path.
  # The release workflow passes the release PR number; the pr-lint job fetches
  # the title/body via the API and validates them with the same
  # ci/check-pr-conventions.py script as the pull_request path.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Release PR number to validate"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REQUIRE_CARD_REF: "true"

jobs:
  # Org convention for every change that lands on main (TogetherWeOwn GitHub standard):
  #   * PR title = Conventional Commits header: `type(scope): summary`, <= 100 chars, no trailing period.
  #     Types: feat fix perf refactor test docs build ci chore revert style security.
  #     Put the card ID in the body (`Refs: TOG-1234`), not in the title.
  #   * PR body explains what changed, why, and how it was tested.
  #   * Repos are squash-merge only and the squash commit title is the PR title, so the history on
  #     main is one conventional commit per PR. The push job below flags any commit that bypasses it
  #     (for example a merge call that passes its own commit_title).
  #
  # name pinned equal to the id: `pr-lint` is a required check.
  pr-lint:
    name: pr-lint
    # Overflow switch: see CI_OVERFLOW_* note in the main CI workflow.
    runs-on: ${{ fromJSON((contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'pr-lint') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    env:
      # Metadata lint needs the immutable PR head, not a regenerated merge ref
      # whose base can differ from the event snapshot. Push/dispatch keep their SHA.
      PR_LINT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_LINT_CHECKOUT_SHA }}

      - name: Resolve PR title/body
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 ci/pr-lint-output.py resolve

      - name: Check title, body and commits
        env:
          PR_METADATA_PATH: ${{ steps.pr.outputs.metadata }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: python3 ci/pr-lint-output.py check

  # Full-history gitleaks scan; `gitleaks` is a required check on main. Uses
  # the gitleaks binary (the gitleaks-action wrapper needs a paid licence for
  # organizations). --redact so findings never print the value. A secret that
  # reaches a branch is already leaked: report it, do not just delete the line.
  #
  # Sequential after pr-lint (TOG-11811): one runner slot at a time.
  # name pinned equal to the id: `gitleaks` is a required check.
  gitleaks:
    name: gitleaks
    needs: pr-lint
    # Overflow switch: see CI_OVERFLOW_* note in the main CI workflow.
    runs-on: ${{ fromJSON((contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'gitleaks') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret added and then removed in an earlier commit
          # on the same branch is still a leak, and a shallow clone hides it.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          # $RUNNER_TEMP is job-private; 16 runners share one /tmp.
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full history
        run: |
          set -euo pipefail
          # --log-opts=HEAD: scan only history reachable from HEAD, not every fetched branch.
          gitleaks git . --redact --verbose --exit-code 1 --log-opts=HEAD
