name: pr-gates

# Lightweight PR gates: PR-title lint + full-history secret scan in ONE
# workflow with sequential jobs, so a PR push occupies one runner slot at a
# time instead of two parallel `pr-lint` + `secret-scan` runs.
#
# Required-check names are the JOB names, not the workflow name, and are pinned
# equal to the ids: `pr-lint` (ruleset pr-conventions) and `gitleaks` (ruleset
# protect-main). Keep both names byte-identical or merges block.
#
# Runner separation: pull_request and merge_group runs always use
# GitHub-hosted runners (see the CI_OVERFLOW_* note in the main CI workflow
# and docs/private-flip-checklist.md); only main pushes and manual dispatches
# may reach the self-hosted fleet while the repository is private.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  # Manual validation of an open PR by number (releases no longer dispatch it:
  # there is no release PR, docs/releases.md). The pr-lint job fetches
  # the title/body via the API and validates them with the same
  # ci/check-pr-conventions.py script as the pull_request path.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Release PR number to validate"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# A pull_request run cancels its superseded run; a manual dispatch never
# cancels. Each push to main keeps its own group: pr-lint checks that push's
# commits, so a newer push must not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # This repository is public, so internal card IDs (TOG-1234, PAP-1234) must stay out of PR
  # text. "warning" reports them without failing; flip to "error" once open PRs are clean.
  INTERNAL_ID_LEVEL: "warning"
  # Upstream body/branch/reference rules (`.github/scripts/pr_standards.py`): tracker IDs,
  # instance UI links and the internal host in a public title or body always fail; the rest
  # start as warnings; flip to "error" once the repo's open PRs are clear (target 2026-10-10).
  PR_STANDARDS_MODE: "warn"
  # Dedicated cutoff (PR number) for branch-name internal-ID *errors* on public repos.
  # PRs numbered at/above this value get an error for internal IDs in the head ref;
  # older open PRs keep the warning (a head ref cannot be renamed after the PR is open).
  # Set at merge time to (newest open PR number + 1). Strict title/body checks always fail;
  # the remaining title/body checks stay on PR_STANDARDS_MODE.
  HEAD_REF_ERROR_FROM_PR: "627"

jobs:
  # Convention for every change that lands on main:
  #   * PR title = Conventional Commits header: `type(scope): summary`, <= 100 chars, no trailing period.
  #     Types: feat fix perf refactor test docs build ci chore revert style security.
  #     Release automation reads these headers.
  #   * PR body follows .github/pull_request_template.md: what changed, why, and how it was tested.
  #   * No card reference is required. Internal card IDs (TOG-1234, PAP-1234), instance UI links
  #     and the internal host in the title or body fail because this repository is public; other
  #     references and the commit subject draw a warning.
  #   * Repos are squash-merge only and the squash commit title is the PR title, so the history on
  #     main is one conventional commit per PR. The push job below flags any commit that bypasses it
  #     (for example a merge call that passes its own commit_title).
  #
  # name pinned equal to the id: `pr-lint` is a required check.
  pr-lint:
    name: pr-lint
    # Overflow switch: see CI_OVERFLOW_* note in the main CI workflow.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'pr-lint') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    env:
      # Metadata lint needs the immutable PR head, not a regenerated merge ref
      # whose base can differ from the event snapshot. Push/dispatch keep their SHA.
      PR_LINT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_LINT_CHECKOUT_SHA }}
          # Read both immutable tracked trees, including the event's base snapshot.
          fetch-depth: 0
          persist-credentials: false

      - name: Unit-test the lint
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_pr_standards.py'
          # Heads cut before #651 lack the ratchet files: the head-SHA checkout
          # then has nothing for this pattern, and unittest exits 5. Skip with a
          # warning when the head predates the ratchet; fail closed when the head
          # deletes the ratchet files so a PR cannot silence its own gate.
          if [ -f .github/scripts/test_internal_ref_ratchet.py ] && [ -f .github/scripts/internal_ref_ratchet.py ] && [ -f .github/scripts/internal_references.py ]; then
            python3 -m unittest discover -s .github/scripts -p 'test_internal_ref_ratchet.py'
          elif git log --format=%H -1 HEAD -- .github/scripts/internal_ref_ratchet.py .github/scripts/test_internal_ref_ratchet.py .github/scripts/internal_references.py | grep -q .; then
            echo "::error::Ratchet files deleted at this head; refusing to skip."
            exit 1
          else
            echo "::warning::Ratchet tests absent at this head SHA; skipped (predates #651)."
          fi
          python3 -m unittest discover -s ci -p 'test_check_pr_conventions.py'
          # Heads cut before this PR lack the waiver-body test; fail closed if a head
          # deletes it so a PR cannot silence the queue-visibility check.
          if [ -f ci/test_floor_waiver_body.py ]; then
            python3 -m unittest discover -s ci -p 'test_floor_waiver_body.py'
          elif git log --format=%H -1 HEAD -- ci/test_floor_waiver_body.py | grep -q .; then
            echo "::error::Floor-waiver body test deleted at this head; refusing to skip."
            exit 1
          else
            echo "::warning::Floor-waiver body test absent at this head SHA; skipped (predates this change)."
          fi
          # Heads cut before this PR lack the docs drift test: the head-SHA
          # checkout then has nothing for this pattern, and unittest exits 5.
          # Skip with a warning when the head predates the test; fail closed
          # when the head deletes it so a PR cannot silence its own gate.
          if [ -f ci/test_pr_lint_docs.py ]; then
            python3 -m unittest discover -s ci -p 'test_pr_lint_docs.py'
          elif git log --format=%H -1 HEAD -- ci/test_pr_lint_docs.py | grep -q .; then
            echo "::error::pr-lint docs test deleted at this head; refusing to skip."
            exit 1
          else
            echo "::warning::pr-lint docs test absent at this head SHA; skipped (predates #769)."
          fi
          # The advisory size labeller's tests moved with the script to the
          # org `.github` repository, where its `pr-size selftest` job runs
          # them in `ci-ok`; this repo only pins the thin caller wiring in
          # test/pr-size-wiring.test.ts. (The old fail-closed block here had
          # to go with the deletion: its `git log` probe would otherwise
          # fail every later head for the one deliberate deletion commit.)

      - name: Ratchet tracked internal references
        if: github.event_name != 'push' && github.event_name != 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ env.PR_LINT_CHECKOUT_SHA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # Dispatched runs have no pull_request event snapshot: resolve the
          # recorded base SHA and the live base branch from the API. PR events
          # use the snapshot SHA and the event's base ref (usually main).
          BASE_BRANCH=""
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            BASE_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.sha')
            BASE_BRANCH=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.ref')
          else
            BASE_BRANCH="${BASE_REF:-main}"
          fi
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="main"
          fi
          # Heads cut before #651 lack the script at the head-SHA checkout.
          # The script reads only git objects, so a trusted base copy can still
          # judge a stale head: run it instead of skipping, otherwise any branch
          # based before #651 bypasses this required gate. Fail closed when the
          # head deletes the script so a PR cannot silence its own gate.
          # (The head-side unittest block above keeps its predates-#651 skip.)
          if [ ! -f .github/scripts/internal_ref_ratchet.py ] || [ ! -f .github/scripts/internal_references.py ]; then
            if git log --format=%H -1 HEAD -- .github/scripts/internal_ref_ratchet.py .github/scripts/internal_references.py | grep -q .; then
              echo "::error::Ratchet script deleted at this head; refusing to skip."
              exit 1
            fi
            echo "::warning::Ratchet script absent at this head SHA; checking with the base copy (predates #651)."
            mkdir -p "$RUNNER_TEMP/ratchet"
            RATCHET_SRC=""
            if git cat-file -e "$BASE_SHA:.github/scripts/internal_ref_ratchet.py" 2>/dev/null && git cat-file -e "$BASE_SHA:.github/scripts/internal_references.py" 2>/dev/null; then
              RATCHET_SRC="$BASE_SHA"
            else
              # Recorded bases can predate #651 too: their snapshot lacks the
              # ratchet files, so fall back to the live base-branch tip while
              # keeping --base "$BASE_SHA" for the diff range (for behind-PRs
              # the recorded base equals the merge-base, so the range stays
              # correct). The checkout already fetches the base branch, so the
              # tip is usually present; fetch it when it is not.
              echo "::warning::Ratchet script absent at recorded base $BASE_SHA (predates #651); using live $BASE_BRANCH tip."
              LIVE_REF="refs/remotes/origin/$BASE_BRANCH"
              if ! git cat-file -e "$LIVE_REF:.github/scripts/internal_ref_ratchet.py" 2>/dev/null || ! git cat-file -e "$LIVE_REF:.github/scripts/internal_references.py" 2>/dev/null; then
                git fetch --no-tags origin "$BASE_BRANCH"
              fi
              if git cat-file -e "$LIVE_REF:.github/scripts/internal_ref_ratchet.py" 2>/dev/null && git cat-file -e "$LIVE_REF:.github/scripts/internal_references.py" 2>/dev/null; then
                RATCHET_SRC="$LIVE_REF"
              else
                echo "::error::Ratchet script absent at recorded base and at live $BASE_BRANCH tip; refusing to pass."
                exit 1
              fi
            fi
            git show "$RATCHET_SRC:.github/scripts/internal_ref_ratchet.py" > "$RUNNER_TEMP/ratchet/internal_ref_ratchet.py"
            git show "$RATCHET_SRC:.github/scripts/internal_references.py" > "$RUNNER_TEMP/ratchet/internal_references.py"
            python3 "$RUNNER_TEMP/ratchet/internal_ref_ratchet.py" --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3 .github/scripts/internal_ref_ratchet.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      - name: Accept metadata already linted on the PR
        if: github.event_name == 'merge_group'
        run: echo 'pr-lint passes for merge_group; PR title and body were checked before admission.'

      - name: Resolve PR title/body
        if: github.event_name != 'merge_group'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 ci/pr-lint-output.py resolve

      # Fail-closed input for the internal-ID warning. A failed listing fails
      # the step so the gate never scans an empty file as if it were clean.
      # A genuinely empty PR (zero commits) still succeeds here with an empty
      # file. The subjects go to a job-owned file, never to a step output or
      # the environment.
      - name: List PR commit subjects
        if: github.event_name != 'push' && github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[].commit.message | split("\n")[0]' > "$RUNNER_TEMP/pr-commit-subjects.txt"; then
            echo "::error::Could not list the PR commits; failing closed instead of scanning an empty subject list."
            rm -f "$RUNNER_TEMP/pr-commit-subjects.txt"
            exit 1
          fi

      - name: Resolve PR head ref
        id: head-ref
        if: github.event_name != 'push' && github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          HEAD_EVENT_REF: ${{ github.event.pull_request.head.ref }}
          BASE_EVENT_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_EVENT_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # pull_request events carry both refs; dispatch runs resolve them from
          # the API so manual runs lint the same branch and immutable base.
          if [ -n "$HEAD_EVENT_REF" ]; then
            head_ref="$HEAD_EVENT_REF"
            base_sha="$BASE_EVENT_SHA"
            base_ref="${BASE_EVENT_REF:-main}"
          else
            head_ref=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.ref')
            base_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.sha')
            base_ref=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.ref')
          fi
          if [ -z "$head_ref" ] || [ -z "$base_sha" ]; then
            echo "::error::Could not resolve the PR head ref and base SHA."
            exit 1
          fi
          if [ -z "${base_ref:-}" ]; then
            base_ref="main"
          fi
          printf 'head_ref=%s\n' "$head_ref" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"

      - name: Check title, body and commits
        if: github.event_name != 'merge_group'
        env:
          PR_METADATA_PATH: ${{ steps.pr.outputs.metadata }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          COMMIT_SUBJECTS_PATH: ${{ runner.temp }}/pr-commit-subjects.txt
          HEAD_REF: ${{ steps.head-ref.outputs.head_ref || github.event.pull_request.head.ref }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '0' }}
          HEAD_REF_ERROR_FROM_PR: ${{ env.HEAD_REF_ERROR_FROM_PR }}
          FLOOR_WAIVER_BASE_SHA: ${{ steps.head-ref.outputs.base_sha }}
          FLOOR_WAIVER_BASE_REF: ${{ steps.head-ref.outputs.base_ref || github.base_ref || 'main' }}
        run: python3 ci/pr-lint-output.py check

  # Full-history gitleaks scan; `gitleaks` is a required check on main. Uses
  # the gitleaks binary (the gitleaks-action wrapper needs a paid licence for
  # organizations), pinned by SHA-256. --redact so findings never print the
  # value. A secret that reaches a branch is already leaked: report it, do not
  # just delete the line. A pull request is scanned with the base branch's
  # allowlists, never its own (.github/scripts/gitleaks-scan.sh).
  #
  # Sequential after pr-lint: one runner slot at a time. Runs even
  # when pr-lint fails, so a non-conventional push to main is still scanned.
  # name pinned equal to the id: `gitleaks` is a required check.
  gitleaks:
    name: gitleaks
    needs: pr-lint
    if: ${{ !cancelled() }}
    # Overflow switch: see CI_OVERFLOW_* note in the main CI workflow.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'gitleaks') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret added and then removed in an earlier commit
          # on the same branch is still a leak, and a shallow clone hides it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, copied from
          # the release's gitleaks_${GITLEAKS_VERSION}_checksums.txt. Bump it
          # together with GITLEAKS_VERSION, never on its own.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          # $RUNNER_TEMP is job-private; 16 runners share one /tmp.
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Verify before extracting or executing anything from the archive.
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      # Offline proof that a PR cannot silence its own scan (synthetic token,
      # throwaway repos, no network); see .github/scripts/gitleaks-scan.sh.
      - name: Self-test the PR scan policy
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: bash .github/scripts/test-gitleaks-scan.sh

      - name: Scan the full history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          EVENT_NAME: ${{ github.event_name }}
          # base_ref is empty on merge_group; the queue commit's target
          # branch arrives as merge_group.base_ref (refs/heads/main), which
          # gitleaks-scan.sh strips to the branch name.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        # On pull_request and merge_group the base branch's .gitleaks.toml /
        # .gitleaksignore apply, so an allowlist is honoured only after it
        # has merged.
        run: bash .github/scripts/gitleaks-scan.sh
