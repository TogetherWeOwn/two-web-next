name: deploy-production

# Cutover only. Never runs on a push or PR. Automatic promotion runs when
# e2e-staging completes and daily as a backstop (14:17 UTC); manual dispatch
# stays for explicit redeploys and recovery.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-hex main commit to deploy. Empty promotes the newest deployed commit whose newest post-deploy staging-journeys run passed (ci/resolve-promotion-sha.mjs). Always set it explicitly to redeploy a prior good commit"
        required: false
        type: string
        default: ""
      migrations_applied:
        description: "Set to true only after db-migrate.yml (target production) applied the target's migrations out of band. Audited manual continuation past a ledger-unproven stop (ledger lacks target entries, ledger read failed, unusable target timestamp, or unknown live commit after 3 /up reads); automatic runs ignore it and halt on those stops unless the live ledger already proves every target web migration applied. The first promotion after the ledger signal ships needs one manual dispatch because the live Worker predates it"
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: [e2e-staging]
    types: [completed]
  schedule:
    - cron: "17 14 * * *"

# Both gate jobs need Actions read to GET the private repository's Environment.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: production-preflight
    # Automatic runs (workflow_run, schedule) only promote a soaked green with
    # no newer red staging run (ci/resolve-promotion-sha.mjs). A workflow_run
    # from a failed or non-main staging run resolves nothing and skips cleanly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      already_live: ${{ steps.live.outputs.already_live }}
      live_sha: ${{ steps.live.outputs.live_sha }}
      rollback_version_id: ${{ steps.rollback-target.outputs.version_id }}
      rollback_commit: ${{ steps.rollback-target.outputs.commit }}
      started_at: ${{ steps.start.outputs.started_at }}
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Record when this promotion attempt started
        id: start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Promote what staging last verified: merges keep landing on main, so the
      # newest main SHA is rarely staged yet. The gate below still requires the
      # exact SHA's green main ci.yml (and staging evidence under auto-approve).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /ci/
            /wrangler.jsonc
          sparse-checkout-cone-mode: false
      - name: Resolve the commit to promote
        id: target
        run: node ci/resolve-promotion-sha.mjs
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      # Clean skip when automatic promotion has nothing soaked and green to
      # promote: the resolver exits 0 with an empty sha, and every step below
      # stands down so the run stays green without deploying.
      - name: Check if production already serves the target
        id: live
        if: steps.target.outputs.sha != ''
        run: node ci/production-deploy-gate.mjs --already-live
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
      - name: Refuse pending production migrations before any deploy
        # A target whose journal has entries production lacks reads the live
        # production ledger via /up: when the ledger holds every target web
        # entry (set inclusion), promotion clears automatically; otherwise it
        # stops here with a clear error (ledger lacks entries, ledger read
        # failed, unusable target timestamp, non-ok database, or a live Worker
        # that predates the ledger signal). An unknown live commit after 3 /up
        # reads also stops here. Manual dispatch can continue past any stop
        # only on the audited migrations_applied=true confirmation after
        # db-migrate.yml (target production); automatic runs ignore that input
        # and halt on those stops unless the ledger proves the target applied.
        # The first promotion after the ledger signal ships needs one manual
        # dispatch because the live Worker predates it. Once the
        # least-privilege migrator lands, this step becomes a db-migrate.yml
        # (workflow_call, target production) call first. This check runs from
        # the tip checkout on purpose, like --already-live above: after the
        # re-checkout below, an older target's script could lack this flag and
        # fall through to the full gate without its enable vars, blocking
        # rescue redeploys of prior good commits.
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        run: node ci/production-deploy-gate.mjs --check-migrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          LIVE_SHA: ${{ steps.live.outputs.live_sha }}
          MIGRATIONS_APPLIED: ${{ inputs.migrations_applied }}
      - name: Hold promotion while the staging rollback drill is red
        # A red staging-rollback-drill.yml means the rollback path is not
        # proven; promotion waits until the next drill is green. Runs from the
        # tip checkout, like the migration check above, so an older target
        # cannot skip it.
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        run: node ci/rollback-target.mjs --check-drill
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Record and verify the production rollback target
        # Refuses promotion without a valid rollback target: /up must name the
        # live version and its commit, and no migration the target adds since
        # that commit may break it (destructive statements need a reviewed
        # "-- rollback-safe:" note). The deploy job then confirms that version
        # is the single 100% deployment and still has its secrets. Tip
        # checkout, like the checks above.
        id: rollback-target
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        run: node ci/rollback-target.mjs --check-target
        env:
          ROLLBACK_ENVIRONMENT: production
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            /ci/
            /wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        with:
          node-version: 24
      - name: Refuse disabled, held, non-main, unprotected, untested or placeholder deployment
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          PRODUCTION_HOLD_UNTIL: ${{ vars.PRODUCTION_HOLD_UNTIL }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}

  staging-soak:
    name: staging-soak
    # Least privilege with no approval wait: the candidate's staging Worker
    # versions (tagged with its commit; every tagged version counts) and
    # their invocation errors since the oldest deployed, from the staging
    # account's Workers API and analytics. Staging credentials only and no
    # Environment binding, so this starts at once in reviewer mode too. The
    # job only reads (versions list, analytics query) and never mutates, but
    # the token is the staging deploy token, not a read-only credential; the
    # production comparison runs in regression below.
    needs: preflight
    if: needs.preflight.outputs.sha != '' && needs.preflight.outputs.already_live != 'true'
    # Public repo: GitHub-hosted runners; private: the self-hosted fleet.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      requests: ${{ steps.soak.outputs.requests }}
      errors: ${{ steps.soak.outputs.errors }}
    steps:
      # Tip checkout, like the preflight checks: an older candidate cannot
      # skip the gate with a script that lacks this mode.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /ci/
            /wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Measure the candidate's staging soak error rate
        id: soak
        run: node ci/production-deploy-gate.mjs --staging-soak
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  regression:
    name: production-regression
    # Regression check against production (ci/production-deploy-gate.mjs
    # --regression): run the passive set (bin/smoke.mjs routes and the GET-only
    # guest journeys) against production with the candidate's own checkers,
    # and refuse when a check that passes on production did not pass on
    # staging for the candidate (its e2e-staging staging-passive ledgers), or
    # when the staging soak error rate exceeds 1.5x production's last 24 hours
    # (1% floor). GET-only, no auth, no writes.
    needs: [preflight, staging-soak]
    if: needs.preflight.outputs.sha != '' && needs.preflight.outputs.already_live != 'true'
    # Public repo: GitHub-hosted runners; private: the self-hosted fleet.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    # The production Environment binding stays as the reviewer checkpoint
    # before the deploy job (and still supplies the production account id),
    # but analytics reads use the repo-level read-only token, so this job
    # never holds the production deployment token.
    environment:
      name: production
      url: https://togetherweown.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      # The gate itself runs from the tip, like the preflight checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: gate-tip
          persist-credentials: false
          sparse-checkout: |
            /ci/
            /wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fetch the candidate's staging passive ledgers
        run: node gate-tip/ci/production-deploy-gate.mjs --fetch-passive-ledgers "$RUNNER_TEMP/staging"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      - name: Passive set against production (ledgers only)
        # Exit codes are reported in the log; the gate below judges the
        # ledgers against the candidate's staging outcomes.
        run: |
          mkdir -p "$RUNNER_TEMP/production"
          set +e
          node bin/smoke.mjs https://togetherweown.com --allow-indexable --ledger "$RUNNER_TEMP/production/smoke.json"
          echo "production passive smoke exit $?"
          npx playwright test --config playwright.watch.config.ts --reporter=list,json
          echo "production guest journeys exit $?"
        env:
          WATCH_ORIGIN: https://togetherweown.com
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/production/journeys.json
          # Both sides skip the dead-letter gate: retained queue_failed_jobs
          # rows are database history, not a property of either version.
          SMOKE_ALLOW_MISSING_BASELINE: "1"
      - name: Refuse a regression against production
        run: node gate-tip/ci/production-deploy-gate.mjs --regression
        env:
          PRODUCTION_SMOKE_LEDGER: ${{ runner.temp }}/production/smoke.json
          PRODUCTION_JOURNEYS: ${{ runner.temp }}/production/journeys.json
          STAGING_SMOKE_LEDGER: ${{ runner.temp }}/staging/smoke.json
          STAGING_JOURNEYS: ${{ runner.temp }}/staging/journeys.json
          STAGING_SOAK_REQUESTS: ${{ needs.staging-soak.outputs.requests }}
          STAGING_SOAK_ERRORS: ${{ needs.staging-soak.outputs.errors }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ANALYTICS_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: deploy-production
    needs: [preflight, regression]
    # Clean skip when there is nothing to promote (automatic run with no
    # soaked green) or production already serves the target: preflight
    # succeeds with an empty sha or already_live=true, and this job stands
    # down so the run stays green without deploying.
    if: needs.preflight.outputs.sha != '' && needs.preflight.outputs.already_live != 'true'
    # Read by auto-rollback below: the promoted version id is set as soon as
    # the gradual action resolves the upload, and verify_outcome says whether
    # the post-100% smoke failed.
    outputs:
      promoted_version_id: ${{ steps.gradual.outputs.promoted-version-id }}
      verify_outcome: ${{ steps.verify.outcome }}
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    # 30 minutes: the gradual stages now also soak and judge the new
    # version's live error rate (worst case about 4 extra minutes a stage).
    timeout-minutes: 30
    # Shared production Worker mutation lock with the manual rollback job:
    # one static non-cancelling group serializes promotion and rollback
    # mutations to the same Worker. Workflow-level groups stay distinct so
    # the run never nests this group and the release job below never holds
    # it while publishing notes.
    concurrency:
      group: production-worker-mutation
      cancel-in-progress: false
    # Required reviewers + prevent-self-review are live repo settings unless
    # vars.PRODUCTION_AUTO_APPROVE is true, in which case the gate requires green
    # staging deploy + e2e-staging on this exact SHA instead, with the e2e-staging
    # staging-quality job executed and passed. Preflight refuses a
    # missing/unprotected Environment before GitHub can auto-create it.
    environment:
      name: production
      url: https://togetherweown.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the dispatch SHA that passed preflight, not a newer main head.
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Recheck production gate after Environment approval
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          PRODUCTION_HOLD_UNTIL: ${{ vars.PRODUCTION_HOLD_UNTIL }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      - run: npm ci --include=dev
      # No migrations, queue creation or SQL tests here: provisioning and W16
      # rehearsal are separate operator work. CI uses disposable SQL services.
      - name: Build production target without deploying
        run: npx wrangler deploy --dry-run --env production --outdir dist-production
      - name: Require production-only Cloudflare credentials
        run: node ci/production-deploy-gate.mjs --credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Require production Worker secrets (names only, before any deploy)
        # Lists secret NAMES via wrangler and refuses on any missing required
        # name. Values are never read or printed; unreadable output fails
        # closed. Runs after the credentials check and before the moderator
        # preflight and the first deploy.
        run: node ci/check-production-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Moderator role-config preflight (production env, before any deploy)
        # Read env.production.vars only: Wrangler does not inherit top-level
        # vars into named environments. Fails closed when the production env
        # declares no moderators.
        run: npm run check:worker-moderators-production
      - name: Confirm the recorded rollback target still exists with its secrets
        # The preflight recorded the live version from /up. It must still be
        # the single 100% production deployment, and the version must still
        # carry every required secret, or a failed promotion would have
        # nothing safe to return to. Before any production mutation.
        run: |
          set -euo pipefail
          live="$(npx wrangler deployments list --name two-web-next-production --json \
            | node .github/actions/gradual-promote/gradual-promote.mjs --capture-rollback-target)"
          if [ "$live" != "$ROLLBACK_VERSION_ID" ]; then
            echo "::error::production serves $live, not the recorded rollback target $ROLLBACK_VERSION_ID; refusing promotion"
            exit 1
          fi
          node ci/check-production-secrets.mjs --rollback-version
          echo "rollback target $ROLLBACK_VERSION_ID ($ROLLBACK_COMMIT) recorded and verified"
        env:
          ROLLBACK_VERSION_ID: ${{ needs.preflight.outputs.rollback_version_id }}
          ROLLBACK_COMMIT: ${{ needs.preflight.outputs.rollback_commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production alert Tail Worker first
        # The app's env.production.tail_consumers binding needs the consumer to exist first.
        run: npx wrangler deploy --config tail/wrangler.jsonc --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      # Uploading a version does not mutate routes, custom domains or cron
      # triggers. The apex is already attached to this Worker; a full deploy
      # retries domain provisioning and fails with Cloudflare 100117, and the
      # triggers-sync subcommand also re-syncs routes/domains, so neither may
      # be used here. Cron/consumer drift is pinned by
      # test/probe-workflows.test.ts and reconciled per docs/runbook.md
      # ("Production trigger reconciliation"), never by this workflow.
      - name: Upload reviewed production version without changing triggers
        run: npx wrangler versions upload --env production --tag "${DEPLOY_SHA:?}-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      - name: Capture pre-promote dead-letter baseline
        # Read-only GET before the central gradual-promote action runs: that
        # action's stage smokes execute this repo's bin/smoke.mjs in this job,
        # so SMOKE_FAILED_BASELINE published here via $GITHUB_ENV scopes every
        # stage gate to growth past the retained queue_failed_jobs count (the
        # count is database-wide, never version-scoped). Retried, then an
        # unreadable /up leaves the baseline empty and the stage smokes skip
        # the dead-letter gate on history (SMOKE_ALLOW_MISSING_BASELINE)
        # instead of failing on any positive count. Never fails the deploy on
        # its own.
        run: |
          baseline=""
          for i in 1 2 3 4 5; do
            candidate="$(node -e 'fetch("https://togetherweown.com/up", { signal: AbortSignal.timeout(10000) }).then((r) => r.json()).then((d) => { const f = d && d.queue ? d.queue.failed : undefined; if (typeof f === "number" && Number.isInteger(f) && f >= 0) process.stdout.write(String(f)); }).catch(() => {})' || true)"
            if [ -n "$candidate" ]; then baseline="$candidate"; break; fi
            if [ "$i" -lt 5 ]; then sleep 5; fi
          done
          if [ -z "$baseline" ]; then echo "::warning::dead-letter baseline unreadable after 5 attempts; promote smokes will skip the dead-letter gate on history"; fi
          echo "SMOKE_FAILED_BASELINE=$baseline" >> "$GITHUB_ENV"
          echo "SMOKE_ALLOW_MISSING_BASELINE=1" >> "$GITHUB_ENV"
          echo "dead-letter baseline: ${baseline:-unknown}"
      # Gradual promotion lives in the shared central composite action
      # (TogetherWeOwn/.github/actions/gradual-promote, pinned below): 5% ->
      # 50% -> 100% with per-stage health/SLO gates pinned to the new version,
      # and automatic rollback to the recorded pre-promote version on any stage
      # failure. Other repos call the same action; repo-specific build/upload
      # stays above.
      - name: Gradual promotion 5-50-100 with automatic rollback
        id: gradual
        uses: TogetherWeOwn/.github/actions/gradual-promote@89c290be20c0044efaf6916f28341c76e75fff06
        with:
          worker-name: two-web-next-production
          version-tag: ${{ needs.preflight.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          domain: togetherweown.com
          api-token: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public routes on the promoted version
        id: verify
        # Post-promotion verification: after the gradual promotion reaches
        # 100%, probe the same GET-only public-route set as the gradual live
        # gate and the rollback smoke (bin/smoke.mjs) against the production
        # apex, so a promotion serving broken public content fails this job
        # before the release job tags. Manual redirects keep the checks
        # unauthenticated and never visit Discord: no auth, no writes, no new
        # secrets. Same retry contract (6 attempts, 10s sleeps, fail closed).
        # Ordinary-traffic identity is enforced below: the promoted version UUID
        # travels steps.gradual.outputs.promoted-version-id -> env -> quoted
        # shell variable and the smoke proves that version serves unpinned
        # ordinary routing (no version-override header). A healthy unwanted
        # version can satisfy every readiness assertion without proving the
        # recorded target serves normal traffic, so identity is the gate: a
        # missing, malformed or different revision.version_id fails even when
        # health is green. An absent or malformed promoted id fails closed
        # before any probe, never by silently omitting verification. The
        # gradual action's rollback steps only fire on failures inside the
        # promotion, so a failed verification leaves the promoted candidate
        # live at 100% until the auto-rollback job below restores the
        # recorded pre-promote version through rollback-production.yml. An
        # inline wrangler rollback must stay out of this workflow: the
        # rollback path checks the target version's secrets first.
        run: |
          if ! node -e 'const v = process.env.PROMOTED_VERSION_ID ?? ""; if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(v)) { console.error("::error::promoted-version-id missing or malformed; refusing to verify without a target identity"); process.exit(1); }'; then
            echo "::error::post-promotion public-route smoke failed; promoted candidate ${PROMOTED_VERSION_ID:-unknown} remains live at 100%; release will not tag; recorded restoration target ${PREV_VERSION:-unknown} - auto-rollback restores it with the rollback-production workflow"
            exit 1
          fi
          for i in 1 2 3 4 5 6; do
            if node bin/smoke.mjs https://togetherweown.com --allow-indexable --expected-version-id "$PROMOTED_VERSION_ID"; then
              echo "post-promotion production smoke ok (attempt $i)"
              exit 0
            fi
            if [ "$i" -lt 6 ]; then
              echo "attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::post-promotion public-route smoke failed; promoted candidate ${PROMOTED_VERSION_ID:-unknown} remains live at 100%; release will not tag; recorded restoration target ${PREV_VERSION:-unknown} - auto-rollback restores it with the rollback-production workflow"
          exit 1
        env:
          PROMOTED_VERSION_ID: ${{ steps.gradual.outputs.promoted-version-id }}
          PREV_VERSION: ${{ steps.gradual.outputs.rollback-version-id }}
      - name: Record successful production promotion
        # Success-only and after identity-aware smoke. Write inline because the
        # selected deployment checkout can predate this receipt protocol.
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const receipt = {
            schema: 1,
            repository: process.env.GITHUB_REPOSITORY,
            workflow: '.github/workflows/deploy-production.yml',
            job: 'deploy-production',
            sha: process.env.DEPLOY_SHA,
            promoted_version_id: process.env.PROMOTED_VERSION_ID,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
          };
          if (!/^[0-9a-f]{40}$/.test(receipt.sha ?? '') ||
              !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(receipt.promoted_version_id ?? '') ||
              !/^[1-9][0-9]*$/.test(receipt.run_id ?? '') ||
              !/^[1-9][0-9]*$/.test(receipt.run_attempt ?? '')) {
            throw new Error('Invalid production promotion receipt identity');
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'promotion.json'), JSON.stringify(receipt) + '\n');
          NODE
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          PROMOTED_VERSION_ID: ${{ steps.gradual.outputs.promoted-version-id }}
      - name: Upload production promotion proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion.json
          if-no-files-found: error
          retention-days: 30

  post-deploy-watch:
    name: post-deploy-watch
    # For 30 minutes after 100%, probe readiness every minute and judge the
    # promoted version's error rate every five (ci/post-deploy-watch.mjs). A
    # breach sets breach=true and auto-rollback restores the pre-promote
    # version. This is a CI job, not anyone waiting by hand. It holds no
    # mutation lock: a manual rollback or redeploy meanwhile makes the watch
    # stand down instead of judging another version.
    needs: [preflight, deploy-production]
    # Public repo: GitHub-hosted runners; private: the self-hosted fleet.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    # No Environment binding, deliberately: this job must start watching the
    # moment promotion reaches 100%, with no second approval in reviewer
    # mode, and it performs no mutation. It reads only the repo-level
    # read-only analytics token (Account Analytics: Read, the same token the
    # RUM check uses) and the repo variable with the production account id,
    # never the production deployment token.
    outputs:
      breach: ${{ steps.watch.outputs.breach }}
      verdict: ${{ steps.watch.outputs.verdict }}
    steps:
      # Tip checkout, like the preflight checks: an older candidate cannot
      # skip the watch with a script that lacks this mode.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /ci/
            /.github/actions/gradual-promote/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Watch readiness and error rate for 30 minutes after 100%
        id: watch
        run: node ci/post-deploy-watch.mjs
        env:
          PROMOTED_VERSION_ID: ${{ needs.deploy-production.outputs.promoted_version_id }}
          WORKER_NAME: two-web-next-production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ANALYTICS_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_RUM_ACCOUNT_ID }}

  auto-rollback:
    name: auto-rollback
    # After 100%, a failed public-route verification or a watch breach rolls
    # back to the rollback target the preflight recorded and the deploy job
    # confirmed. The guard rolls back only while the promoted version is
    # live: it skips when the gradual action already restored the target and
    # refuses when someone else deployed meanwhile. The scripts run from the
    # promoted commit, whose exact-SHA CI the gate already proved green.
    needs: [preflight, deploy-production, post-deploy-watch]
    if: >-
      !cancelled() && needs.deploy-production.outputs.promoted_version_id != '' &&
      (needs.deploy-production.outputs.verify_outcome == 'failure' ||
       needs.post-deploy-watch.outputs.breach == 'true')
    uses: ./.github/workflows/rollback-production.yml
    with:
      environment: production
      version_id: ${{ needs.preflight.outputs.rollback_version_id }}
      ref: ${{ needs.preflight.outputs.sha }}
      expected_current_version_id: ${{ needs.deploy-production.outputs.promoted_version_id }}
      reason: ${{ needs.deploy-production.outputs.verify_outcome == 'failure' && 'post-promotion public-route smoke failed after 100%' || 'post-deploy watch breach (readiness or error rate)' }}
    # Explicit least-privilege map: the two production Environment secrets
    # this leg needs are passed by name, and the called job's own
    # `environment: production` binding receives their values even though
    # this caller binds no environment
    # (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#passing-secrets-to-a-reusable-workflow).
    # The webhook key travels too because the production rollback notifies.
    # The exact-match selectors plus the --credentials fail-closed check
    # confine them to the production leg. If the binding ever stopped
    # resolving, that check fails the rollback closed and the runbook's manual
    # rollback path (same recorded target) takes over.
    secrets:
      PRODUCTION_CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
      PRODUCTION_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      PAPERCLIP_DEPLOY_WEBHOOK_SECRET: ${{ secrets.PAPERCLIP_DEPLOY_WEBHOOK_SECRET }}

  release:
    name: release
    # Tag the commit that is now live and publish its notes (release.yml),
    # only after the post-deploy watch passed. A superseded watch stands
    # down successfully without judging the candidate, so the verdict must be
    # an explicit pass: a displaced commit is never tagged.
    # preflight.outputs.sha is the promoted commit (DEPLOY_SHA), never main's tip.
    needs: [preflight, deploy-production, post-deploy-watch]
    if: ${{ needs.post-deploy-watch.outputs.verdict == 'pass' }}
    permissions:
      actions: read # Read only this repository's promotion evidence.
      contents: write # Create the tag and its GitHub Release.
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.preflight.outputs.sha }}
      promotion_run_id: ${{ github.run_id }}
      promotion_run_attempt: ${{ github.run_attempt }}

  notify:
    name: deploy-notify
    # Final step of every attempted promotion: POST the commit, version,
    # outcome and run URL to the Paperclip deploy-verification routine
    # (ci/deploy-notify.mjs). Never decides the deploy: the step is
    # continue-on-error, and an unconfigured webhook only warns.
    needs:
      [
        preflight,
        staging-soak,
        regression,
        deploy-production,
        post-deploy-watch,
        auto-rollback,
        release,
      ]
    if: ${{ always() && needs.preflight.outputs.sha != '' && needs.preflight.outputs.already_live != 'true' }}
    # Public repo: GitHub-hosted runners; private: the self-hosted fleet.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # Tip checkout, like the preflight checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /ci/
            /wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Notify the Paperclip deploy-verification routine
        continue-on-error: true
        run: node ci/deploy-notify.mjs
        env:
          NOTIFY_EVENT: deploy
          NOTIFY_SHA: ${{ needs.preflight.outputs.sha }}
          NOTIFY_STARTED_AT: ${{ needs.preflight.outputs.started_at }}
          PROMOTED_VERSION_ID: ${{ needs.deploy-production.outputs.promoted_version_id }}
          ROLLBACK_VERSION_ID: ${{ needs.preflight.outputs.rollback_version_id }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SOAK_RESULT: ${{ needs.staging-soak.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
          DEPLOY_RESULT: ${{ needs.deploy-production.result }}
          VERIFY_OUTCOME: ${{ needs.deploy-production.outputs.verify_outcome }}
          WATCH_RESULT: ${{ needs.post-deploy-watch.result }}
          WATCH_BREACH: ${{ needs.post-deploy-watch.outputs.breach }}
          WATCH_VERDICT: ${{ needs.post-deploy-watch.outputs.verdict }}
          ROLLBACK_RESULT: ${{ needs.auto-rollback.result }}
          PAPERCLIP_DEPLOY_WEBHOOK_URL: ${{ vars.PAPERCLIP_DEPLOY_WEBHOOK_URL }}
          PAPERCLIP_DEPLOY_WEBHOOK_SECRET: ${{ secrets.PAPERCLIP_DEPLOY_WEBHOOK_SECRET }}
