name: deploy-production

# Cutover only. Never runs on a push or PR. Automatic promotion runs when
# e2e-staging completes and daily as a backstop (14:17 UTC); manual dispatch
# stays for explicit redeploys and recovery.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-hex main commit to deploy. Empty promotes the newest deployed commit whose newest post-deploy staging-journeys run passed (ci/resolve-promotion-sha.mjs). Always set it explicitly to redeploy a prior good commit"
        required: false
        type: string
        default: ""
      migrations_applied:
        description: "Set to true only after db-migrate.yml (target production) applied the target's pending migrations out of band. Audited manual continuation for the migration stop below; automatic runs ignore it and stay blocked until the least-privilege migrator lands"
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: [e2e-staging]
    types: [completed]
  schedule:
    - cron: "17 14 * * *"

# Both gate jobs need Actions read to GET the private repository's Environment.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: production-preflight
    # Automatic runs (workflow_run, schedule) only promote a soaked green with
    # no newer red staging run (ci/resolve-promotion-sha.mjs). A workflow_run
    # from a failed or non-main staging run resolves nothing and skips cleanly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      already_live: ${{ steps.live.outputs.already_live }}
      live_sha: ${{ steps.live.outputs.live_sha }}
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # Promote what staging last verified: merges keep landing on main, so the
      # newest main SHA is rarely staged yet. The gate below still requires the
      # exact SHA's green main ci.yml (and staging evidence under auto-approve).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /ci/
            /wrangler.jsonc
          sparse-checkout-cone-mode: false
      - name: Resolve the commit to promote
        id: target
        run: node ci/resolve-promotion-sha.mjs
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      # Clean skip when automatic promotion has nothing soaked and green to
      # promote: the resolver exits 0 with an empty sha, and every step below
      # stands down so the run stays green without deploying.
      - name: Check if production already serves the target
        id: live
        if: steps.target.outputs.sha != ''
        run: node ci/production-deploy-gate.mjs --already-live
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
      - name: Refuse pending production migrations before any deploy
        # Until the least-privilege migrator lands, a target whose journal has
        # entries production lacks stops here with a clear error instead of
        # deploying. Afterwards this step becomes a db-migrate.yml
        # (workflow_call, target production) call first. This check runs from
        # the tip checkout on purpose, like --already-live above: after the
        # re-checkout below, an older target's script could lack this flag and
        # fall through to the full gate without its enable vars, blocking
        # rescue redeploys of prior good commits.
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        run: node ci/production-deploy-gate.mjs --check-migrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          LIVE_SHA: ${{ steps.live.outputs.live_sha }}
          MIGRATIONS_APPLIED: ${{ inputs.migrations_applied }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            /ci/
            /wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        with:
          node-version: 24
      - name: Refuse disabled, held, non-main, unprotected, untested or placeholder deployment
        if: steps.target.outputs.sha != '' && steps.live.outputs.already_live != 'true'
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          PRODUCTION_HOLD_UNTIL: ${{ vars.PRODUCTION_HOLD_UNTIL }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}

  deploy-production:
    name: deploy-production
    needs: preflight
    # Clean skip when there is nothing to promote (automatic run with no
    # soaked green) or production already serves the target: preflight
    # succeeds with an empty sha or already_live=true, and this job stands
    # down so the run stays green without deploying.
    if: needs.preflight.outputs.sha != '' && needs.preflight.outputs.already_live != 'true'
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    # 30 minutes: the gradual stages now also soak and judge the new
    # version's live error rate (worst case about 4 extra minutes a stage).
    timeout-minutes: 30
    # Shared production Worker mutation lock with the manual rollback job:
    # one static non-cancelling group serializes promotion and rollback
    # mutations to the same Worker. Workflow-level groups stay distinct so
    # the run never nests this group and the release job below never holds
    # it while publishing notes.
    concurrency:
      group: production-worker-mutation
      cancel-in-progress: false
    # Required reviewers + prevent-self-review are live repo settings unless
    # vars.PRODUCTION_AUTO_APPROVE is true, in which case the gate requires green
    # staging deploy + e2e-staging on this exact SHA instead, with the e2e-staging
    # staging-quality job executed and passed. Preflight refuses a
    # missing/unprotected Environment before GitHub can auto-create it.
    environment:
      name: production
      url: https://togetherweown.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the dispatch SHA that passed preflight, not a newer main head.
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Recheck production gate after Environment approval
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          PRODUCTION_HOLD_UNTIL: ${{ vars.PRODUCTION_HOLD_UNTIL }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      - run: npm ci --include=dev
      # No migrations, queue creation or SQL tests here: provisioning and W16
      # rehearsal are separate operator work. CI uses disposable SQL services.
      - name: Build production target without deploying
        run: npx wrangler deploy --dry-run --env production --outdir dist-production
      - name: Require production-only Cloudflare credentials
        run: node ci/production-deploy-gate.mjs --credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Require production Worker secrets (names only, before any deploy)
        # Lists secret NAMES via wrangler and refuses on any missing required
        # name. Values are never read or printed; unreadable output fails
        # closed. Runs after the credentials check and before the moderator
        # preflight and the first deploy.
        run: node ci/check-production-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Moderator role-config preflight (production env, before any deploy)
        # Read env.production.vars only: Wrangler does not inherit top-level
        # vars into named environments. Fails closed when the production env
        # declares no moderators.
        run: npm run check:worker-moderators-production
      - name: Deploy production alert Tail Worker first
        # The app's env.production.tail_consumers binding needs the consumer to exist first.
        run: npx wrangler deploy --config tail/wrangler.jsonc --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      # Uploading a version does not mutate routes, custom domains or cron
      # triggers. The apex is already attached to this Worker; a full deploy
      # retries domain provisioning and fails with Cloudflare 100117, and the
      # triggers-sync subcommand also re-syncs routes/domains, so neither may
      # be used here. Cron/consumer drift is pinned by
      # test/probe-workflows.test.ts and reconciled per docs/runbook.md
      # ("Production trigger reconciliation"), never by this workflow.
      - name: Upload reviewed production version without changing triggers
        run: npx wrangler versions upload --env production --tag "${DEPLOY_SHA:?}-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      - name: Capture pre-promote dead-letter baseline
        # Read-only GET before the central gradual-promote action runs: that
        # action's stage smokes execute this repo's bin/smoke.mjs in this job,
        # so SMOKE_FAILED_BASELINE published here via $GITHUB_ENV scopes every
        # stage gate to growth past the retained queue_failed_jobs count (the
        # count is database-wide, never version-scoped). Retried, then an
        # unreadable /up leaves the baseline empty and the stage smokes skip
        # the dead-letter gate on history (SMOKE_ALLOW_MISSING_BASELINE)
        # instead of failing on any positive count. Never fails the deploy on
        # its own.
        run: |
          baseline=""
          for i in 1 2 3 4 5; do
            candidate="$(node -e 'fetch("https://togetherweown.com/up", { signal: AbortSignal.timeout(10000) }).then((r) => r.json()).then((d) => { const f = d && d.queue ? d.queue.failed : undefined; if (typeof f === "number" && Number.isInteger(f) && f >= 0) process.stdout.write(String(f)); }).catch(() => {})' || true)"
            if [ -n "$candidate" ]; then baseline="$candidate"; break; fi
            if [ "$i" -lt 5 ]; then sleep 5; fi
          done
          if [ -z "$baseline" ]; then echo "::warning::dead-letter baseline unreadable after 5 attempts; promote smokes will skip the dead-letter gate on history"; fi
          echo "SMOKE_FAILED_BASELINE=$baseline" >> "$GITHUB_ENV"
          echo "SMOKE_ALLOW_MISSING_BASELINE=1" >> "$GITHUB_ENV"
          echo "dead-letter baseline: ${baseline:-unknown}"
      # Gradual promotion lives in the shared central composite action
      # (TogetherWeOwn/.github/actions/gradual-promote, pinned below): 5% ->
      # 50% -> 100% with per-stage health/SLO gates pinned to the new version,
      # and automatic rollback to the recorded pre-promote version on any stage
      # failure. Other repos call the same action; repo-specific build/upload
      # stays above.
      - name: Gradual promotion 5-50-100 with automatic rollback
        id: gradual
        uses: TogetherWeOwn/.github/actions/gradual-promote@89c290be20c0044efaf6916f28341c76e75fff06
        with:
          worker-name: two-web-next-production
          version-tag: ${{ needs.preflight.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          domain: togetherweown.com
          api-token: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public routes on the promoted version
        # Post-promotion verification: after the gradual promotion reaches
        # 100%, probe the same GET-only public-route set as the gradual live
        # gate and the rollback smoke (bin/smoke.mjs) against the production
        # apex, so a promotion serving broken public content fails this job
        # before the release job tags. Manual redirects keep the checks
        # unauthenticated and never visit Discord: no auth, no writes, no new
        # secrets. Same retry contract (6 attempts, 10s sleeps, fail closed).
        # Ordinary-traffic identity is enforced below: the promoted version UUID
        # travels steps.gradual.outputs.promoted-version-id -> env -> quoted
        # shell variable and the smoke proves that version serves unpinned
        # ordinary routing (no version-override header). A healthy unwanted
        # version can satisfy every readiness assertion without proving the
        # recorded target serves normal traffic, so identity is the gate: a
        # missing, malformed or different revision.version_id fails even when
        # health is green. An absent or malformed promoted id fails closed
        # before any probe, never by silently omitting verification. No
        # automatic restore here: the gradual action's rollback steps only
        # fire on failures inside the promotion, so a failed verification
        # leaves the promoted candidate live at 100% and prints the live
        # candidate plus PREV_VERSION as the recorded restoration target; the
        # operator restores it through the rollback-production workflow with
        # that id. An inline wrangler rollback must stay out of this workflow:
        # the rollback path checks the target version's secrets first (see
        # rollback-production.yml).
        run: |
          if ! node -e 'const v = process.env.PROMOTED_VERSION_ID ?? ""; if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(v)) { console.error("::error::promoted-version-id missing or malformed; refusing to verify without a target identity"); process.exit(1); }'; then
            echo "::error::post-promotion public-route smoke failed; promoted candidate ${PROMOTED_VERSION_ID:-unknown} remains live at 100%; release will not tag; recorded restoration target ${PREV_VERSION:-unknown} - restore it with the rollback-production workflow using that version id"
            exit 1
          fi
          for i in 1 2 3 4 5 6; do
            if node bin/smoke.mjs https://togetherweown.com --allow-indexable --expected-version-id "$PROMOTED_VERSION_ID"; then
              echo "post-promotion production smoke ok (attempt $i)"
              exit 0
            fi
            if [ "$i" -lt 6 ]; then
              echo "attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::post-promotion public-route smoke failed; promoted candidate ${PROMOTED_VERSION_ID:-unknown} remains live at 100%; release will not tag; recorded restoration target ${PREV_VERSION:-unknown} - restore it with the rollback-production workflow using that version id"
          exit 1
        env:
          PROMOTED_VERSION_ID: ${{ steps.gradual.outputs.promoted-version-id }}
          PREV_VERSION: ${{ steps.gradual.outputs.rollback-version-id }}

  release:
    name: release
    # Tag the commit that is now live and publish its notes (release.yml).
    # preflight.outputs.sha is the promoted commit (DEPLOY_SHA), never main's tip.
    needs: [preflight, deploy-production]
    permissions:
      contents: write # Create the tag and its GitHub Release.
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.preflight.outputs.sha }}
