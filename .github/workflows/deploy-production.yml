name: deploy-production

# Cutover only. Never runs on a push, PR, release, or completion of another workflow.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-hex main commit to deploy. Empty promotes the latest main commit whose e2e-staging staging-journeys passed. Always set it explicitly for a redeploy of a prior good commit"
        required: false
        type: string
        default: ""

# Both gate jobs need Actions read to GET the private repository's Environment.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: production-preflight
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # Promote what staging last verified: merges keep landing on main, so the
      # newest main SHA is rarely staged yet. The gate below still requires the
      # exact SHA's green main ci.yml (and staging evidence under auto-approve).
      - name: Resolve the commit to promote
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          sha="$(printf '%s' "$INPUT_SHA" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          if [ -z "$sha" ]; then
            # Staging-verified = an e2e-staging run that followed a deploy (event workflow_run, so its
            # head_sha is the deployed commit; manual runs test whatever staging serves), whose
            # staging-journeys job passed (it is skipped on docs-only diffs while the run still
            # succeeds), and whose commit's latest deploy.yml run succeeded.
            for page in 1 2 3 4 5; do
              runs="$(gh api --method GET "repos/$REPO/actions/workflows/e2e-staging.yml/runs" \
                -f branch=main -f event=workflow_run -f status=success -f per_page=20 -f page="$page" \
                --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')"
              [ -n "$runs" ] || break
              while read -r run_id run_sha; do
                verdict="$(gh api --method GET "repos/$REPO/actions/runs/$run_id/jobs" -f per_page=100 \
                  --jq '[.jobs[] | select(.name == "staging-journeys") | .conclusion] | first // ""')"
                [ "$verdict" = "success" ] || continue
                deployed="$(gh api --method GET "repos/$REPO/actions/workflows/deploy.yml/runs" \
                  -f branch=main -f head_sha="$run_sha" -f per_page=1 --jq '.workflow_runs[0].conclusion // ""')"
                if [ "$deployed" = "success" ]; then sha="$run_sha"; break; fi
              done <<< "$runs"
              [ -n "$sha" ] && break
            done
            echo "Promoting the latest staging-verified commit (staging-journeys passed): ${sha:-none}"
          fi
          if ! printf '%s' "$sha" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::No full 40-hex commit to deploy (input empty and no successful e2e-staging run on main)"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Refuse disabled, non-main, unprotected, untested or placeholder deployment
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}

  deploy-production:
    name: deploy-production
    needs: preflight
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Required reviewers + prevent-self-review are live repo settings unless
    # vars.PRODUCTION_AUTO_APPROVE is true, in which case the gate requires green
    # staging deploy + e2e-staging on this exact SHA instead. Preflight refuses a
    # missing/unprotected Environment before GitHub can auto-create it.
    environment:
      name: production
      url: https://togetherweown.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the dispatch SHA that passed preflight, not a newer main head.
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Recheck production gate after Environment approval
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      - run: npm ci --include=dev
      # No migrations, queue creation or SQL tests here: provisioning and W16
      # rehearsal are separate operator work. CI uses disposable SQL services.
      - name: Build production target without deploying
        run: npx wrangler deploy --dry-run --env production --outdir dist-production
      - name: Require production-only Cloudflare credentials
        run: node ci/production-deploy-gate.mjs --credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Require production Worker secrets (names only, before any deploy)
        # Lists secret NAMES via wrangler and refuses on any missing required
        # name. Values are never read or printed; unreadable output fails
        # closed. Runs after the credentials check and before the moderator
        # preflight and the first deploy.
        run: node ci/check-production-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Moderator role-config preflight (production env, before any deploy)
        # Read env.production.vars only: Wrangler does not inherit top-level
        # vars into named environments. Fails closed when the production env
        # declares no moderators.
        run: npm run check:worker-moderators-production
      - name: Deploy production alert Tail Worker first
        # The app's env.production.tail_consumers binding needs the consumer to exist first.
        run: npx wrangler deploy --config tail/wrangler.jsonc --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy reviewed production target
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production public routes
        # Same GET-only public-route set as staging (bin/smoke.mjs), so the two
        # gates cannot drift. Manual redirects keep the checks unauthenticated
        # and never visit Discord: no auth, no writes, no PII. Indexable apex
        # HTML omits the staging noindex (src/headers.ts); the archive and the
        # branded 404 stay meta-noindex and skip the header assertion inside
        # the checker. DB/schema readiness is mandatory via the /up envelope;
        # queue-only degraded/unknown is allowed.
        run: |
          for i in 1 2 3 4 5 6; do
            if node bin/smoke.mjs https://togetherweown.com --allow-indexable; then
              echo "production smoke ok (attempt $i)"
              exit 0
            fi
            if [ "$i" -lt 6 ]; then
              echo "attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::production public-route smoke failed after deploy"
          exit 1
