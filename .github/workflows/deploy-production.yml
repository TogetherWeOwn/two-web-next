name: deploy-production

# Cutover only. Never runs on a push, PR, release, or completion of another workflow.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-hex main commit to deploy. Empty promotes the newest deployed commit whose newest post-deploy staging-journeys run passed (ci/resolve-promotion-sha.mjs). Always set it explicitly to redeploy a prior good commit"
        required: false
        type: string
        default: ""

# Both gate jobs need Actions read to GET the private repository's Environment.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: production-preflight
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # Promote what staging last verified: merges keep landing on main, so the
      # newest main SHA is rarely staged yet. The gate below still requires the
      # exact SHA's green main ci.yml (and staging evidence under auto-approve).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ci
      - name: Resolve the commit to promote
        id: target
        run: node ci/resolve-promotion-sha.mjs
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refuse disabled, non-main, unprotected, untested or placeholder deployment
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}

  deploy-production:
    name: deploy-production
    needs: preflight
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    # 30 minutes: the gradual stages now also soak and judge the new
    # version's live error rate (worst case about 4 extra minutes a stage).
    timeout-minutes: 30
    # Shared production Worker mutation lock with the manual rollback job:
    # one static non-cancelling group serializes promotion and rollback
    # mutations to the same Worker. Workflow-level groups stay distinct so
    # the run never nests this group and the release job below never holds
    # it while publishing notes.
    concurrency:
      group: production-worker-mutation
      cancel-in-progress: false
    # Required reviewers + prevent-self-review are live repo settings unless
    # vars.PRODUCTION_AUTO_APPROVE is true, in which case the gate requires green
    # staging deploy + e2e-staging on this exact SHA instead, with the e2e-staging
    # staging-quality job executed and passed. Preflight refuses a
    # missing/unprotected Environment before GitHub can auto-create it.
    environment:
      name: production
      url: https://togetherweown.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the dispatch SHA that passed preflight, not a newer main head.
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Recheck production gate after Environment approval
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      - run: npm ci --include=dev
      # No migrations, queue creation or SQL tests here: provisioning and W16
      # rehearsal are separate operator work. CI uses disposable SQL services.
      - name: Build production target without deploying
        run: npx wrangler deploy --dry-run --env production --outdir dist-production
      - name: Require production-only Cloudflare credentials
        run: node ci/production-deploy-gate.mjs --credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Require production Worker secrets (names only, before any deploy)
        # Lists secret NAMES via wrangler and refuses on any missing required
        # name. Values are never read or printed; unreadable output fails
        # closed. Runs after the credentials check and before the moderator
        # preflight and the first deploy.
        run: node ci/check-production-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Moderator role-config preflight (production env, before any deploy)
        # Read env.production.vars only: Wrangler does not inherit top-level
        # vars into named environments. Fails closed when the production env
        # declares no moderators.
        run: npm run check:worker-moderators-production
      - name: Deploy production alert Tail Worker first
        # The app's env.production.tail_consumers binding needs the consumer to exist first.
        run: npx wrangler deploy --config tail/wrangler.jsonc --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      # Uploading a version does not mutate routes, custom domains or cron
      # triggers. The apex is already attached to this Worker; a full deploy
      # retries domain provisioning and fails with Cloudflare 100117, and the
      # triggers-sync subcommand also re-syncs routes/domains, so neither may
      # be used here. Cron/consumer drift is pinned by
      # test/probe-workflows.test.ts and reconciled per docs/runbook.md
      # ("Production trigger reconciliation"), never by this workflow.
      - name: Upload reviewed production version without changing triggers
        run: npx wrangler versions upload --env production --tag "${DEPLOY_SHA:?}-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      # Gradual promotion lives in the shared central composite action
      # (TogetherWeOwn/.github/actions/gradual-promote, pinned below): 5% ->
      # 50% -> 100% with per-stage health/SLO gates pinned to the new version,
      # and automatic rollback to the recorded pre-promote version on any stage
      # failure. Other repos call the same action; repo-specific build/upload
      # stays above.
      - name: Gradual promotion 5-50-100 with automatic rollback
        id: gradual
        uses: TogetherWeOwn/.github/actions/gradual-promote@89c290be20c0044efaf6916f28341c76e75fff06
        with:
          worker-name: two-web-next-production
          version-tag: ${{ needs.preflight.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          domain: togetherweown.com
          api-token: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}

  release:
    name: release
    # Tag the commit that is now live and publish its notes (release.yml).
    # preflight.outputs.sha is the promoted commit (DEPLOY_SHA), never main's tip.
    needs: [preflight, deploy-production]
    permissions:
      contents: write # Create the tag and its GitHub Release.
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.preflight.outputs.sha }}
