name: deploy-production

# Cutover only. Never runs on a push, PR, release, or completion of another workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refuse disabled, non-main, unprotected or placeholder deployment
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}

  deploy-production:
    name: deploy-production
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers + prevent-self-review are live repo settings. Preflight
    # refuses a missing/unprotected Environment before GitHub can auto-create it.
    environment:
      name: production
      url: https://togetherweown.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the dispatch SHA that passed preflight, not a newer main head.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Recheck production gate after Environment approval
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci --include=dev
      # No migrations, queue creation or SQL tests here: provisioning and W16
      # rehearsal are separate operator work. CI uses disposable SQL services.
      - name: Build production target without deploying
        run: npx wrangler deploy --dry-run --env production --outdir dist-production
      - name: Deploy reviewed production target
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke production /health
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 \
              https://togetherweown.com/health -o "$RUNNER_TEMP/production-health.json" && \
              node -e 'const fs = require("node:fs"); const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (health.ok !== true) process.exit(1)' \
                "$RUNNER_TEMP/production-health.json"; then
              echo "production /health ok (attempt $attempt)"
              exit 0
            fi
            sleep 10
          done
          echo '::error::production /health did not return successful JSON with ok=true after deployment'
          exit 1
