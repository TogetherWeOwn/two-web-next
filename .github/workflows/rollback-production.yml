name: rollback-production

# Never runs on a push, PR or release. One rollback path for every
# environment: a manual one-click rollback of the production Worker to a
# recorded known-good Worker Version ID, behind the same request and
# protection gates as a deploy, and a workflow_call for automation. The daily
# staging-rollback-drill.yml calls this same workflow with environment
# staging, so the production rollback is code that runs every day.
# ci/rollback-target.mjs maps each environment to its Worker and origin.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options: [production, staging]
        default: production
      version_id:
        description: "Recorded known-good Worker Version ID (lowercase UUID from `wrangler versions list`)"
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        description: "production or staging"
        required: true
        type: string
      version_id:
        description: "Recorded known-good Worker Version ID to restore"
        required: true
        type: string
      ref:
        description: "Main commit with green CI whose rollback scripts run; empty uses github.sha"
        required: false
        type: string
        default: ""
      expected_current_version_id:
        description: "Roll back only while this version is live; skip when version_id already serves; refuse otherwise"
        required: false
        type: string
        default: ""
    # Callers pass every secret by name. Production Environment secrets are
    # passed by name too: the called job's own `environment:` binding receives
    # their values, even though the caller job itself binds no environment
    # (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#passing-secrets-to-a-reusable-workflow).
    # The exact-match selectors below keep each leg on its own credential, and
    # the --credentials check fails closed on an empty value.
    # Staging Cloudflare credentials and the deploy-notify webhook key are
    # repo-level, so the callers pass exactly those by name.
    secrets:
      PRODUCTION_CLOUDFLARE_API_TOKEN:
        description: "Production Cloudflare API token (production Environment secret), for environment production only"
        required: false
      PRODUCTION_CLOUDFLARE_ACCOUNT_ID:
        description: "Production Cloudflare account id (production Environment secret), for environment production only"
        required: false
      CLOUDFLARE_API_TOKEN:
        description: "Staging Cloudflare API token fallback (repo secret), for environment staging only"
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: "Staging Cloudflare account id fallback (repo secret), for environment staging only"
        required: false
      staging_cloudflare_api_token:
        description: "Staging Cloudflare API token (repo secret), for environment staging only"
        required: false
      staging_cloudflare_account_id:
        description: "Staging Cloudflare account id (repo secret), for environment staging only"
        required: false
      PAPERCLIP_DEPLOY_WEBHOOK_SECRET:
        description: "Paperclip deploy-notify HMAC key (repo secret), production notify only"
        required: false
    outputs:
      action:
        description: "rollback when traffic moved, skip when version_id already served"
        value: ${{ jobs.rollback-production.outputs.action }}

# Both gate jobs need Actions read to GET the private repository's Environment.
permissions:
  contents: read
  actions: read

concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    name: rollback-preflight
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refuse an unknown environment
        # Before the rollback job names it as its GitHub Environment, so a
        # typo can never auto-create an unprotected Environment.
        run: node ci/rollback-target.mjs --environment
        env:
          ROLLBACK_ENVIRONMENT: ${{ inputs.environment }}
      - name: Refuse disabled, non-main, unprotected or untested rollback
        run: node ci/production-deploy-gate.mjs --rollback
        env:
          ROLLBACK_ENVIRONMENT: ${{ inputs.environment }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          GITHUB_TOKEN: ${{ github.token }}
          # Rollback checks out the scripts commit; the gate verifies DEPLOY_SHA.
          DEPLOY_SHA: ${{ inputs.ref || github.sha }}
      - name: Refuse an empty, malformed or injectable version_id
        # The input travels inputs -> env -> quoted shell variable, never
        # through expression interpolation in a run: block.
        run: node ci/production-deploy-gate.mjs --version-id
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}

  rollback-production:
    name: rollback-production
    needs: preflight
    outputs:
      action: ${{ steps.guard.outputs.action }}
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Shared Worker mutation lock per environment: production shares the
    # static non-cancelling group with the promotion job, staging shares the
    # deploy-staging group with deploy.yml, so a rollback never interleaves
    # with a deploy to the same Worker. Workflow-level groups stay distinct
    # so the run never nests this group.
    concurrency:
      group: ${{ inputs.environment == 'staging' && 'deploy-staging' || 'production-worker-mutation' }}
      cancel-in-progress: false
    # Preflight verifies the environment name and the configured
    # automated-evidence or reviewer mode before GitHub can auto-create a
    # missing/unprotected Environment.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'staging' && 'https://next.togetherweown.com' || 'https://togetherweown.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Roll back from the scripts commit that passed preflight, not a newer main head.
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve the environment's Worker and origin
        id: target
        run: node ci/rollback-target.mjs --environment
        env:
          ROLLBACK_ENVIRONMENT: ${{ inputs.environment }}
      - name: Recheck rollback gate after Environment approval
        run: node ci/production-deploy-gate.mjs --rollback
        env:
          ROLLBACK_ENVIRONMENT: ${{ inputs.environment }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          GITHUB_TOKEN: ${{ github.token }}
          # Rollback checks out the scripts commit; the gate verifies DEPLOY_SHA.
          DEPLOY_SHA: ${{ inputs.ref || github.sha }}
      - name: Recheck version_id after Environment approval
        run: node ci/production-deploy-gate.mjs --version-id
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}
      - run: npm ci --include=dev
      # No migrations, queue creation or SQL tests here: provisioning and W16
      # rehearsal are separate operator work. CI uses disposable SQL services.
      - name: Require the environment's Cloudflare credentials
        run: node ci/production-deploy-gate.mjs --credentials
        env:
          # Prod via declared call secret + this job's environment binding;
          # staging via declared call secrets, direct repo secret on manual dispatch.
          CLOUDFLARE_API_TOKEN: ${{ inputs.environment == 'production' && secrets.PRODUCTION_CLOUDFLARE_API_TOKEN || inputs.environment == 'staging' && (secrets.staging_cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN) || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'production' && secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID || inputs.environment == 'staging' && (secrets.staging_cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID) || '' }}
      - name: Refuse when an unexpected version is live
        # Automation passes expected_current_version_id: roll back only while
        # that version serves, report skip when version_id already serves,
        # and refuse when anything else is live (a deploy landed in between).
        # Manual dispatch leaves it empty and always rolls back.
        id: guard
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_CURRENT_VERSION_ID" ]; then
            echo "action=rollback" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx wrangler deployments list --name "$ROLLBACK_WORKER_NAME" --json > "$RUNNER_TEMP/deployments.json"
          node ci/rollback-target.mjs --action < "$RUNNER_TEMP/deployments.json"
        env:
          EXPECTED_CURRENT_VERSION_ID: ${{ inputs.expected_current_version_id }}
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}
          ROLLBACK_WORKER_NAME: ${{ steps.target.outputs.worker }}
          # Prod via declared call secret + this job's environment binding;
          # staging via declared call secrets, direct repo secret on manual dispatch.
          CLOUDFLARE_API_TOKEN: ${{ inputs.environment == 'production' && secrets.PRODUCTION_CLOUDFLARE_API_TOKEN || inputs.environment == 'staging' && (secrets.staging_cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN) || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'production' && secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID || inputs.environment == 'staging' && (secrets.staging_cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID) || '' }}
      - name: Require rollback target version secrets (names only, before rollback)
        # Reads the recorded target version's secret_text bindings via
        # wrangler versions view and refuses on any missing required name.
        # Values are never read or printed; unreadable output fails closed.
        # Runs after the credentials check and before the rollback. The
        # rollback deploys the target version's own bindings, never the
        # checked-out commit: reading the latest listing here would refuse
        # the rollback that restores a deleted secret. No moderator or
        # dry-run build gate here: both validate the dispatch SHA, not the
        # recorded version, and must never block the emergency path.
        run: node ci/check-production-secrets.mjs --rollback-version
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}
          ROLLBACK_WORKER_NAME: ${{ steps.target.outputs.worker }}
          # Prod via declared call secret + this job's environment binding;
          # staging via declared call secrets, direct repo secret on manual dispatch.
          CLOUDFLARE_API_TOKEN: ${{ inputs.environment == 'production' && secrets.PRODUCTION_CLOUDFLARE_API_TOKEN || inputs.environment == 'staging' && (secrets.staging_cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN) || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'production' && secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID || inputs.environment == 'staging' && (secrets.staging_cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID) || '' }}
      - name: Capture pre-rollback dead-letter baseline
        id: dead-letter-baseline
        # Read-only GET before the rollback: the post-rollback smoke fails only
        # on growth past this retained-rows count, so the emergency path never
        # goes red on history. Retried, then an unreadable /up leaves the
        # baseline empty and the smoke skips the dead-letter gate on history
        # (SMOKE_ALLOW_MISSING_BASELINE below) instead of failing on any
        # positive count. Never blocks the rollback on its own.
        run: |
          baseline=""
          for i in 1 2 3 4 5; do
            candidate="$(node -e 'fetch(new URL("/up", process.env.ROLLBACK_ORIGIN), { signal: AbortSignal.timeout(10000) }).then((r) => r.json()).then((d) => { const f = d && d.queue ? d.queue.failed : undefined; if (typeof f === "number" && Number.isInteger(f) && f >= 0) process.stdout.write(String(f)); }).catch(() => {})' || true)"
            if [ -n "$candidate" ]; then baseline="$candidate"; break; fi
            if [ "$i" -lt 5 ]; then sleep 5; fi
          done
          if [ -z "$baseline" ]; then echo "::warning::dead-letter baseline unreadable after 5 attempts; rollback smoke will skip the dead-letter gate on history"; fi
          echo "failed=$baseline" >> "$GITHUB_OUTPUT"
          echo "dead-letter baseline: ${baseline:-unknown}"
        env:
          ROLLBACK_ORIGIN: ${{ steps.target.outputs.origin }}
      - name: Roll back to the recorded Worker Version
        if: steps.guard.outputs.action == 'rollback'
        # Non-interactive CI auto-accepts wrangler's confirmation prompt with the
        # default answer. The version id was gate-validated above and is quoted.
        run: npx wrangler rollback "$ROLLBACK_VERSION_ID" --name "$ROLLBACK_WORKER_NAME"
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}
          ROLLBACK_WORKER_NAME: ${{ steps.target.outputs.worker }}
          # Prod via declared call secret + this job's environment binding;
          # staging via declared call secrets, direct repo secret on manual dispatch.
          CLOUDFLARE_API_TOKEN: ${{ inputs.environment == 'production' && secrets.PRODUCTION_CLOUDFLARE_API_TOKEN || inputs.environment == 'staging' && (secrets.staging_cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN) || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'production' && secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID || inputs.environment == 'staging' && (secrets.staging_cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID) || '' }}
      - name: Smoke test public routes on the rolled-back version
        # Same GET-only public-route set as staging (bin/smoke.mjs), so the two
        # gates cannot drift. Manual redirects keep the checks unauthenticated
        # and never visit Discord: no auth, no writes, no PII. Indexable apex
        # HTML omits the staging noindex (src/headers.ts), so only production
        # passes --allow-indexable; the archive and the branded 404 stay
        # meta-noindex and skip the header assertion inside the checker. DB/schema readiness is mandatory via the /up envelope;
        # queue-only degraded/unknown is allowed. Dead letters fail only on
        # growth past the pre-rollback baseline, never on retained history;
        # when the baseline capture could not read /up the gate is skipped
        # instead of failing on history. Critical ready-wait warns and passes
        # here by design (--fail-on-ready-wait-critical is staging-only): the
        # age reflects shared queue_jobs state, not the rolled-back version,
        # so it must not fail a good rollback. Ordinary-traffic identity is
        # enforced below: the recorded version UUID travels inputs -> env ->
        # quoted shell variable and the smoke proves that version serves
        # unpinned routing (no version-override header).
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}
          ROLLBACK_ORIGIN: ${{ steps.target.outputs.origin }}
          ROLLBACK_INDEXABLE: ${{ steps.target.outputs.indexable }}
          SMOKE_FAILED_BASELINE: ${{ steps.dead-letter-baseline.outputs.failed }}
          SMOKE_ALLOW_MISSING_BASELINE: "1"
        run: |
          indexable=()
          if [ "$ROLLBACK_INDEXABLE" = "true" ]; then indexable=(--allow-indexable); fi
          for i in 1 2 3 4 5 6; do
            if node bin/smoke.mjs "$ROLLBACK_ORIGIN" "${indexable[@]}" --expected-version-id "$ROLLBACK_VERSION_ID"; then
              echo "rollback smoke ok (attempt $i)"
              exit 0
            fi
            if [ "$i" -lt 6 ]; then
              echo "attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::public-route smoke failed after rollback"
          exit 1
