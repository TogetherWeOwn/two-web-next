name: rollback-production

# Cutover only. Never runs on a push, PR, release, or completion of another workflow.
# Manual one-click rollback of the production Worker to a recorded known-good
# Worker Version ID, behind the same request and protection gates as a deploy.
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Recorded known-good Worker Version ID (lowercase UUID from `wrangler versions list`)"
        required: true
        type: string

# Both gate jobs need Actions read to GET the private repository's Environment.
permissions:
  contents: read
  actions: read

concurrency:
  group: rollback-production
  cancel-in-progress: false

jobs:
  preflight:
    name: production-rollback-preflight
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refuse disabled, non-main, unprotected or placeholder deployment
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
          # Rollback checks out github.sha; the gate verifies DEPLOY_SHA.
          DEPLOY_SHA: ${{ github.sha }}
      - name: Refuse an empty, malformed or injectable version_id
        # The input travels inputs -> env -> quoted shell variable, never
        # through expression interpolation in a run: block.
        run: node ci/production-deploy-gate.mjs --version-id
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}

  rollback-production:
    name: rollback-production
    needs: preflight
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Shared production Worker mutation lock with the promotion job: the same
    # static non-cancelling group serializes rollback and promotion mutations
    # to the same Worker. Workflow-level groups stay distinct so the run never
    # nests this group.
    concurrency:
      group: production-worker-mutation
      cancel-in-progress: false
    # Required reviewers + prevent-self-review are live repo settings. Preflight
    # refuses a missing/unprotected Environment before GitHub can auto-create it.
    environment:
      name: production
      url: https://togetherweown.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Roll back from the dispatch SHA that passed preflight, not a newer main head.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Recheck production gate after Environment approval
        run: node ci/production-deploy-gate.mjs
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
          # Rollback checks out github.sha; the gate verifies DEPLOY_SHA.
          DEPLOY_SHA: ${{ github.sha }}
      - name: Recheck version_id after Environment approval
        run: node ci/production-deploy-gate.mjs --version-id
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}
      - run: npm ci --include=dev
      # No migrations, queue creation or SQL tests here: provisioning and W16
      # rehearsal are separate operator work. CI uses disposable SQL services.
      - name: Require production-only Cloudflare credentials
        run: node ci/production-deploy-gate.mjs --credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Require rollback target version secrets (names only, before rollback)
        # Reads the recorded target version's secret_text bindings via
        # wrangler versions view and refuses on any missing required name.
        # Values are never read or printed; unreadable output fails closed.
        # Runs after the credentials check and before the rollback. The
        # rollback deploys the target version's own bindings, never the
        # checked-out commit: reading the latest listing here would refuse
        # the rollback that restores a deleted secret. No moderator or
        # dry-run build gate here: both validate the dispatch SHA, not the
        # recorded version, and must never block the emergency path.
        run: node ci/check-production-secrets.mjs --rollback-version
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Capture pre-rollback dead-letter baseline
        id: dead-letter-baseline
        # Read-only GET before the rollback: the post-rollback smoke fails only
        # on growth past this retained-rows count, so the emergency path never
        # goes red on history. Retried, then an unreadable /up leaves the
        # baseline empty and the smoke skips the dead-letter gate on history
        # (SMOKE_ALLOW_MISSING_BASELINE below) instead of failing on any
        # positive count. Never blocks the rollback on its own.
        run: |
          baseline=""
          for i in 1 2 3 4 5; do
            candidate="$(node -e 'fetch("https://togetherweown.com/up", { signal: AbortSignal.timeout(10000) }).then((r) => r.json()).then((d) => { const f = d && d.queue ? d.queue.failed : undefined; if (typeof f === "number" && Number.isInteger(f) && f >= 0) process.stdout.write(String(f)); }).catch(() => {})' || true)"
            if [ -n "$candidate" ]; then baseline="$candidate"; break; fi
            if [ "$i" -lt 5 ]; then sleep 5; fi
          done
          if [ -z "$baseline" ]; then echo "::warning::dead-letter baseline unreadable after 5 attempts; rollback smoke will skip the dead-letter gate on history"; fi
          echo "failed=$baseline" >> "$GITHUB_OUTPUT"
          echo "dead-letter baseline: ${baseline:-unknown}"
      - name: Roll back to the recorded production Worker Version
        # Non-interactive CI auto-accepts wrangler's confirmation prompt with the
        # default answer. The version id was gate-validated above and is quoted.
        run: npx wrangler rollback "$ROLLBACK_VERSION_ID" --name two-web-next-production
        env:
          ROLLBACK_VERSION_ID: ${{ inputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production public routes
        # Same GET-only public-route set as staging (bin/smoke.mjs), so the two
        # gates cannot drift. Manual redirects keep the checks unauthenticated
        # and never visit Discord: no auth, no writes, no PII. Indexable apex
        # HTML omits the staging noindex (src/headers.ts); the archive and the
        # branded 404 stay meta-noindex and skip the header assertion inside
        # the checker. DB/schema readiness is mandatory via the /up envelope;
        # queue-only degraded/unknown is allowed. Dead letters fail only on
        # growth past the pre-rollback baseline, never on retained history;
        # when the baseline capture could not read /up the gate is skipped
        # instead of failing on history. Critical ready-wait warns and passes
        # here by design (--fail-on-ready-wait-critical is staging-only): the
        # age reflects shared queue_jobs state, not the rolled-back version,
        # so it must not fail a good rollback.
        env:
          SMOKE_FAILED_BASELINE: ${{ steps.dead-letter-baseline.outputs.failed }}
          SMOKE_ALLOW_MISSING_BASELINE: "1"
        run: |
          for i in 1 2 3 4 5 6; do
            if node bin/smoke.mjs https://togetherweown.com --allow-indexable; then
              echo "production smoke ok (attempt $i)"
              exit 0
            fi
            if [ "$i" -lt 6 ]; then
              echo "attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "::error::production public-route smoke failed after rollback"
          exit 1
