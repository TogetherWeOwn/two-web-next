# guards: release: exact-head promotion-path routing evidence
name: promotion-path
on:
  pull_request_target:
    # GitHub reports same-head base retargets through edited.
    types: [opened, reopened, synchronize, edited]
permissions: {}
concurrency:
  # Concurrency is evaluated before runner admission. Rejected edits get
  # their own slot so they cannot cancel a real refresh or replace its queue.
  group: >-
    ${{ (github.event.action != 'edited' ||
      (github.event.changes.base.ref.from &&
       github.event.changes.base.ref.from != github.event.pull_request.base.ref))
      && format('promotion-path-refresh-{0}', github.event.pull_request.number)
      || format('promotion-path-noop-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  label:
    # Keep serializing against runs started by the previous workflow revision.
    concurrency:
      group: >-
        ${{ (github.event.action != 'edited' ||
          (github.event.changes.base.ref.from &&
           github.event.changes.base.ref.from != github.event.pull_request.base.ref))
          && format('promotion-path-{0}', github.event.pull_request.number)
          || format('promotion-path-noop-job-{0}', github.run_id) }}
      cancel-in-progress: false
    # Match workflow admission and let an admitted publisher drain.
    if: >-
      ${{ always() && (github.event.action != 'edited' ||
        (github.event.changes.base.ref.from &&
         github.event.changes.base.ref.from != github.event.pull_request.base.ref)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target loads this workflow from the default branch even
      # on retarget. Use that exact revision for code, never either PR ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Classify current PR file metadata
        id: classify
        timeout-minutes: 4 # 3-minute classification budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/promotion-path.mjs classify
      - name: Publish advisory labels and exact-ref verdict
        # Finish any label writes and cleanup before releasing the per-PR lock.
        # A canceled read-only classification has nothing to publish or clean up.
        if: ${{ always() && (steps.classify.outcome == 'success' || steps.classify.outcome == 'failure') }}
        timeout-minutes: 2 # 90-second publication budget, then 15 seconds for cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
        run: node ci/promotion-path.mjs publish
