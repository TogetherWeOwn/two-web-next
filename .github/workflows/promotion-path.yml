name: promotion-path

on:
  pull_request_target:
    # Base retargets arrive as edited events. Every queued run reads live refs.
    types: [opened, reopened, synchronize, edited]

permissions: {}

concurrency:
  group: promotion-path-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target loads this workflow from the default branch even
      # on retarget. Use that exact revision for code, never either PR ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Classify current PR file metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/promotion-path.mjs
