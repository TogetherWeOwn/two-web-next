name: Kit event band evidence

on:
  workflow_dispatch:
    inputs:
      before_sha:
        description: Baseline app commit SHA
        required: true
        type: string
      after_sha:
        description: Product app commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state: [guest-populated, member-populated, guest-empty, member-empty, guest-unavailable, member-unavailable, session-outage]
    steps:
      - name: Initialize diagnostics
        env:
          STATE: ${{ matrix.state }}
          TOOLING_SHA: ${{ github.sha }}
        run: |
          mkdir -p "artifacts/$STATE"
          printf 'state=%s\ntooling=%s\nrun=%s\n' "$STATE" "$TOOLING_SHA" "$GITHUB_RUN_ID" > "artifacts/$STATE/diagnostics.txt"
      - name: Validate immutable inputs
        env:
          BEFORE_SHA: ${{ inputs.before_sha }}
          AFTER_SHA: ${{ inputs.after_sha }}
        run: |
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out capture tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.before_sha }}
          path: before
          persist-credentials: false
      - name: Check out product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.after_sha }}
          path: after
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify immutable checkouts
        env:
          TOOLING_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ inputs.before_sha }}
          AFTER_SHA: ${{ inputs.after_sha }}
        run: |
          test "$(git -C tooling rev-parse HEAD)" = "$TOOLING_SHA"
          test "$(git -C before rev-parse HEAD)" = "$BEFORE_SHA"
          test "$(git -C after rev-parse HEAD)" = "$AFTER_SHA"
      - name: Install locked dependencies
        run: |
          for app in tooling before after; do
            npm ci --prefix "$app" --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
            npm ci --prefix "$app/web" --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
          done
      - name: Install hosted Chromium
        working-directory: tooling
        run: npx --no-install playwright install --with-deps chromium
      - name: Capture state
        env:
          BEFORE_SHA: ${{ inputs.before_sha }}
          AFTER_SHA: ${{ inputs.after_sha }}
          TOOLING_SHA: ${{ github.sha }}
          STATE: ${{ matrix.state }}
          TZ: UTC
        run: node tooling/ci/kit-event-band-capture.mjs "$STATE" "artifacts/$STATE"
      - name: Retain evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-event-band-${{ matrix.state }}-${{ inputs.after_sha }}
          path: artifacts/${{ matrix.state }}/
          if-no-files-found: warn
          retention-days: 14
