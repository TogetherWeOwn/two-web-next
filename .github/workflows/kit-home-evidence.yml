name: Kit home evidence

on:
  pull_request:
    paths:
      - .github/workflows/kit-home-evidence.yml
      - ci/kit-home-evidence.*
      - ci/kit-browser-fixture.mjs
      - web/src/routes/+page.svelte
      - web/src/lib/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-home-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
      - run: npm ci --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
      - name: Capture home screenshots (guest and member, populated, empty and degraded)
        run: node ci/kit-home-evidence.mjs artifacts/kit-home-evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-home-evidence
          path: artifacts/kit-home-evidence/
          if-no-files-found: error
          retention-days: 14
