name: Kit live topic browser fixture

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/kit-live-topic-browser.yml
      - .npmrc
      - ci/fixtures/kit-live-frames.json
      - ci/kit-hydration-harness.mjs
      - ci/kit-hydration-harness.test.mjs
      - ci/kit-live-topic-browser.test.mjs
      - test/fixtures/kit-browser-harness.svelte
      - test/fixtures/kit-live-topic-browser.svelte
      - src/live/**
      - assets/islands/kit-public-voice.js
      - web/src/routes/+page.server.ts
      - web/src/routes/+page.svelte
      - package*.json
      - web/.npmrc
      - web/package*.json
  push:
    branches: [main]
    # Keep this list in sync with pull_request; actionlint rejects aliases here.
    paths:
      - .github/workflows/kit-live-topic-browser.yml
      - .npmrc
      - ci/fixtures/kit-live-frames.json
      - ci/kit-hydration-harness.mjs
      - ci/kit-hydration-harness.test.mjs
      - ci/kit-live-topic-browser.test.mjs
      - test/fixtures/kit-browser-harness.svelte
      - test/fixtures/kit-live-topic-browser.svelte
      - src/live/**
      - assets/islands/kit-public-voice.js
      - web/src/routes/+page.server.ts
      - web/src/routes/+page.svelte
      - package*.json
      - web/.npmrc
      - web/package*.json

permissions:
  contents: read

concurrency:
  group: kit-live-topic-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-topic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
      - run: npm ci --prefix web --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: node --test --test-timeout=120000 ci/kit-live-topic-browser.test.mjs ci/kit-hydration-harness.test.mjs
