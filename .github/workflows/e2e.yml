name: e2e

# Browser smoke for the critical journeys (docs/critical-journeys.md).
# Private repo: self-hosted runners only. The job runs in its own network
# namespace (container), so wrangler's dev port and the forwarded Postgres
# port collide with nothing on the shared Docker host.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: browser-smoke
    # Overflow switch: see CI_OVERFLOW_* note on the a11y job in ci.yml.
    runs-on: ${{ fromJSON((contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'browser-smoke') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 25
    # Self-hosted runners share one Docker host, so a published 5432 (and
    # wrangler's dev ports) collide across concurrent jobs. A job container has
    # its own network namespace; localhost:5432 is forwarded to the service.
    container:
      image: node:24-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: two_web_next
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d two_web_next"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://agent_test@127.0.0.1:5432/two_web_next
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Job-private localhost:5432 forward to the Postgres service
        run: |
          # On hosted/overflow runners the job container's root does not own the
          # runner-owned checkout, so Git refuses it as dubious ownership.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends socat postgresql-client >/dev/null
          nohup setsid socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 >/dev/null 2>&1 &
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -U agent_test -d two_web_next && exit 0; sleep 1; done
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - name: Verify CI isolation
        run: node e2e/prepare.mjs
      - name: Apply migrations to disposable Postgres
        run: npm run db:migrate
      - name: Seed journey fixtures
        run: node e2e/seed.mjs
      - name: Install Chromium
        # --with-deps needs apt; the container runs as root, so no sudo.
        run: npx playwright install --with-deps chromium
      - name: Critical browser journeys
        run: npm run e2e
      - name: Failure traces and report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove ephemeral QA material
        if: always()
        run: rm -f e2e/.dev.vars
