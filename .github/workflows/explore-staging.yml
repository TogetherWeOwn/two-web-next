name: explore-staging

# Daily guest explorer of the STAGING Worker (docs/explore-staging.md):
# breadth-first crawl at desktop and mobile widths recording console/page
# errors, failed subresources, non-200 pages, broken images, horizontal
# overflow and serious/critical axe violations, with screenshots. GET-only
# (watch guard), guest-only, staging-only (no input, no production target).
# Report-only: findings never fail the run; the daily QA routine reads the
# findings artifact and files one card per new finding. Public repo: standard
# GitHub-hosted runners; artifacts are guest screenshots of the public staging
# site and the findings JSON, no secrets.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explore-staging
  cancel-in-progress: false

jobs:
  explore:
    name: explore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Explore staging
        run: npx playwright test --config playwright.explore.config.ts
      - name: Findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: explore-findings
          path: explore-results/
          if-no-files-found: warn
          retention-days: 14
