name: backup-bootstrap-selftest

# Always runs on every PR and main push: the trigger carries no `paths:`
# filter. A workflow-level path filter would leave this workflow without any
# run when a PR touches none of the listed paths, so an aggregator job inside
# it could never serve as a required check and the PR would wait forever.
# Relevance is decided per PR by the `scope` job instead (ci/path-scope.sh
# fails closed), the heavy job is gated on that verdict, and the always-run
# `backup-bootstrap` aggregator below reports the conclusion. No ruleset
# change here: requiring the aggregator is a human-admin step.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The scope job lists the PR's changed files via the API.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Change-scope gate: only PRs touching the bootstrap inputs run the suite.
  # Pushes to main and any doubt always count as relevant (fail closed).
  scope:
    name: scope
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Token boundary (mirrors ci.yml): this is the only step that holds
      # GH_TOKEN, and it runs no repository code. It fetches the changed-file
      # list and the scope script as of the PR's base commit, so
      # classification below executes trusted code instead of the PR tree's
      # copy of the script.
      - name: Fetch changed-file list and base scope script
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | "\(.filename)\t\(.previous_filename // "")"' > "$RUNNER_TEMP/pr-files.tsv"
          mkdir -p "$RUNNER_TEMP/trusted-scope"
          gh api "repos/$REPO/contents/ci/path-scope.sh?ref=$BASE_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/trusted-scope/path-scope.sh"
      # No token in this step. It runs the base-branch scope script and
      # publishes only a single validated verdict line.
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash "$RUNNER_TEMP/trusted-scope/path-scope.sh" "$RUNNER_TEMP/pr-files.tsv" "$CHANGED_FILES" -- \
            "bin/backup-bootstrap.sh" \
            "ci/backup-bootstrap-selftest" \
            "ci/path-scope.sh" \
            ".github/workflows/db-backup.yml" \
            ".github/workflows/backup-bootstrap-selftest.yml" \
            ".github/workflows/backup-restore-proof.yml" > "$RUNNER_TEMP/scope-verdict.txt"
          verdict=$(cat "$RUNNER_TEMP/scope-verdict.txt")
          case "$verdict" in
            relevant=true|relevant=false) echo "$verdict" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected path-scope verdict; failing closed."; exit 1 ;;
          esac
      # Last on purpose: this runs the PR tree's copy of the script, so it
      # sits after the token-bearing fetch and the classification it could
      # otherwise reach. It holds no token and cannot change the verdict
      # above; a failure still fails this job, and the aggregator fails
      # closed on a non-success scope.
      - name: Path-scope selftest (fixtures, no network)
        run: bash ci/path-scope.sh --selftest

  bootstrap-selftest:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    container: python:3.13-bookworm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline PGDG bootstrap regressions (no secrets or host provisioning)
        run: python3 ci/backup-bootstrap-selftest

  # Always-run aggregator: reports the required-check conclusion even when
  # the suite is skipped for an irrelevant PR. A skipped required check is
  # mergeable, so this job explicitly fails when the scope verdict is not a
  # clean bill or when a relevant suite did not succeed. Name pinned equal
  # to the id: a future ruleset requires `backup-bootstrap`.
  backup-bootstrap:
    name: backup-bootstrap
    needs: [scope, bootstrap-selftest]
    if: always()
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Report the required-check conclusion
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          SUITE_RESULT: ${{ needs.bootstrap-selftest.result }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != success ]; then
            echo "::error::scope did not succeed; failing closed."
            exit 1
          fi
          if [ "$RELEVANT" != true ]; then
            echo "No backup-bootstrap inputs changed; required check passes without the suite."
            exit 0
          fi
          test "$SUITE_RESULT" = success
