name: db-serving-ledger-isolation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply, undo, or classify the approved serving ledger isolation
        required: true
        type: choice
        options:
          - readback
          - forward
          - undo
      ledger:
        description: Exact approved production ledger end
        required: true
        type: choice
        options: [1033_session-roles-checked-at, 1037_waitlist-offers]

permissions: {}

concurrency:
  group: web-migrate-production
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      checked_attempt: ${{ steps.scope.outputs.checked_attempt }}
    steps:
      - name: Check protected ref and pin scope
        id: scope
        shell: bash
        env:
          BROADER_SCOPE_SECRETS: ${{ secrets.PRODUCTION_DB_ISOLATION_APPROVED_SHA != '' ||
            secrets.PRODUCTION_DB_ISOLATION_PLAN_SHA256 != '' || secrets.PRODUCTION_DB_ISOLATION_PLAN != '' ||
            secrets.PRODUCTION_DB_ISOLATION_DATABASE_URL != '' ||
            secrets.PRODUCTION_DB_ISOLATION_CF_ACCOUNT_ID != '' || secrets.PRODUCTION_DB_ISOLATION_CF_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_REF_PROTECTED" != true || "$BROADER_SCOPE_SECRETS" != false ]]; then
            printf '%s\n' 'Database serving ledger isolation admission refused.' >&2
            exit 1
          fi
          printf 'checked_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  isolation:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production-worker-mutation
      queue: max
      cancel-in-progress: false
    steps:
      - name: Require approval pins for this run attempt
        shell: bash
        env:
          CHECKED_ATTEMPT: ${{ needs.preflight.outputs.checked_attempt }}
          APPROVED_SHA: ${{ secrets.PRODUCTION_DB_ISOLATION_APPROVED_SHA }}
          PLAN_SHA256: ${{ secrets.PRODUCTION_DB_ISOLATION_PLAN_SHA256 }}
        run: |
          set -euo pipefail
          if [[ "$CHECKED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ||
                ! "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ||
                ! "$PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            printf '%s\n' 'Database serving ledger isolation admission refused.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select the approved serving isolation revision
        shell: bash
        env:
          APPROVED_SHA: ${{ secrets.PRODUCTION_DB_ISOLATION_APPROVED_SHA }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if ! bash .github/scripts/select-db-repair-revision.sh '.github/workflows/db-serving-ledger-isolation.yml' >/dev/null 2>&1; then
            printf '%s\n' 'Approved serving isolation revision refused.' >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Run approved serving ledger isolation operation
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          LEDGER: ${{ inputs.ledger }}
          PRODUCTION_DB_ISOLATION_PLAN_SHA256: ${{ secrets.PRODUCTION_DB_ISOLATION_PLAN_SHA256 }}
          PRODUCTION_DB_ISOLATION_PLAN: ${{ secrets.PRODUCTION_DB_ISOLATION_PLAN }}
          PRODUCTION_DB_ISOLATION_DATABASE_URL: ${{ secrets.PRODUCTION_DB_ISOLATION_DATABASE_URL }}
          PRODUCTION_DB_ISOLATION_CF_ACCOUNT_ID: ${{ inputs.operation == 'forward' && secrets.PRODUCTION_DB_ISOLATION_CF_ACCOUNT_ID || '' }}
          PRODUCTION_DB_ISOLATION_CF_READ_TOKEN: ${{ inputs.operation == 'forward' && secrets.PRODUCTION_DB_ISOLATION_CF_READ_TOKEN || '' }}
        run: |
          set -euo pipefail
          status=0
          { node ci/db-serving-ledger-isolation.mjs "$OPERATION" "$LEDGER"; } >/dev/null 2>&1 || status=$?
          case "$OPERATION:$status" in
            forward:0) printf '%s\n' 'Database serving ledger isolation committed.' ;;
            undo:0) printf '%s\n' 'Database serving ledger isolation inverse committed.' ;;
            readback:10) printf '%s\n' 'Database serving grants match the approved original state.' ;;
            readback:11) printf '%s\n' 'Database serving grants match the approved isolated state.' ;;
            *)
              printf '%s\n' 'Database serving ledger isolation operation did not confirm an outcome.' >&2
              exit 1 ;;
          esac
