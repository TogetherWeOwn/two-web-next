name: db-permissions-repair

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply, undo, or classify the approved permissions repair
        required: true
        type: choice
        options:
          - readback
          - forward
          - undo

permissions: {}

concurrency:
  group: web-migrate-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      checked_attempt: ${{ steps.scope.outputs.checked_attempt }}
    steps:
      - name: Check protected ref and pin scope
        id: scope
        shell: bash
        env:
          BROADER_SCOPE_SECRETS: ${{ secrets.PRODUCTION_DB_REPAIR_APPROVED_SHA != '' ||
            secrets.PRODUCTION_DB_REPAIR_PLAN_SHA256 != '' || secrets.PRODUCTION_DB_REPAIR_PLAN != '' ||
            secrets.PRODUCTION_DB_REPAIR_DATABASE_URL != '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_REF_PROTECTED" != true || "$BROADER_SCOPE_SECRETS" != false ]]; then
            printf '%s\n' 'Database permissions repair admission refused.' >&2
            exit 1
          fi
          printf 'checked_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  repair:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - name: Require approval pins for this run attempt
        shell: bash
        env:
          CHECKED_ATTEMPT: ${{ needs.preflight.outputs.checked_attempt }}
          APPROVED_SHA: ${{ secrets.PRODUCTION_DB_REPAIR_APPROVED_SHA }}
          PLAN_SHA256: ${{ secrets.PRODUCTION_DB_REPAIR_PLAN_SHA256 }}
        run: |
          set -euo pipefail
          if [[ "$CHECKED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ||
                ! "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ||
                ! "$PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            printf '%s\n' 'Database permissions repair admission refused.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select the approved database repair revision
        shell: bash
        env:
          APPROVED_SHA: ${{ secrets.PRODUCTION_DB_REPAIR_APPROVED_SHA }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if ! bash .github/scripts/select-db-repair-revision.sh '.github/workflows/db-permissions-repair.yml' >/dev/null 2>&1; then
            printf '%s\n' 'Approved database repair revision refused.' >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Run approved permissions repair operation
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          PRODUCTION_DB_REPAIR_PLAN_SHA256: ${{ secrets.PRODUCTION_DB_REPAIR_PLAN_SHA256 }}
          PRODUCTION_DB_REPAIR_PLAN: ${{ secrets.PRODUCTION_DB_REPAIR_PLAN }}
          PRODUCTION_DB_REPAIR_DATABASE_URL: ${{ secrets.PRODUCTION_DB_REPAIR_DATABASE_URL }}
        run: |
          set -euo pipefail
          status=0
          { node ci/db-permissions-repair.mjs "$OPERATION"; } >/dev/null 2>&1 || status=$?
          case "$OPERATION:$status" in
            forward:0) printf '%s\n' 'Database permissions repair committed.' ;;
            undo:0) printf '%s\n' 'Database permissions repair inverse committed.' ;;
            readback:10) printf '%s\n' 'Database permissions match the approved pre-repair state.' ;;
            readback:11) printf '%s\n' 'Database permissions match the approved post-repair state.' ;;
            *)
              printf '%s\n' 'Database permissions operation did not confirm an outcome.' >&2
              case "$status" in
                12) printf '%s\n' 'Connection close failed after the transaction was acknowledged.' ;;
                13) printf '%s\n' 'Connection close failed after reading the approved pre-repair state.' ;;
                14) printf '%s\n' 'Connection close failed after reading the approved post-repair state.' ;;
                30) printf '%s\n' 'Plan or endpoint admission failed.' ;;
                31) printf '%s\n' 'Connection or session setup failed.' ;;
                32) printf '%s\n' 'Migration advisory lock phase failed.' ;;
                33) printf '%s\n' 'Snapshot lock phase failed.' ;;
                34) printf '%s\n' 'Ledger or catalog lock phase failed.' ;;
                35) printf '%s\n' 'Writer guard phase failed.' ;;
                36) printf '%s\n' 'Pre-change state or authority check failed.' ;;
                37) printf '%s\n' 'Permission or ownership statement failed.' ;;
                38) printf '%s\n' 'Post-change verification failed.' ;;
                39) printf '%s\n' 'Transaction completion was not acknowledged.' ;;
                40) printf '%s\n' 'Readback phase failed.' ;;
                41) printf '%s\n' 'Snapshot lock was unavailable.' ;;
                42) printf '%s\n' 'Ledger or catalog lock was unavailable.' ;;
              esac >&2
              exit 1 ;;
          esac
