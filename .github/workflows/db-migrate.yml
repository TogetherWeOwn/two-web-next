name: db-migrate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Approved migration target (web migrations only)
        type: choice
        options: [staging, production]
        default: staging
        required: true
      readback_only:
        description: Verify the approved production ledger end without applying migrations
        type: boolean
        default: false
  # deploy.yml does not call this workflow: it applies the staging web
  # migrations itself, in the exact-SHA deploy job, with the same
  # ci/db-migrate.mjs. This stays the hand-dispatch path (staging recovery)
  # and the only production path.
  # Environment secrets are loaded here, not passed/inherited from a caller.
  workflow_call:
    inputs:
      target:
        type: string
        default: staging
        required: false

# Checkout and fetch the migration numbering baseline.
permissions:
  contents: read

# Never cancel an in-flight schema change. Bot operations must be coordinated
# separately; the script also serializes web applies at the database level.
concurrency:
  group: web-migrate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  production-scope-preflight:
    if: ${{ inputs.target == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      checked_attempt: ${{ steps.check.outputs.checked_attempt }}
    # Deliberately no environment: this job sees only repo/org vars.
    steps:
      - name: Reject broader-scope production migration pins
        id: check
        shell: bash
        env:
          PRODUCTION_MIGRATION_APPROVED_SHA: ${{ vars.PRODUCTION_MIGRATION_APPROVED_SHA }}
          PRODUCTION_MIGRATION_IDENTITY_SHA256: ${{ vars.PRODUCTION_MIGRATION_IDENTITY_SHA256 }}
          PRODUCTION_MIGRATION_APPROVED_PENDING_TAGS: ${{ vars.PRODUCTION_MIGRATION_APPROVED_PENDING_TAGS }}
        run: |
          set -euo pipefail
          for name in PRODUCTION_MIGRATION_APPROVED_SHA PRODUCTION_MIGRATION_IDENTITY_SHA256 PRODUCTION_MIGRATION_APPROVED_PENDING_TAGS; do
            if [[ -n "${!name:-}" ]]; then
              printf '%s\n' 'Production migration scope pins must not have repository or organization values.' >&2
              exit 1
            fi
          done
          printf 'checked_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  migrate:
    name: migrate
    needs: production-scope-preflight
    if: ${{ !cancelled() && (inputs.target != 'production' || needs.production-scope-preflight.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers, prevent-self-review and main-only branch policy must
    # be configured in Settings > Environments before enabling this workflow.
    environment: ${{ inputs.target }}
    steps:
      - name: Ref and production enable gate (before checkout or DB access)
        shell: bash
        env:
          MIGRATION_TARGET: ${{ inputs.target }}
          READBACK_ONLY: ${{ inputs.readback_only }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_MIGRATION_APPROVED_SHA: ${{ inputs.target == 'production' && vars.PRODUCTION_MIGRATION_APPROVED_SHA || '' }}
          STAGING_MIGRATION_HOLD: ${{ vars.STAGING_MIGRATION_HOLD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { printf '%s\n' 'Migrations require main.' >&2; exit 1; }
          if [[ "${READBACK_ONLY:-}" == true && "$MIGRATION_TARGET" != production ]]; then
            printf '%s\n' 'Readback-only is production-only.' >&2
            exit 1
          fi
          case "$MIGRATION_TARGET" in
            staging) [[ "${STAGING_MIGRATION_HOLD:-}" == false ]] || { printf '%s\n' 'Staging migrations are held (STAGING_MIGRATION_HOLD is not exactly "false").' >&2; exit 1; } ;;
            production)
              [[ "$PRODUCTION_DEPLOY_ENABLED" == true ]] || { printf '%s\n' 'Production migrations are disabled.' >&2; exit 1; }
              if ! [[ "${PRODUCTION_MIGRATION_APPROVED_SHA:-}" =~ ^[a-f0-9]{40}$ && "$PRODUCTION_MIGRATION_APPROVED_SHA" == "${GITHUB_SHA:-}" ]]; then
                printf '%s\n' 'Production migration SHA is missing, malformed or does not match the run.' >&2
                exit 1
              fi ;;
            *) printf '%s\n' 'Unknown migration target.' >&2; exit 1 ;;
          esac
      - name: Read approved production migration scope
        id: production-scope
        if: ${{ inputs.target == 'production' }}
        shell: bash
        env:
          CHECKED_ATTEMPT: ${{ needs.production-scope-preflight.outputs.checked_attempt }}
          APPROVED_TAGS: ${{ vars.PRODUCTION_MIGRATION_APPROVED_PENDING_TAGS }}
        run: |
          set -euo pipefail
          # A partial rerun must not reuse the broader-scope check from an older attempt.
          if [[ -z "${CHECKED_ATTEMPT:-}" || "$CHECKED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            printf '%s\n' 'Production migration scope preflight must pass on this run attempt.' >&2
            exit 1
          fi
          if ! [[ "${APPROVED_TAGS:-}" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]; then
            printf '%s\n' 'Production migration scope must be a valid production Environment variable.' >&2
            exit 1
          fi
          printf 'pending_tags=%s\n' "$APPROVED_TAGS" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate migration numbering
        shell: bash
        env:
          MIGRATION_GIT_TOKEN: ${{ github.token }}
        # The baseline checker can fetch. Authenticate only this command, never
        # persist the read token beside dependency/lifecycle scripts.
        # actions/checkout writes `origin` without a `.git` suffix and Git matches
        # `http.<url>.*` on path boundaries, so scope the header to both forms.
        # https://git-scm.com/docs/git-config#Documentation/git-config.txt-GITCONFIGCOUNT
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${MIGRATION_GIT_TOKEN:?}" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
          GIT_CONFIG_KEY_1="http.${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git.extraheader" \
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth" \
            bash ci/check-migration-numbers.sh
      - name: Migration snapshot chain (local files, no credentials)
        shell: bash
        run: |
          node ci/check-snapshot-chain.mjs
          node --test ci/check-snapshot-chain-selftest.mjs
      - name: Dry-run listing (read-only journal diff, no DDL)
        if: ${{ !inputs.readback_only }}
        run: node ci/db-migrate.mjs plan
        env: &migration-env
          MIGRATION_TARGET: ${{ inputs.target }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          # Non-secret pins, provisioned only on the protected production Environment.
          PRODUCTION_MIGRATION_APPROVED_SHA: ${{ inputs.target == 'production' && vars.PRODUCTION_MIGRATION_APPROVED_SHA || '' }}
          PRODUCTION_MIGRATION_IDENTITY_SHA256: ${{ inputs.target == 'production' && vars.PRODUCTION_MIGRATION_IDENTITY_SHA256 || '' }}
          PRODUCTION_MIGRATION_APPROVED_PENDING_TAGS: ${{ steps.production-scope.outputs.pending_tags }}
          STAGING_MIGRATION_HOLD: ${{ vars.STAGING_MIGRATION_HOLD }}
          # Provision ONLY as secrets on the matching GitHub Environment.
          # The unselected target is not exposed to the process. No DATABASE_URL fallback.
          PLANETSCALE_STAGING_DATABASE_URL: ${{ inputs.target == 'staging' && secrets.PLANETSCALE_STAGING_DATABASE_URL || '' }}
          PRODUCTION_DATABASE_URL: ${{ inputs.target == 'production' && secrets.PRODUCTION_DATABASE_URL || '' }}
      - name: Record PITR timestamp, apply and verify under database lock
        if: ${{ !inputs.readback_only }}
        run: node ci/db-migrate.mjs apply
        env: *migration-env
      - name: Post-check zero pending web migrations
        if: ${{ inputs.target == 'staging' }}
        run: node ci/db-migrate.mjs verify
        env: *migration-env
      - name: Read back the approved production range (not a release gate)
        if: ${{ inputs.target == 'production' }}
        run: node ci/db-migrate.mjs verify-scope
        env: *migration-env
