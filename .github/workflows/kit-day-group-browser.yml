name: Kit day group browser regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-day-group-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  day-group-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
      - run: npm ci --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
      - run: node --test ci/kit-day-group-browser.test.mjs
