name: Join state baseline evidence
on:
  pull_request:
    paths:
      - .github/workflows/join-state-evidence.yml
      - ci/join-state-evidence*
permissions:
  contents: read
concurrency:
  group: join-state-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JOIN_APP_SHA: aa3e9cab061697c21569f269caafa4b7461b12cc
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
      APP_ROOT: ${{ github.workspace }}/application
      CONTROLLER_ROOT: ${{ github.workspace }}/controller
      JOIN_EVIDENCE_DIR: ${{ github.workspace }}/join-state-evidence
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "false"
    steps:
      - name: Check out exact PR controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: false
      - name: Check out baseline application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: aa3e9cab061697c21569f269caafa4b7461b12cc
          path: application
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify clean source identities
        run: |
          set -euo pipefail
          [[ "$JOIN_APP_SHA" =~ ^[0-9a-f]{40}$ && "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$APP_ROOT" rev-parse HEAD)" = "$JOIN_APP_SHA"
          test "$(git -C "$CONTROLLER_ROOT" rev-parse HEAD)" = "$CONTROLLER_SHA"
          test -z "$(git -C "$APP_ROOT" status --porcelain --untracked-files=all)"
          test -z "$(git -C "$CONTROLLER_ROOT" status --porcelain --untracked-files=all)"
      - name: Install locked dependencies and build fixture application
        working-directory: application
        run: |
          set -euo pipefail
          npm ci --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
          npm ci --prefix web --include=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
          node ci/build-ember-tokens.mjs --check
          node ci/build-leaf-css.mjs
          npm run build --prefix web
          npx --no-install playwright install --with-deps chromium
      - name: Capture and validate baseline fixtures
        working-directory: application
        run: |
          set -euo pipefail
          mkdir -p "$JOIN_EVIDENCE_DIR"
          ln -s "$APP_ROOT/node_modules" "$CONTROLLER_ROOT/node_modules"
          env -i PATH="$PATH" HOME="$HOME" APP_ROOT="$APP_ROOT" \
            JOIN_APP_SHA="$JOIN_APP_SHA" JOIN_EVIDENCE_DIR="$JOIN_EVIDENCE_DIR" \
            node --import tsx --test --test-reporter=tap --test-timeout=60000 "$CONTROLLER_ROOT/ci/join-state-evidence.test.mjs" \
            2>&1 | tee "$JOIN_EVIDENCE_DIR/test-report.tap"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$JOIN_APP_SHA"
          test "$(git -C "$CONTROLLER_ROOT" rev-parse HEAD)" = "$CONTROLLER_SHA"
          node "$CONTROLLER_ROOT/ci/join-state-evidence-manifest.mjs"
      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: join-state-baseline-${{ github.event.pull_request.head.sha }}
          path: ${{ github.workspace }}/join-state-evidence/
          if-no-files-found: error
          retention-days: 14
