      - name: Build alert Tail Worker (wrangler dry run)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: npx wrangler deploy --config tail/wrangler.jsonc --dry-run --outdir ../dist-tail
      - name: Build production alert Tail Worker (wrangler dry run)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: npx wrangler deploy --config tail/wrangler.jsonc --env production --dry-run --outdir ../dist-tail-production
      - name: Build staging jobs Worker (wrangler dry run)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: npx wrangler deploy --config wrangler.jobs.jsonc --dry-run --outdir ../dist-jobs
      - name: Production build (wrangler dry run, no deployment)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: npx wrangler deploy --dry-run --env production --outdir dist-production
      - name: Main Worker bundle budget selftest (offline fixtures, no deploy)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: node ci/check-worker-bundle.mjs --selftest
      - name: Main Worker bundle budget (dry-run output vs ceiling)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: node ci/check-worker-bundle.mjs

  # Node 22 compatibility leg: package.json `engines` declares a 22 range
  # beside `>=24`, but every other job runs Node 24, so the 22 range shipped
  # to developers unverified. Building this leg proved the old 22.18.0 floor
  # wrong (its bundled npm 10.9.3 refused the lockfile's incomplete
  # optional-peer tree, and its ICU 77 renders a zero UTC offset as `GMT`
  # where the suite and Node 24 pin `GMT+00:00`), so the floor is corrected
  # to 22.23.0, the 22.x release verified end to end (npm 10.9.8, ICU 78).
  # This leg
  # pins that exact floor (container image and setup-node), asserts the
  # running version, and runs lint, typecheck and the unit suite against the
  # same migrated Postgres `check` uses. Name pinned equal to the id. It
  # always reports like `check` (docs-only and draft PRs fast-pass) and
  # `ci-ok` fails unless it succeeds, so a red or skipped leg blocks the
  # merge instead of reading green. test/required-checks.test.ts pins the
  # floor and the surface.
  node22-compat:
    name: node22-compat
    needs: [scope]
    # `!cancelled()`, not `always()`: see the note on ci-ok.
    if: ${{ !cancelled() }}
    # Overflow switch: see CI_OVERFLOW_* note on the a11y job.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'node22-compat') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    # The lint + typecheck + unit-test suite runs 28-30m; 30m cancelled
    # green runs on runner noise (worst observed pass 29m32s, 28s of
    # margin). 45m keeps a ~34% margin; the progress sidecar samples the
    # first 43m (MAX_SAMPLES in ci/node22-progress.mjs tracks this ceiling).
    timeout-minutes: 45
    # Same container/service isolation as `check` (own network namespace, so
    # localhost:5432 cannot collide on the shared Docker host), at the exact
    # engines floor instead of Node 24.
    container:
      image: node:22.23.0-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require successful scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Docs-only fast pass (no code changed)
        if: needs.scope.outputs.docs_only == 'true' || needs.scope.outputs.draft == 'true'
        run: echo "Docs-only or draft change per the scope job; Node 22 compatibility leg passes without the suite."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        with:
          persist-credentials: false
      - name: Job-private localhost:5432 forward to the Postgres service
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: |
          # On hosted/overflow runners the job container's root does not own the
          # runner-owned checkout, so Git refuses it as dubious ownership.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends socat postgresql-client >/dev/null
          nohup setsid socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 >/dev/null 2>&1 &
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -U postgres && exit 0; sleep 1; done
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        with:
          node-version: 22.23.0
          cache: npm
          # The Kit install below reads web/package-lock.json, a separate
          # graph from the root lockfile (same note as the `check` job).
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The test plan for this leg is the version in the log: fail here, before
      # any suite runs, if the runner is not the exact engines floor.
      - name: Assert the exact Node 22.23.0 engines floor
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: |
          node --version
          test "$(node --version)" = "v22.23.0"
      - run: npm ci --no-audit --no-fund
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
      # Unit files SSR-compile .svelte through web's svelte/compiler, so the
      # Kit workspace installs before the suite (same reason as `check`).
      - name: Install Kit workspace dependencies
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm ci --prefix web --include=dev --no-audit --no-fund
      - name: Apply migrations
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      - name: Node 22 progress diagnostics selftests (local fixtures)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: node --test ci/node22-progress.test.mjs
      - name: Lint + typecheck + unit tests on Node 22.23.0
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: |
          node ci/node22-progress.mjs "$$" &
          diagnostics_pid=$!
          trap 'kill "$diagnostics_pid" 2>/dev/null || :; wait "$diagnostics_pid" 2>/dev/null || :' EXIT
          npm run lint && npm run typecheck && npm test
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
          AUDIT_IMPORT_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres

  bundle-budget:
    needs: scope
    # Budgets only observe the served assets (app). Drafts skip.
    if: needs.scope.outputs.draft != 'true' && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true')
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'bundle-budget') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --include=dev --no-audit --no-fund
      # The served public/ files are the deterministic esbuild output of
      # assets/; fail when a source changed without its rebuilt output.
      - run: node ci/minify-assets.mjs --selftest
      - run: node ci/minify-assets.mjs --check
      # The checker uses only Node built-ins; no network needed.
      - run: node ci/check-bundle-budget.mjs --selftest
      - run: node ci/check-bundle-budget.mjs

  lighthouse:
    needs: scope
    # Fixture worker serves the app over fixed routes (app only). Drafts skip.
    if: needs.scope.outputs.draft != 'true' && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true')
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'lighthouse') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    # A private namespace keeps Wrangler's fixed audit port off the shared host.
    container:
      image: node:24-bookworm
    # 45 covers one desktop-collect retry (ci/lighthouse-quality-run.mjs makes a
    # second whole-run attempt when the first comes up short of LHRs).
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: "false"
      # Ignore process bindings and .env; the fixture also discards runtime env.
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install isolated Chromium and process tools
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends procps >/dev/null
          npx playwright install --with-deps chromium
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_PATH=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Lighthouse (local fixture worker, no database or Discord)
        run: npm run lighthouse
      # Web quality gate (owner 2026-10-10): category scores vs ci/quality-budget.json, then security headers,
      # HTML basics and internal links. Each step runs even after an earlier failure so one red run lists
      # everything to fix; any failure fails this job and therefore ci-ok.
      - name: Lighthouse quality scores (desktop, categories vs ci/quality-budget.json)
        if: ${{ !cancelled() }}
        run: npm run lighthouse:quality
      - name: Web standards (security headers, HTML basics, internal links)
        if: ${{ !cancelled() }}
        run: npm run standards
      - name: Quality summary (what to fix)
        if: ${{ !cancelled() }}
        run: node ci/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Performance evidence (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Change-gated aggregator (TOG-14880, TOG-14877 CI standard): the single
  # merge-gate check. Reports success when the scope verdict is clean and every
  # selected job succeeded; a job that the scope skipped counts only when it
  # was not selected. A skipped required check is mergeable, so this job
  # explicitly fails when scope itself did not succeed. Name pinned equal to
  # the id: the operator requires `ci-ok` in the ruleset after merge + green
  # probes (ruleset cutover is an OPERATOR step, never this PR).
  # It runs unless its own run was cancelled. A draft PR marked ready seconds
  # after opening starts two runs on one head, and the concurrency group cancels
  # the older one; under `always()` that run's gates still ran and failed,
  # leaving a stale red on a head the newer run passes. In a cancelled run this
  # job concludes cancelled instead. Branch protection accepts only success,
  # skipped or neutral, so it still blocks the merge until the newer run's
  # ci-ok succeeds. test/ci-concurrency.test.ts pins both outcomes.
  ci-ok:
    name: ci-ok
    needs: [a11y, lighthouse, bundle-budget, docs-links, check, node22-compat, scope]
    if: ${{ !cancelled() }}
    # Overflow switch: see CI_OVERFLOW_* note on the a11y job.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'ci-ok') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      # The result gates that used to sit in `check`, unchanged: a failing,
      # cancelled or (when selected) skipped upstream job fails this required
      # check. They moved here so `check` can start in parallel with those
      # jobs; the aggregate step below still re-checks the scope, check,
      # audit and performance verdicts.
      - name: Require successful docs-links
        env:
          DOCS_LINKS_RESULT: ${{ needs.docs-links.result }}
        run: test "$DOCS_LINKS_RESULT" = success
      # node22-compat always reports like `check` (docs-only and draft PRs
      # fast-pass inside the leg), so only an explicit success reads green.
      - name: Require successful Node 22 compatibility leg
        env:
          NODE22_COMPAT_RESULT: ${{ needs.node22-compat.result }}
        run: test "$NODE22_COMPAT_RESULT" = success
      - name: Require successful accessibility audit
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        env:
          A11Y_RESULT: ${{ needs.a11y.result }}
          A11Y_SELECTED: ${{ needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.db == 'true' }}
        run: test "$A11Y_RESULT" = success || { test "$A11Y_SELECTED" = false && test "$A11Y_RESULT" = skipped; }
      # Check out so the always-run performance gate below can report, even
      # when a gate above already failed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always() && (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true')
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always() && (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true')
        with:
          node-version: 24
      # Only explicit success from both performance jobs may read green.
      - name: Performance gate (lighthouse + bundle-budget must succeed)
        if: always() && (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true')
        run: node ci/require-performance.mjs "${{ needs.lighthouse.result }}" "${{ needs.bundle-budget.result }}"
      - name: Aggregate change-gated conclusions
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DRAFT: ${{ needs.scope.outputs.draft }}
          FULL: ${{ needs.scope.outputs.full }}
          APP: ${{ needs.scope.outputs.app }}
          WORKER: ${{ needs.scope.outputs.worker }}
          DB: ${{ needs.scope.outputs.db }}
          CHECK_RESULT: ${{ needs.check.result }}
          A11Y_RESULT: ${{ needs.a11y.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          BUDGET_RESULT: ${{ needs.bundle-budget.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$SCOPE_RESULT" = success ] || fail "scope did not succeed; failing closed."
          # Empty or unexpected outputs would read as unselected areas and let a
          # skipped job pass, so every verdict must be exactly true or false.
          for pair in "FULL=$FULL" "APP=$APP" "WORKER=$WORKER" "DB=$DB" "DRAFT=$DRAFT"; do
            case "${pair#*=}" in
              true|false) ;;
              *) fail "scope output ${pair%%=*} is '${pair#*=}', expected true or false; failing closed." ;;
            esac
          done
          [ "$CHECK_RESULT" = success ] || fail "check did not succeed."
          selected_app_db() { [ "$FULL" = true ] || [ "$APP" = true ] || [ "$DB" = true ]; }
          selected_app() { [ "$FULL" = true ] || [ "$APP" = true ]; }
          # A skipped job passes when it was not selected, or on a draft
          # (drafts skip every heavy job; undrafting re-runs via
          # ready_for_review). Anything else fails: a cancelled or failed
          # selected job must never read green.
          check_job() { # $1=result $2=selected(true/false) $3=name
            [ "$1" = success ] && return 0
            if [ "$1" = skipped ] && { [ "$2" = false ] || [ "$DRAFT" = true ]; }; then
              echo "$3 skipped (out of scope or draft); aggregator passes."
              return 0
            fi
            fail "$3: result=$1 selected=$2."
          }
          if selected_app_db; then A11Y_SEL=true; else A11Y_SEL=false; fi
          if selected_app; then PERF_SEL=true; else PERF_SEL=false; fi
          check_job "$A11Y_RESULT" "$A11Y_SEL" a11y
          check_job "$LIGHTHOUSE_RESULT" "$PERF_SEL" lighthouse
          check_job "$BUDGET_RESULT" "$PERF_SEL" bundle-budget
          echo "ci-ok: scope clean, check green, every selected job succeeded."
