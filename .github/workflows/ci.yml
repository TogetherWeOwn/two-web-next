name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by the release workflow (TOG-9865) on release-please branches:
  # PRs opened with GITHUB_TOKEN trigger no workflows, so the required `check`
  # would never run on the release PR without this path.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # name pinned equal to the id: `check` is a required check on main.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Real Postgres so the advisory-lock single-flight test runs in CI (skipped when DATABASE_URL is unset).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      # Exercise the exact pre-deploy invocation on the same migrated service.
      - name: Check
        run: npm run check
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      - name: Neon backup selftest (stubbed, no secrets)
        run: bash ci/neon-backup-selftest.sh
      - name: Migration numbering check
        run: bash ci/check-migration-numbers.sh
      - name: Production deploy gate selftest (fixtures, no secrets or network)
        run: node --test ci/production-deploy-gate.test.mjs
      - name: Build (wrangler dry run)
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Production build (wrangler dry run, no deployment)
        run: npx wrangler deploy --dry-run --env production --outdir dist-production
