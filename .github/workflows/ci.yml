name: ci

on:
  pull_request:
    # ready_for_review re-runs CI when a draft becomes ready (drafts skip the
    # heavy jobs below, so undrafting must trigger a full run). `edited` is
    # deliberately absent: title/body edits need no heavy suite (pr-gates.yml
    # covers them with its own `edited` trigger).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  # Nightly full run (TOG-14880): non-PR events select every area, so this runs
  # the whole suite including the long gates. Catches regressions that slipped
  # past area-gated PR runs within hours.
  schedule:
    - cron: '19 2 * * *'
  # Manual re-run on a branch. Releases no longer dispatch it: there is no
  # release PR (docs/releases.md).
  workflow_dispatch:

permissions:
  contents: read
  # The scope job lists the PR's changed files via the API.
  pull-requests: read

# Runs on main are never cancelled in progress: a cancel request marks the run
# cancelled even when every job then succeeds, and the staging deploy trigger
# rejects a cancelled conclusion. That left 54 of 60 main runs cancelled on
# 2026-10-02 and staging never deployed. The group stays per ref, so main runs
# are serialized (finish in push order; a newer pending run replaces an older
# pending one before it starts), and an older SHA can never finish after, and
# deploy over, a newer one. PR pushes still cancel superseded runs (TOG-11811
# queue economy). The nightly schedule run has its own group: it also runs on
# main's ref, and a pending nightly would otherwise replace a pending push run,
# whose cancelled conclusion the staging deploy trigger rejects (it deploys only
# push-event runs). test/ci-concurrency.test.ts and the staging gate selftest pin
# this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'nightly') || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  # Cheap change-scope gate (TOG-11811): a PR that only touches prose
  # (`docs/**`, root `*.md`) that no gate, test or build reads fast-passes the
  # heavy jobs below instead of occupying two runner slots for 20 minutes.
  # ci/change-scope.sh fails closed. `check` still reports success under its
  # own name, so the required `ci-ok` gate keeps gating merges (paths-ignore
  # would leave it missing and block the PR, so it is deliberately not used).
  scope:
    name: scope
    # Overflow switch: see CI_OVERFLOW_* note on the a11y job.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'scope') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      app: ${{ steps.scope.outputs.app }}
      worker: ${{ steps.scope.outputs.worker }}
      db: ${{ steps.scope.outputs.db }}
      full: ${{ steps.scope.outputs.full }}
      draft: ${{ steps.scope.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            # Main pushes, schedules and dispatches run everything (TOG-14877
            # safety net). No checkout on this path, so verdicts are constant:
            # the script itself is never consulted here.
            {
              echo "docs_only=false"
              echo "app=true"
              echo "worker=true"
              echo "db=true"
              echo "full=true"
              echo "draft=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | "\(.filename)\t\(.previous_filename // "")"' > "$RUNNER_TEMP/pr-files.tsv"
          bash ci/change-scope.sh "$RUNNER_TEMP/pr-files.tsv" "$CHANGED_FILES" >> "$GITHUB_OUTPUT"
      # Tier 0 (pipeline review 2026-10-10): workflow logic was the largest class of review
      # findings a linter catches. scope gates ci-ok (fails closed), so a red lint blocks merge.
      - name: Lint workflows (actionlint)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  # Doc links run on every PR, including the docs-only ones the scope job fast-passes.
  docs-links:
    name: docs-links
    needs: scope
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'docs-links') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run docs:links
      # Parse the Vitest sources on every change, including ledger-only edits.
      # No install hooks or browser/database fixtures are needed by this gate.
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Timeout ledger ratchet (HARD)
        run: npm run ledger:timeouts:selftest && npm run ledger:timeouts

  a11y:
    name: a11y
    needs: scope
    # Audit the served surface when it or its inputs changed (app covers
    # test/helpers via the fixtures; db covers the migrations the fixtures
    # run). Drafts skip: undrafting re-runs via ready_for_review.
    if: needs.scope.outputs.draft != 'true' && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.db == 'true')
    # Overflow switch (TOG ops, 2026-10-01): repo vars CI_OVERFLOW_RUNNER (JSON
    # runs-on, e.g. ["ubuntu-latest"]), CI_OVERFLOW_JOBS (JSON job ids) and
    # CI_OVERFLOW_EVENTS (JSON event names) together route this job without a PR.
    # The public guard comes first, so a public repo never leaves GitHub-hosted
    # Linux, whatever the overflow vars name (the org's two-selfhosted runner group
    # also refuses public repos, TOG-12326). Private repo: the overflow switch if
    # selected, else the self-hosted fleet. Hosted minutes come from the included
    # allowance; an rbx1 guard reverts at 45k.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'a11y') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 25
    # Self-hosted runners share one Docker host, so a published 5432 (and
    # wrangler's dev ports) collide across concurrent jobs. A job container has
    # its own network namespace; localhost:5432 is forwarded to the service.
    container:
      image: node:24-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Job-private localhost:5432 forward to the Postgres service
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends socat postgresql-client >/dev/null
          nohup setsid socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 >/dev/null 2>&1 &
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -U postgres && exit 0; sleep 1; done
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - name: Chromium cancellation regressions
        env:
          A11Y_BROWSER_TESTS: "true"
        run: |
          npx vitest run ci/audit-lifecycle.test.mjs --reporter=default --reporter=json --outputFile.json=artifacts/a11y/audit-lifecycle.json
          node ci/a11y-require-executed.mjs artifacts/a11y/audit-lifecycle.json "audit lifecycle real Chromium signal cleanup" 2
      - name: RSVP keyboard-focus proof (real Chromium, loopback fixtures)
        run: |
          mkdir -p artifacts/a11y
          RSVP_FOCUS_BROWSER_TESTS=true node --test --test-reporter=tap --test-reporter-destination=artifacts/a11y/rsvp-focus.tap ci/rsvp-focus-browser.test.mjs
          node ci/rsvp-focus-require-executed.mjs artifacts/a11y/rsvp-focus.tap "RSVP outcome focus in Chromium" 16
      - name: Session recovery (local two-tab fixture, mocked OAuth)
        run: timeout 120s npm run test:auth-browser
      # The suite has no opt-out: it always runs, so missing evidence on the
      # green path means the run executed nothing. Default conditions on
      # purpose: when the suite itself fails this step skips and the upload
      # below (if: always()) still ships the partial evidence for debugging.
      - name: Session recovery evidence must exist
        run: node ci/require-session-recovery-evidence.mjs artifacts/session-recovery
      - name: Session recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-recovery-evidence
          path: artifacts/session-recovery/
          if-no-files-found: error
          retention-days: 14
      - name: OAuth sign-in CTA (loopback Miniflare + Chromium, mocked Discord)
        env:
          AUTH_BROWSER_OUTPUT_DIR: artifacts/auth-browser
        run: timeout 120s npm run test:auth-signin-browser
      # Same shape as the session-recovery gate above: the suite always runs,
      # so missing evidence on the green path means it executed nothing.
      # Default conditions on purpose: when the suite itself fails this step
      # skips and the upload below (if: always()) still ships the partial
      # evidence for debugging.
      - name: OAuth sign-in CTA evidence must exist
        run: node ci/require-auth-browser-evidence.mjs artifacts/auth-browser
      - name: OAuth sign-in CTA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-browser-evidence
          path: artifacts/auth-browser/
          if-no-files-found: error
          retention-days: 14
      # Each browser-gated suite skips unless its opt-in is "true"; the verifier
      # fails the step when any of its cases skipped or went missing.
      - name: Profile native and island Unicode regressions (memory fixtures)
        env:
          A11Y_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/profile-native-length.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/profile-native-length.json
          node ci/a11y-require-executed.mjs artifacts/a11y/profile-native-length.json "native browser submission and real island binder" 15
      - name: Install Kit workspace dependencies (profile, error shell, device timezone and member auth render)
        # Every browser fixture below SSR-compiles Svelte from the Kit workspace.
        run: npm ci --prefix web --include=dev --no-audit --no-fund
      - name: Profile native 422 baseline regressions (memory fixtures)
        env:
          A11Y_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/member-profile-native-422-baseline.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/member-profile-native-422-baseline.json
          node ci/a11y-require-executed.mjs artifacts/a11y/member-profile-native-422-baseline.json "native 422 baseline in a real browser" 4
      - name: Profile composition feedback regressions (memory fixtures)
        env:
          A11Y_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/profile-composition-browser.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/profile-composition-browser.json
          node ci/a11y-require-executed.mjs artifacts/a11y/profile-composition-browser.json "composition feedback in a real browser" 6
      - name: Admin event native Unicode regressions (intercepted fixtures, no network or DB)
        env:
          ADMIN_EVENT_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/admin-event-native-unicode.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/admin-native-unicode.json
          node ci/a11y-require-executed.mjs artifacts/a11y/admin-native-unicode.json "native admin event text limits" 48
      - name: Featured native headline and image description regressions (intercepted fixtures, no network or DB)
        env:
          FEATURED_NATIVE_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/featured-native-length.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/featured-native-length.json
          node ci/a11y-require-executed.mjs artifacts/a11y/featured-native-length.json "native featured headline and image description" 36
      - name: Calendar search native Unicode input regressions (real Chromium typing and paste, mocked reads)
        env:
          CALENDAR_SEARCH_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/calendar-search-unicode-boundaries.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/calendar-search-unicode-boundaries.json
          node ci/a11y-require-executed.mjs artifacts/a11y/calendar-search-unicode-boundaries.json "native calendar search input (real Chromium typing/paste)" 21
      - name: Event start device timezone (Hono and Kit, local fixtures)
        env:
          A11Y_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/event-device-timezone.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/event-device-timezone.json
          node ci/a11y-require-executed.mjs artifacts/a11y/event-device-timezone.json "event device timezone browser acceptance" 30
      - name: Event end device timezone (Hono and Kit, local fixtures)
        env:
          A11Y_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/event-device-timezone-ends.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/event-device-timezone-ends.json
          node ci/a11y-require-executed.mjs artifacts/a11y/event-device-timezone-ends.json "event device timezone ends browser acceptance" 30
      - name: Kit member auth (real Chromium, local HTTPS fixtures)
        run: |
          mkdir -p artifacts/a11y
          node --import tsx --test --test-timeout=60000 --test-reporter=tap --test-reporter-destination=artifacts/a11y/kit-member-auth.tap ci/kit-member-auth-browser.test.mjs
          node ci/rsvp-focus-require-executed.mjs artifacts/a11y/kit-member-auth.tap "Kit member auth in Chromium" 15
      - name: Kit error shell rendered accessibility (SSR fixtures, no network or DB)
        env:
          KIT_ERROR_SHELL_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/kit-error-shell-render.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/kit-error-shell-render.json
          node ci/a11y-require-executed.mjs artifacts/a11y/kit-error-shell-render.json "Kit error shell rendered accessibility" 6
          node ci/a11y-require-executed.mjs artifacts/a11y/kit-error-shell-render.json "admin failed-read retry: native keyboard/no-JS recovery" 12
      - name: Calendar subscription guidance (four SSR surfaces, intercepted clipboard)
        run: |
          npx vitest run --config ci/calendar-subscription-browser.vitest.ts ci/calendar-subscription-browser.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/calendar-subscription.json
          for surface in hono-calendar hono-archive kit-calendar kit-archive; do
            node ci/a11y-require-executed.mjs artifacts/a11y/calendar-subscription.json "$surface real-browser subscription acceptance" 10
          done
      - name: Profile device timezone (Hono and Kit SSR fixtures, no network or DB)
        env:
          PROFILE_DEVICE_TIMEZONE_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/profile-device-timezone.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/profile-device-timezone.json
          node ci/a11y-require-executed.mjs artifacts/a11y/profile-device-timezone.json "profile device timezone in Chromium" 49
      - name: Admin editor expiry departure (intercepted fixtures, no network or DB)
        env:
          ADMIN_EDITOR_EXPIRY_BROWSER_TESTS: "true"
        run: |
          npx vitest run test/admin-editor-expiry-departure.test.ts --reporter=default --reporter=json --outputFile.json=artifacts/a11y/admin-editor-expiry-departure.json
          node ci/a11y-require-executed.mjs artifacts/a11y/admin-editor-expiry-departure.json "admin editor expiry departure in Chromium" 4
      - name: WCAG 2.2 AA (local fixtures, no external services)
        env:
          DEBUG: pw:browser
        run: npm run a11y
      - name: Accessibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-evidence
          path: artifacts/a11y/
          if-no-files-found: error
          retention-days: 14
  # Name pinned equal to the id. `check` feeds the required `ci-ok` gate.
  # It needs only `scope`, so it starts alongside a11y, lighthouse and
  # bundle-budget instead of after them; the steps that gated those jobs'
  # results (docs-links, the accessibility audit and the performance gate)
  # live in `ci-ok`, which already needs every one of them.
  # `scope` is not a required check, so a red scope must fail `check` itself
  # (first step): without its outputs every area reads as unselected, and the
  # docs-only fast pass would leave `check` green on a broken verdict.
  check:
    name: check
    needs: [scope]
    # `!cancelled()`, not `always()`: see the note on ci-ok.
    if: ${{ !cancelled() }}
    # Overflow switch: see CI_OVERFLOW_* note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'check') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    # Container setup and serial SQL coverage takes 17-20m on the slowest shared
    # runners, so 20m cancelled green runs (TOG-12177). The full suite now
    # runs 29-38m on main; 40m left no headroom for runner noise, so the
    # ceiling moves to 60m (worst observed 37m51s keeps a ~37% margin).
    # Keep the job bounded; the seeded property suite retains its hard 10s limit.
    timeout-minutes: 60
    # Real Postgres so the advisory-lock single-flight test runs in CI (skipped when DATABASE_URL is unset).
    # Self-hosted runners share one Docker host, so a published 5432 (and
    # wrangler's dev ports) collide across concurrent jobs. A job container has
    # its own network namespace; localhost:5432 is forwarded to the service.
    container:
      image: node:24-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require successful scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Docs-only fast pass (no code changed)
        if: needs.scope.outputs.docs_only == 'true' || needs.scope.outputs.draft == 'true'
        run: echo "Docs-only or draft change per the scope job; required check passes without the heavy suite."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        with:
          # Migration history needs the base commit; fresh (hosted/overflow)
          # workspaces lack it, unlike reused self-hosted ones.
          fetch-depth: 0
          persist-credentials: false
      - name: Job-private localhost:5432 forward to the Postgres service
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: |
          # On hosted/overflow runners the job container's root does not own the
          # runner-owned checkout, so Git refuses it as dubious ownership.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends socat postgresql-client python3-venv >/dev/null
          nohup setsid socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 >/dev/null 2>&1 &
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -U postgres && exit 0; sleep 1; done
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        with:
          node-version: 24
          cache: npm
          # The Kit install below reads web/package-lock.json, a separate
          # graph from the root lockfile. Hash it into the cache key too so
          # the shared npm store covers the Kit steps.
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Performance gate selftest
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: node ci/require-performance.mjs --selftest
      - name: Kit public payload enumeration and checker selftests (local fixtures)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run check:kit-payloads:selftest && node ci/check-kit-payloads.mjs --static-only
      - name: Dependency audit selftest (local fixtures)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run deps:audit:selftest
      - name: Dependency audit (lockfile, including dev dependencies)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run deps:audit
      - run: npm ci --no-audit --no-fund
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
      # The toolchain suite pins the declared browser-helper peer metadata;
      # this pins the installed half: the root proxy-agent pin must exist and
      # be the copy that resolves from the helper's context (the LHCI-nested
      # 6.x copy is outside that path and never satisfies it). Bare
      # `npm ls --all` exits 0 on an unmet optional peer, so it cannot gate this.
      - name: Proxy-peer installed resolution (browsers context)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: node ci/check-proxy-peer.mjs --selftest && node ci/check-proxy-peer.mjs
      - name: Migration runtime-rights guard
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run migration:rights && npm run migration:rights:selftest
      - name: Seeded admin properties (10s budget, local fixtures)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        # Skip npm's extra process startup; keep the same suite and hard budget.
        run: timeout 10s node node_modules/vitest/vitest.mjs run test/admin-validation.property.test.ts --pool=threads
