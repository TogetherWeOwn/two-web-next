name: ci

on:
  pull_request:
    # ready_for_review re-runs CI when a draft becomes ready (drafts skip the
    # heavy jobs below, so undrafting must trigger a full run). `edited` is
    # deliberately absent: title/body edits need no heavy suite (pr-gates.yml
    # covers them with its own `edited` trigger).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Nightly full run (TOG-14880): non-PR events select every area, so this runs
  # the whole suite including the long gates. Catches regressions that slipped
  # past area-gated PR runs within hours.
  schedule:
    - cron: '19 2 * * *'
  # Dispatched by the release workflow (TOG-9865) on release-please branches:
  # PRs opened with GITHUB_TOKEN trigger no workflows, so the required `check`
  # would never run on the release PR without this path.
  workflow_dispatch:

permissions:
  contents: read
  # The scope job lists the PR's changed files via the API.
  pull-requests: read

# Runs on main are never cancelled in progress: a cancel request marks the run
# cancelled even when every job then succeeds, and the staging deploy trigger
# rejects a cancelled conclusion. That left 54 of 60 main runs cancelled on
# 2026-10-02 and staging never deployed. The group stays per ref, so main runs
# are serialized (finish in push order; a newer pending run replaces an older
# pending one before it starts), and an older SHA can never finish after, and
# deploy over, a newer one. PR pushes still cancel superseded runs (TOG-11811
# queue economy). The nightly schedule run has its own group: it also runs on
# main's ref, and a pending nightly would otherwise replace a pending push run,
# whose cancelled conclusion the staging deploy trigger rejects (it deploys only
# push-event runs). test/ci-concurrency.test.ts and the staging gate selftest pin
# this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'nightly') || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Cheap change-scope gate (TOG-11811): a PR that only touches prose
  # (`docs/**`, root `*.md`) that no gate, test or build reads fast-passes the
  # heavy jobs below instead of occupying two runner slots for 20 minutes.
  # ci/change-scope.sh fails closed. `check` still reports success under its
  # own name, so the required check keeps gating merges (paths-ignore would
  # leave it missing and block the PR, so it is deliberately not used here).
  scope:
    name: scope
    # Overflow switch: see CI_OVERFLOW_* note on the a11y job.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'scope') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      app: ${{ steps.scope.outputs.app }}
      worker: ${{ steps.scope.outputs.worker }}
      db: ${{ steps.scope.outputs.db }}
      full: ${{ steps.scope.outputs.full }}
      draft: ${{ steps.scope.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            # Main pushes, schedules and dispatches run everything (TOG-14877
            # safety net). No checkout on this path, so verdicts are constant:
            # the script itself is never consulted here.
            {
              echo "docs_only=false"
              echo "app=true"
              echo "worker=true"
              echo "db=true"
              echo "full=true"
              echo "draft=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | "\(.filename)\t\(.previous_filename // "")"' > "$RUNNER_TEMP/pr-files.tsv"
          bash ci/change-scope.sh "$RUNNER_TEMP/pr-files.tsv" "$CHANGED_FILES" >> "$GITHUB_OUTPUT"

  # Doc links run on every PR, including the docs-only ones the scope job fast-passes.
  docs-links:
    name: docs-links
    needs: scope
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'docs-links') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm run docs:links

  a11y:
    name: a11y
    needs: scope
    # Audit the served surface when it or its inputs changed (app covers
    # test/helpers via the fixtures; db covers the migrations the fixtures
    # run). Drafts skip: undrafting re-runs via ready_for_review.
    if: needs.scope.outputs.draft != 'true' && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.db == 'true')
    # Overflow switch (TOG ops, 2026-10-01): repo vars CI_OVERFLOW_RUNNER (JSON
    # runs-on, e.g. ["ubuntu-latest"]), CI_OVERFLOW_JOBS (JSON job ids) and
    # CI_OVERFLOW_EVENTS (JSON event names) together route this job without a PR.
    # The public guard comes first, so a public repo never leaves GitHub-hosted
    # Linux, whatever the overflow vars name (the org's two-selfhosted runner group
    # also refuses public repos, TOG-12326). Private repo: the overflow switch if
    # selected, else the self-hosted fleet. Hosted minutes come from the included
    # allowance; an rbx1 guard reverts at 45k.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'a11y') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 25
    # Self-hosted runners share one Docker host, so a published 5432 (and
    # wrangler's dev ports) collide across concurrent jobs. A job container has
    # its own network namespace; localhost:5432 is forwarded to the service.
    container:
      image: node:24-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Job-private localhost:5432 forward to the Postgres service
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends socat postgresql-client >/dev/null
          nohup setsid socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 >/dev/null 2>&1 &
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -U postgres && exit 0; sleep 1; done
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - name: Chromium cancellation regressions
        run: A11Y_BROWSER_TESTS=true node --test ci/a11y-lifecycle.test.mjs
      - name: Session recovery (local two-tab fixture, mocked OAuth)
        run: timeout 120s npm run test:auth-browser
      - name: Session recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: session-recovery-evidence
          path: artifacts/session-recovery/
          if-no-files-found: warn
          retention-days: 14
      - name: Profile native and island Unicode regressions (memory fixtures)
        run: A11Y_BROWSER_TESTS=true npx vitest run test/profile-native-length.test.ts
      - name: WCAG 2.2 AA (local fixtures, no external services)
        env:
          DEBUG: pw:browser
        run: npm run a11y
      - name: Accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-evidence
          path: artifacts/a11y/
          if-no-files-found: error
          retention-days: 14
  # name pinned equal to the id: `check` is a required check on main.
  # Run the required gate even when performance jobs fail or are skipped;
  # GitHub treats a skipped required check as successful.
  # A failing audit must also prevent the existing required check from passing.
  # `scope` is not a required check, so a red scope must fail `check` itself
  # (first step): without its outputs every area reads as unselected, and the
  # audit guard would accept a skipped a11y and leave `check` green.
  check:
    name: check
    needs: [a11y, lighthouse, bundle-budget, docs-links, scope]
    # A skipped required check is mergeable; explicitly fail when the audit is not green.
    if: always()
    # Overflow switch: see CI_OVERFLOW_* note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'check') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    # Container setup and serial SQL coverage takes 17-20m on the slowest shared
    # runners, so 20m cancelled green runs (TOG-12177). Keep the job bounded; the
    # seeded property suite retains its hard 10s limit.
    timeout-minutes: 40
    # Real Postgres so the advisory-lock single-flight test runs in CI (skipped when DATABASE_URL is unset).
    # Self-hosted runners share one Docker host, so a published 5432 (and
    # wrangler's dev ports) collide across concurrent jobs. A job container has
    # its own network namespace; localhost:5432 is forwarded to the service.
    container:
      image: node:24-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Require successful scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Require successful docs-links
        env:
          DOCS_LINKS_RESULT: ${{ needs.docs-links.result }}
        run: test "$DOCS_LINKS_RESULT" = success
      - name: Docs-only fast pass (no code changed)
        if: needs.scope.outputs.docs_only == 'true' || needs.scope.outputs.draft == 'true'
        run: echo "Docs-only or draft change per the scope job; required check passes without the heavy suite."
      - name: Require successful accessibility audit
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        env:
          A11Y_RESULT: ${{ needs.a11y.result }}
          A11Y_SELECTED: ${{ needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.db == 'true' }}
        run: test "$A11Y_RESULT" = success || { test "$A11Y_SELECTED" = false && test "$A11Y_RESULT" = skipped; }
      # Always check out so the always-run performance gate below can report.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        with:
          # Migration history needs the base commit; fresh (hosted/overflow)
          # workspaces lack it, unlike reused self-hosted ones.
          fetch-depth: 0
          persist-credentials: false
      - name: Job-private localhost:5432 forward to the Postgres service
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: |
          # On hosted/overflow runners the job container's root does not own the
          # runner-owned checkout, so Git refuses it as dubious ownership.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends socat postgresql-client >/dev/null
          nohup setsid socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 >/dev/null 2>&1 &
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -U postgres && exit 0; sleep 1; done
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        with:
          node-version: 24
          cache: npm
          # The Kit install below reads web/package-lock.json, a separate
          # graph from the root lockfile. Hash it into the cache key too so
          # the shared npm store covers the Kit steps.
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # Only explicit success from both performance jobs may read green.
      - name: Performance gate (lighthouse + bundle-budget must succeed)
        if: always() && (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true')
        run: node ci/require-performance.mjs "${{ needs.lighthouse.result }}" "${{ needs.bundle-budget.result }}"
      - name: Performance gate selftest
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: node ci/require-performance.mjs --selftest
      - name: Dependency audit selftest (local fixtures)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run deps:audit:selftest
      - name: Dependency audit (lockfile, including dev dependencies)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run deps:audit
      - run: npm ci --no-audit --no-fund
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
      - name: Seeded admin properties (10s budget, local fixtures)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        # Skip npm's extra process startup; keep the same suite and hard budget.
        run: timeout 10s node node_modules/vitest/vitest.mjs run test/admin-validation.property.test.ts --pool=threads
      - name: Public-route smoke selftest (loopback fixtures)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run test:smoke
      - name: Apply migrations
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      - name: Migration workflow selftest (isolated Postgres, no Neon/network APIs)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run db:migrate:selftest
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:ci@postgres:5432/postgres
      # Exercise the exact pre-deploy invocation on the same migrated service.
      - name: Configuration drift check + selftest
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run config:check
      - name: Biome gate selftest (intentional violations)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: bash ci/biome-selftest.sh
      - name: Check (lint + typecheck + coverage gate)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run lint && npm run typecheck && npm run test:coverage && node --test ci/a11y-*.test.mjs ci/admin-properties-ci.test.mjs ci/coverage-command.test.mjs
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
          AUDIT_IMPORT_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      # SvelteKit spike (TOG-12247): the web/ workspace has its own lockfile and
      # typecheck. web/node_modules is installed here so the Kit steps never run
      # on a partial workspace.
      - name: Install Kit workspace dependencies
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: npm ci --prefix web --no-audit --no-fund
      - name: Kit typecheck (svelte-check, warnings fail)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: npm run check --prefix web
      - name: Kit archive parity (Hono vs SvelteKit section contract)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: node ci/kit-preview-e2e.mjs
      - name: Staging deployment gate selftest (stubbed, no Cloudflare calls)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: node --test ci/staging-deploy-gate-selftest.mjs
      - name: Cutover selftest (loopback HTTP/TLS and stub DNS only)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run test:cutover
      - name: Shadow-compare selftest (loopback only)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run test:shadow
      - name: Coverage job summary
        if: always() && (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && hashFiles('coverage/coverage-summary.json') != ''
        run: node ci/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Neon backup selftest (stubbed, no secrets)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: bash ci/neon-backup-selftest.sh
      - name: Migration numbering check
        shell: bash
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.db == 'true')
        env:
          MIGRATION_GIT_TOKEN: ${{ github.token }}
        # The baseline checker can fetch. Authenticate only this command, never
        # persist the read token beside dependency/lifecycle scripts.
        # actions/checkout writes `origin` without a `.git` suffix and Git matches
        # `http.<url>.*` on path boundaries, so scope the header to both forms.
        # https://git-scm.com/docs/git-config#Documentation/git-config.txt-GITCONFIGCOUNT
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${MIGRATION_GIT_TOKEN:?}" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
          GIT_CONFIG_KEY_1="http.${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git.extraheader" \
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth" \
            bash ci/check-migration-numbers.sh
      - name: Pre-flip probe selftests (fixtures, no secrets)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: |
          npm run check:moderators
          DISCORD_MODERATOR_ROLE_IDS=508654771276873729 npm run check:moderators -- --require-configured
          if DISCORD_MODERATOR_ROLE_IDS=SySOp npm run check:moderators -- --require-configured; then
            echo "::error::role probe accepted a role name; expected exit 1"
            exit 1
          fi
          if npm run smoke:internal-action 2>/dev/null; then
            echo "::error::smoke CLI ran without options; expected exit 2"
            exit 1
          fi
          if npm run smoke:internal-action -- --announcement-only 2>/dev/null; then
            echo "::error::announcement-only smoke ran without --channel-key; expected exit 2"
            exit 1
          fi

      - name: Production deploy gate selftest (fixtures, no secrets or network)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: node --test ci/production-deploy-gate.test.mjs
      - name: Production secrets preflight selftest (stubbed wrangler, no secrets or network)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: node --test ci/check-production-secrets.test.mjs
      - name: Watch Lighthouse runner selftest (stub fetch and lhci, no network or browser)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true')
        run: npm run lighthouse:origin:selftest
      - name: Build (wrangler dry run)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Build alert Tail Worker (wrangler dry run)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: npx wrangler deploy --config tail/wrangler.jsonc --dry-run --outdir ../dist-tail
      - name: Production build (wrangler dry run, no deployment)
        if: (needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.draft != 'true') && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true' || needs.scope.outputs.worker == 'true')
        run: npx wrangler deploy --dry-run --env production --outdir dist-production

  bundle-budget:
    needs: scope
    # Budgets only observe the served assets (app). Drafts skip.
    if: needs.scope.outputs.draft != 'true' && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true')
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'bundle-budget') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      # The served public/ files are the deterministic esbuild output of
      # assets/; fail when a source changed without its rebuilt output.
      - run: node ci/minify-assets.mjs --selftest
      - run: node ci/minify-assets.mjs --check
      # The checker uses only Node built-ins; no network needed.
      - run: node ci/check-bundle-budget.mjs --selftest
      - run: node ci/check-bundle-budget.mjs

  lighthouse:
    needs: scope
    # Fixture worker serves the app over fixed routes (app only). Drafts skip.
    if: needs.scope.outputs.draft != 'true' && (needs.scope.outputs.full == 'true' || needs.scope.outputs.app == 'true')
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'lighthouse') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    # A private namespace keeps Wrangler's fixed audit port off the shared host.
    container:
      image: node:24-bookworm
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      # Ignore process bindings and .env; the fixture also discards runtime env.
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install isolated Chromium and process tools
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends procps >/dev/null
          npx playwright install --with-deps chromium
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_PATH=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Lighthouse (local fixture worker, no database or Discord)
        run: npm run lighthouse
      - name: Performance evidence (including failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Change-gated aggregator (TOG-14880, TOG-14877 CI standard): the single
  # merge-gate check. Reports success when the scope verdict is clean and every
  # selected job succeeded; a job that the scope skipped counts only when it
  # was not selected. A skipped required check is mergeable, so this job
  # explicitly fails when scope itself did not succeed. Name pinned equal to
  # the id: the operator requires `ci-ok` in the ruleset after merge + green
  # probes (ruleset cutover is an OPERATOR step, never this PR).
  ci-ok:
    name: ci-ok
    needs: [a11y, lighthouse, bundle-budget, check, scope]
    if: always()
    # Overflow switch: see CI_OVERFLOW_* note on the a11y job.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'ci-ok') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - name: Aggregate change-gated conclusions
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DRAFT: ${{ needs.scope.outputs.draft }}
          FULL: ${{ needs.scope.outputs.full }}
          APP: ${{ needs.scope.outputs.app }}
          WORKER: ${{ needs.scope.outputs.worker }}
          DB: ${{ needs.scope.outputs.db }}
          CHECK_RESULT: ${{ needs.check.result }}
          A11Y_RESULT: ${{ needs.a11y.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          BUDGET_RESULT: ${{ needs.bundle-budget.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$SCOPE_RESULT" = success ] || fail "scope did not succeed; failing closed."
          # Empty or unexpected outputs would read as unselected areas and let a
          # skipped job pass, so every verdict must be exactly true or false.
          for pair in "FULL=$FULL" "APP=$APP" "WORKER=$WORKER" "DB=$DB" "DRAFT=$DRAFT"; do
            case "${pair#*=}" in
              true|false) ;;
              *) fail "scope output ${pair%%=*} is '${pair#*=}', expected true or false; failing closed." ;;
            esac
          done
          [ "$CHECK_RESULT" = success ] || fail "check did not succeed."
          selected_app_db() { [ "$FULL" = true ] || [ "$APP" = true ] || [ "$DB" = true ]; }
          selected_app() { [ "$FULL" = true ] || [ "$APP" = true ]; }
          # A skipped job passes when it was not selected, or on a draft
          # (drafts skip every heavy job; undrafting re-runs via
          # ready_for_review). Anything else fails: a cancelled or failed
          # selected job must never read green.
          check_job() { # $1=result $2=selected(true/false) $3=name
            [ "$1" = success ] && return 0
            if [ "$1" = skipped ] && { [ "$2" = false ] || [ "$DRAFT" = true ]; }; then
              echo "$3 skipped (out of scope or draft); aggregator passes."
              return 0
            fi
            fail "$3: result=$1 selected=$2."
          }
          if selected_app_db; then A11Y_SEL=true; else A11Y_SEL=false; fi
          if selected_app; then PERF_SEL=true; else PERF_SEL=false; fi
          check_job "$A11Y_RESULT" "$A11Y_SEL" a11y
          check_job "$LIGHTHOUSE_RESULT" "$PERF_SEL" lighthouse
          check_job "$BUDGET_RESULT" "$PERF_SEL" bundle-budget
          echo "ci-ok: scope clean, check green, every selected job succeeded."
