name: db-production-identity

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      checked_attempt: ${{ steps.scope.outputs.checked_attempt }}
    # Without an Environment, only repository and organization secrets are visible.
    steps:
      - name: Check protected ref and pin scope
        id: scope
        shell: bash
        env:
          BROADER_SCOPE_SECRETS: ${{ secrets.PRODUCTION_DB_IDENTITY_APPROVED_SHA != '' ||
            secrets.PRODUCTION_DB_IDENTITY_SHA256 != '' || secrets.PRODUCTION_DATABASE_URL != '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_REF_PROTECTED" != true || "$BROADER_SCOPE_SECRETS" != false ]]; then
            printf '%s\n' 'Production database identity check refused.' >&2
            exit 1
          fi
          printf 'checked_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  identity:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - name: Require approval pins for this run attempt
        shell: bash
        env:
          CHECKED_ATTEMPT: ${{ needs.preflight.outputs.checked_attempt }}
          APPROVED_SHA: ${{ secrets.PRODUCTION_DB_IDENTITY_APPROVED_SHA }}
          PRODUCTION_DB_IDENTITY_SHA256: ${{ secrets.PRODUCTION_DB_IDENTITY_SHA256 }}
        run: |
          set -euo pipefail
          if [[ "$CHECKED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ||
                ! "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ || "$APPROVED_SHA" != "$GITHUB_SHA" ||
                ! "$PRODUCTION_DB_IDENTITY_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            printf '%s\n' 'Production database identity check refused.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Read production database identity
        shell: bash
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DB_IDENTITY_SHA256: ${{ secrets.PRODUCTION_DB_IDENTITY_SHA256 }}
        run: |
          set -euo pipefail
          # Redact all subprocess output, including a fatal runtime or driver diagnostic.
          if { node ci/production-db-identity.mjs; } >/dev/null 2>&1; then
            printf '%s\n' 'Production database identity matched.'
          else
            printf '%s\n' 'Production database identity check refused.' >&2
            exit 1
          fi
