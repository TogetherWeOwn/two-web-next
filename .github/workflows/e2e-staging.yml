name: e2e-staging
# Inherits the deploy run-name, so the title ends in the commit these journeys exercised
# (ci/resolve-promotion-sha.mjs reads it; head_sha is main's tip for workflow_run runs).
run-name: e2e-staging ${{ github.event.workflow_run.display_title || github.sha }}

# Post-deploy critical journeys against the staging Worker
# (docs/critical-journeys.md, "Staging post-deploy journeys"). Runs after a
# successful staging deploy and on manual dispatch. Public repo: standard
# GitHub-hosted ubuntu-latest runners only — never paid larger runners or
# Blacksmith. QA_AUTH_TOKEN comes from the staging Environment secret and is
# never printed; GitHub masks secrets in logs automatically. Browsers run here
# in CI only, never on the controller.
# Docs-only and test-only deploys (ci/change-scope.sh skip_e2e verdict,
# mirrored from e2e.yml) skip the journeys below: prose that no gate, test or
# build reads, and unit tests the journeys never execute, prove nothing about
# the deployed Worker. There is no PR context here (workflow_run +
# workflow_dispatch triggers), so the scope job diffs the deployed head SHA
# against its parent instead of listing PR files. e2e-staging gates no merge
# (required checks are ci-ok, gitleaks, e2e-ok and pr-lint), so a skip never
# blocks anything.

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  # Cheap change-scope gate (mirrors e2e.yml): a deploy whose head commit only
  # touches prose (`docs/**`, root `*.md`) that no gate, test or build reads,
  # or only the `test/` unit tree the journeys never execute, fast-passes the
  # journeys below instead of occupying a runner for 25 minutes. Manual
  # dispatches always run the journeys. ci/change-scope.sh fails closed:
  # every other path resolves to skip_e2e=false.
  scope:
    name: scope
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      skip_e2e: ${{ steps.scope.outputs.skip_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's github.sha is the default branch tip, not the
          # deployed SHA. Full history lets the diff below reach the parent.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          # A manual dispatch always runs the journeys; a deploy with no
          # parent (practically impossible on main) fails closed.
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git rev-parse --verify --quiet "$HEAD_SHA~1" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same shape as the pull-request files API that ci/change-scope.sh
          # reads in e2e.yml: one `filename<TAB>previous_filename` line per
          # changed file. Rename rows print old-then-new, so they are swapped.
          git diff --name-status -M "$HEAD_SHA~1" "$HEAD_SHA" \
            | awk -F'\t' '{ if ($1 ~ /^R/) print $3 "\t" $2; else print $2 "\t" }' > "$RUNNER_TEMP/deployed-files.tsv"
          EXPECTED=$(wc -l < "$RUNNER_TEMP/deployed-files.tsv")
          bash ci/change-scope.sh "$RUNNER_TEMP/deployed-files.tsv" "$EXPECTED" >> "$GITHUB_OUTPUT"

  # OWASP ZAP passive scan of the deployed staging Worker (zap-staging.yml).
  # Runs for every successful main deploy, including docs-only ones (it scans
  # the live Worker, not the diff). A failing scan fails this run, which keeps
  # the commit from being promoted to production.
  zap-baseline:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/zap-staging.yml

  # Passive set for the promotion regression check (G1): bin/smoke.mjs and
  # the GET-only guest journeys (e2e/watch) against staging, with the deployed
  # commit's own checkers, recorded as ledgers. deploy-production.yml runs the
  # same set against production before it promotes this commit and refuses
  # when a check that passes on production did not pass here. The outcome is
  # evidence, not a verdict: a failing check here fails promotion only when it
  # passes on production, so the job stays green and always uploads.
  staging-passive:
    name: staging-passive
    needs: scope
    if: >-
      needs.scope.outputs.skip_e2e != 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Passive set against staging (ledgers only)
        # Records the deployed commit with the ledgers so the promotion can
        # match them to its candidate. Exit codes are reported in the log; the
        # promotion judges the ledgers against production.
        run: |
          mkdir -p passive
          printf '%s\n' "$DEPLOYED_SHA" > passive/commit
          set +e
          node bin/smoke.mjs https://next.togetherweown.com --ledger passive/smoke.json
          echo "staging passive smoke exit $?"
          npx playwright test --config playwright.watch.config.ts
          # Comment line above the echo: ci/test-inventory.mjs stops expanding
          # a playwright invocation at a comment or blank line, so this echo
          # is never read as a spec filter. Keep it: the gate below judges
          # the ledgers, and this exit line is the log signal.
          echo "staging guest journeys exit $?"
        env:
          DEPLOYED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          WATCH_ORIGIN: https://next.togetherweown.com
          PLAYWRIGHT_JSON_OUTPUT_FILE: passive/journeys.json
          # Both sides skip the dead-letter gate: retained queue_failed_jobs
          # rows are database history, not a property of either version.
          SMOKE_ALLOW_MISSING_BASELINE: "1"
      - name: Staging passive ledger artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-passive-ledger-${{ github.run_id }}
          path: passive/
          # A missing ledger refuses promotion of this commit there, not here:
          # a red e2e-staging run would also block every older candidate.
          if-no-files-found: warn
          retention-days: 30

  staging-journeys:
    name: staging-journeys
    needs: scope
    if: >-
      needs.scope.outputs.skip_e2e != 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: https://next.togetherweown.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Staging critical journeys
        run: npm run e2e:staging
        env:
          QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      - name: Journey ledger (pass/skip/fail accounting)
        # Playwright can exit 0 with only skips or retries that eventually pass.
        # The gate writes a per-journey ledger (JSON + Markdown) and fails loud
        # for all-skipped, empty, failed or flaky results with reasons where safe.
        id: ledger
        if: always()
        run: node ci/check-staging-journeys.mjs
        env:
          QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      - name: Scrub QA token from failure artifacts
        # The repo is public and artifacts are downloadable without log
        # masking. Delete any file holding the token (also inside the report's
        # embedded zip and every trace zip) and fail loud (TOG-13046). The
        # upload below runs only when this sweep finished the whole tree.
        id: scrub
        if: failure()
        run: python3 ci/scrub-qa-token.py test-results playwright-report
        env:
          QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      - name: Failure traces and report (sanitized ledger only)
        # Upload only the derived, bounded ledger, never the raw report, HTML
        # report or traces (which may contain request data, cookies or member
        # content). The QA-token sweep still covers their full source tree and
        # the ledger; a crashed or incomplete sweep uploads nothing.
        if: failure() && steps.scrub.outputs.swept == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-staging-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/staging-journey-ledger.json
            test-results/staging-journey-ledger.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Journey ledger artifact
        # Ships only the derived ledger files (journey titles, outcomes and
        # reasons), never the raw Playwright JSON report, HTML report or traces.
        # The ledger carries only bounded single-line first-failure context. On
        # failed runs it waits for the scrub sweep to finish the whole tree;
        # on green runs no failure evidence is uploaded. A crashed or incomplete
        # scrub (swept unset) uploads nothing.
        if: ${{ !cancelled() && (steps.scrub.outcome == 'skipped' || steps.scrub.outputs.swept == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-staging-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/staging-journey-ledger.json
            test-results/staging-journey-ledger.md
          if-no-files-found: warn
          retention-days: 7

  # Web quality gate on the deployed staging Worker (owner policy 2026-10-10): runs after EVERY staging deploy
  # (not skipped with the journeys). A Lighthouse failure fails this run, and ci/resolve-promotion-sha.mjs also
  # requires this job by name, so production is never promoted from a staging deploy that scored below budget.
  # The origin web-standards step inside (security headers, HTML basics, internal links) blocks this job too,
  # the same as the Lighthouse budgets; see web-quality-origin.yml.
  staging-quality:
    name: staging-quality
    needs: scope
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/web-quality-origin.yml
    with:
      origin: https://next.togetherweown.com
