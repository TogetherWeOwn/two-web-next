name: e2e-staging
# Inherits the deploy run-name, so the title ends in the commit these journeys exercised
# (ci/resolve-promotion-sha.mjs reads it; head_sha is main's tip for workflow_run runs).
run-name: e2e-staging ${{ github.event.workflow_run.display_title || github.sha }}

# Post-deploy critical journeys against the staging Worker
# (docs/critical-journeys.md, "Staging post-deploy journeys"). Runs after a
# successful staging deploy and on manual dispatch. Public repo: standard
# GitHub-hosted ubuntu-latest runners only — never paid larger runners or
# Blacksmith. QA_AUTH_TOKEN comes from the staging Environment secret and is
# never printed; GitHub masks secrets in logs automatically. Browsers run here
# in CI only, never on the controller.
# Every successful main deploy runs journeys and passive ledgers, including
# docs/test-only commits. Production needs exact-deployed-SHA evidence: a skip
# cannot qualify a candidate, nor inherit a pass from an unproven runtime tree.
# PR-only scope skipping in e2e.yml is unchanged.

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Hold the deploy job's lock for this entire workflow, not individual jobs:
# staging cannot change between the revision check and any measurement. GitHub
# does not promise FIFO; a newer deploy can win first, in which case scope
# refuses the superseded candidate. Rejected events never replace a pending deploy.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
         (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
          !startsWith(github.event.workflow_run.display_title, 'deploy ignored ') &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository)) &&
        'deploy-staging' || format('e2e-staging-ignored-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  # Retain scope classification for diagnostics and fail closed if it fails.
  # Its skip_e2e verdict never skips deployed-Worker qualification: journeys
  # and passive ledgers below run even for docs/test-only deployments.
  scope:
    name: scope
    permissions:
      contents: read
      actions: read
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.display_title, 'deploy ignored ') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      skip_e2e: ${{ steps.scope.outputs.skip_e2e }}
    steps:
      # Resolve with trusted workflow code before checking out the candidate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Resolve and verify with the workflow revision's trusted gate.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve deployed candidate
        id: candidate
        run: node ci/staging-provenance.mjs candidate
      - name: Require a main-ancestor candidate
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
      - id: target
        run: node ci/staging-qualification.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Diff the validated candidate as data; keep scope code on the trusted
      # workflow revision. Never execute candidate code in this privileged job.
      - id: scope
        if: steps.target.outputs.sha != ''
        env:
          HEAD_SHA: ${{ steps.target.outputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The trusted tree supplies the helper import inventory. If main
          # moved past the candidate, that inventory cannot justify a skip.
          # Manual dispatch and a candidate without a parent also run fully.
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$HEAD_SHA" != "$WORKFLOW_SHA" ] || ! git rev-parse --verify --quiet "$HEAD_SHA~1" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same shape as the pull-request files API that ci/change-scope.sh
          # reads in e2e.yml: one `filename<TAB>previous_filename` line per
          # changed file. Rename rows print old-then-new, so they are swapped.
          git diff --name-status -M "$HEAD_SHA~1" "$HEAD_SHA" \
            | awk -F'\t' '{ if ($1 ~ /^R/) print $3 "\t" $2; else print $2 "\t" }' > "$RUNNER_TEMP/deployed-files.tsv"
          EXPECTED=$(wc -l < "$RUNNER_TEMP/deployed-files.tsv")
          bash ci/change-scope.sh "$RUNNER_TEMP/deployed-files.tsv" "$EXPECTED" >> "$GITHUB_OUTPUT"

  # OWASP ZAP passive scan of the deployed staging Worker (zap-staging.yml).
  # Runs for every successful main deploy, including docs-only ones (it scans
  # the live Worker, not the diff). A failing scan fails this run, which keeps
  # the commit from being promoted to production.
  zap-baseline:
    needs: scope
    if: >-
      needs.scope.outputs.sha != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    uses: ./.github/workflows/zap-staging.yml
    with:
      checkout_ref: ${{ needs.scope.outputs.sha }}
      candidate_sha: ${{ needs.scope.outputs.sha }}

  # Passive set for the promotion regression check (G1): bin/smoke.mjs and
  # the GET-only guest journeys (e2e/watch) against staging, with the deployed
  # commit's own checkers, recorded as ledgers. deploy-production.yml runs the
  # same set against production before it promotes this commit and refuses
  # when a check that passes on production did not pass here. The outcome is
  # evidence, not a verdict: a failing check here fails promotion only when it
  # passes on production, so the job stays green and always uploads.
  staging-passive:
    name: staging-passive
    needs: scope
    if: >-
      needs.scope.outputs.sha != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # No caches in this job: it checks out the deployed candidate, so a
      # cache write could poison the default branch (CodeQL cache-poisoning).
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Staging identity before passive set
        id: identity-before
        env:
          CANDIDATE_SHA: ${{ needs.scope.outputs.sha }}
        run: node ci/staging-provenance.mjs observe "$CANDIDATE_SHA" before passive/identity
      - name: Passive set against staging (ledgers only)
        # Exit codes are reported in the log; promotion judges the ledgers
        # against production. Identity failure is never a ledger-only verdict.
        run: |
          set +e
          node bin/smoke.mjs https://next.togetherweown.com --ledger passive/smoke.json
          echo "staging passive smoke exit $?"
          npx playwright test --config playwright.watch.config.ts
          # Comment line above the echo: ci/test-inventory.mjs stops expanding
          # a playwright invocation at a comment or blank line, so this echo
          # is never read as a spec filter. Keep it: the gate below judges
          # the ledgers, and this exit line is the log signal.
          echo "staging guest journeys exit $?"
        env:
          DEPLOYED_SHA: ${{ needs.scope.outputs.sha }}
          WATCH_ORIGIN: https://next.togetherweown.com
          PLAYWRIGHT_JSON_OUTPUT_FILE: passive/journeys.json
          # Both sides skip the dead-letter gate: retained queue_failed_jobs
          # rows are database history, not a property of either version.
          SMOKE_ALLOW_MISSING_BASELINE: "1"
      - name: Staging identity after passive set
        if: ${{ !cancelled() && steps.identity-before.outcome == 'success' }}
        env:
          CANDIDATE_SHA: ${{ needs.scope.outputs.sha }}
        run: node ci/staging-provenance.mjs observe "$CANDIDATE_SHA" after passive/identity passive/commit
      - name: Staging passive ledger artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-passive-ledger-${{ github.run_id }}
          path: passive/
          # A missing ledger refuses promotion of this commit there, not here:
          # a red e2e-staging run would also block every older candidate.
          if-no-files-found: warn
          retention-days: 30

  staging-journeys:
    name: staging-journeys
    needs: scope
    if: >-
      needs.scope.outputs.sha != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: https://next.togetherweown.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Candidate checkers must not write default-branch caches.
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Staging identity before critical journeys
        id: identity-before
        env:
          CANDIDATE_SHA: ${{ needs.scope.outputs.sha }}
        run: node ci/staging-provenance.mjs observe "$CANDIDATE_SHA" before staging-identity/critical
      - name: Staging critical journeys
        run: npm run e2e:staging
        env:
          QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      - name: Staging identity after critical journeys
        if: ${{ !cancelled() && steps.identity-before.outcome == 'success' }}
        env:
          CANDIDATE_SHA: ${{ needs.scope.outputs.sha }}
        run: node ci/staging-provenance.mjs observe "$CANDIDATE_SHA" after staging-identity/critical
      - name: Journey ledger (pass/skip/fail accounting)
        # Playwright can exit 0 with only skips or retries that eventually pass.
        # The gate writes a per-journey ledger (JSON + Markdown) and fails loud
        # for all-skipped, empty, failed or flaky results with reasons where safe.
        id: ledger
        if: always()
        run: node ci/check-staging-journeys.mjs
        env:
          QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      - name: Scrub QA token from failure artifacts
        # The repo is public and artifacts are downloadable without log
        # masking. Delete any file holding the token (also inside the report's
        # embedded zip and every trace zip) and fail loud (TOG-13046). The
        # upload below runs only when this sweep finished the whole tree.
        id: scrub
        if: failure()
        run: python3 ci/scrub-qa-token.py test-results playwright-report staging-identity
        env:
          QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      - name: Failure traces and report (sanitized ledger only)
        # Upload only the derived, bounded ledger and SHA/timestamp identities,
        # never the raw report, HTML report or traces (which may contain request
        # data, cookies or member content). The QA-token sweep covers all source
        # trees and these four files; an incomplete sweep uploads nothing.
        if: failure() && steps.scrub.outputs.swept == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-staging-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/staging-journey-ledger.json
            test-results/staging-journey-ledger.md
            staging-identity/critical.before.json
            staging-identity/critical.after.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Journey ledger artifact
        # Ships only derived ledger files (journey titles, outcomes and reasons)
        # and SHA/timestamp identities, never raw Playwright JSON, HTML or traces.
        # The ledger carries only bounded single-line first-failure context. On
        # failed runs it waits for the scrub sweep to finish the whole tree;
        # on green runs no failure evidence is uploaded. A crashed or incomplete
        # scrub (swept unset) uploads nothing.
        if: ${{ !cancelled() && (steps.scrub.outcome == 'skipped' || steps.scrub.outputs.swept == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-staging-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/staging-journey-ledger.json
            test-results/staging-journey-ledger.md
            staging-identity/critical.before.json
            staging-identity/critical.after.json
          if-no-files-found: warn
          retention-days: 7

  # Web quality gate on the deployed staging Worker (owner policy 2026-10-10): runs after EVERY staging deploy
  # (not skipped with the journeys). A Lighthouse failure fails this run, and ci/resolve-promotion-sha.mjs also
  # requires this job by name, so production is never promoted from a staging deploy that scored below budget.
  # The origin web-standards step inside (security headers, HTML basics, internal links) blocks this job too,
  # the same as the Lighthouse budgets; see web-quality-origin.yml.
  staging-quality:
    name: staging-quality
    needs: scope
    if: >-
      needs.scope.outputs.sha != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    uses: ./.github/workflows/web-quality-origin.yml
    with:
      origin: https://next.togetherweown.com
      checkout_ref: ${{ needs.scope.outputs.sha }}
      candidate_sha: ${{ needs.scope.outputs.sha }}

  qualification-revision:
    needs: [scope, zap-baseline, staging-passive, staging-journeys, staging-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Retain the lock through the final identity check. A failed job or
      # identity check keeps the run red, so none of its evidence qualifies.
      - name: Verify qualification revision
        run: node ci/staging-qualification.mjs --verify
        env:
          DEPLOYED_SHA: ${{ needs.scope.outputs.sha }}
