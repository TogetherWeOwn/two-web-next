name: neon-backup

# Nightly pg_dump of the Neon staging branch (and prod after cutover) to R2
# `two-web-next-backups`. See docs/db-migrations.md and bin/neon-backup.sh.
# CISO condition (TOG-9837): member-data dumps land ONLY in the
# EU-jurisdiction-pinned `two-web-next-backups` bucket (every wrangler r2
# object call passes --jurisdiction eu). The legacy `paperclip-backups`
# bucket (jurisdiction default / ENAM) is out of scope for member-data dumps.
# Secrets (operator-provisioned, never in logs): NEON_STAGING_DATABASE_URL,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. While Neon is unprovisioned
# the probe step skips the rest green so the schedule is quiet, not red.

on:
  schedule:
    # 03:17Z nightly: off-peak for EU, outside the 10-min reconcile cron.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Neon branch to dump"
        default: "staging"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: neon-backup
  cancel-in-progress: false

jobs:
  backup:
    name: backup
    # The org's two-selfhosted runner group refuses public repos (TOG-12326):
    # GitHub-hosted while public, the self-hosted fleet while private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","two-selfhosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      BRANCH: ${{ inputs.branch || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: probe
        name: Probe provisioning
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.NEON_STAGING_DATABASE_URL }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Neon staging not provisioned yet (TOG-9679); skipping."
          fi

      - uses: actions/setup-node@v7
        if: steps.probe.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.probe.outputs.ready == 'true'

      - name: Install pg_dump 17 (PGDG)
        if: steps.probe.outputs.ready == 'true'
        run: bash bin/backup-bootstrap.sh

      - name: Backup to R2
        if: steps.probe.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./bin/neon-backup.sh backup "$BRANCH"

      - name: Promote weekly + rotate (Sundays)
        if: steps.probe.outputs.ready == 'true' && github.event.schedule != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$(date -u +%u)" = 7 ]; then
            ./bin/neon-backup.sh promote-weekly "$BRANCH"
          fi
          ./bin/neon-backup.sh rotate "$BRANCH"

      - name: Verify all keys
        if: steps.probe.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./bin/neon-backup.sh check "$BRANCH"
