name: pr-ci-admission
on: workflow_call

permissions: { actions: read, contents: read, pull-requests: read }

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    # Keep each caller from occupying multiple runners while its prerequisites wait.
    concurrency:
      group: pr-ci-admission-${{ github.workflow }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require current lint, scan and size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          """Wait for the current PR's required prerequisite jobs, from GitHub Actions."""

          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          GATES = {"pr-gates": {"pr-lint", "gitleaks"}, "pr-size": {"pr-size-gate / gate"}}
          IGNORED = {
              "pr-lint": "pr-gates ignored edit (lint)",
              "gitleaks": "pr-gates ignored edit (scan)",
          }

          def advisory_name(label, name, allow_raw):
              fallback = IGNORED.get(name)
              # A cancelled source run can also emit a raw skipped name.
              return fallback is not None and (label == fallback or (
                  allow_raw and label.startswith("(github.event.action != 'edited' ||")
                  and label.endswith(f" && '{name}' || '{fallback}'")
              ))

          def current_identity(pr):
              """Bind a PR and its Actions evidence while allowing its base commit to advance."""
              return (pr["number"], (
                  pr["head"]["sha"], pr["head"]["ref"], pr["head"]["repo"]["id"]
              ), (
                  pr["base"]["ref"], pr["base"]["repo"]["id"]
              ))

          def collection(api, path, key):
              result = api(path + ("&" if "?" in path else "?") + "per_page=100")
              rows = result[key]
              if len(rows) != result["total_count"] or len({row["id"] for row in rows}) != len(rows):
                  raise ValueError("Incomplete Actions evidence")
              return rows

          def evidence(api, pr):
              head = pr["head"]
              proof = {}
              for workflow, names in GATES.items():
                  runs = collection(api, f"actions/workflows/{workflow}.yml/runs?head_sha={head['sha']}", "workflow_runs")
                  events = {"pull_request", "pull_request_review"} if workflow == "pr-size" else {"pull_request"}
                  pending = names.copy()
                  for run in sorted(runs, key=lambda row: row["run_number"], reverse=True):
                      if (run["path"] != f".github/workflows/{workflow}.yml" or run["event"] not in events
                              or run["head_sha"] != head["sha"] or run["head_branch"] != head["ref"]
                              or (run["head_repository"] or {}).get("id") != head["repo"]["id"]):
                          continue
                      associations = run["pull_requests"]
                      if len(associations) != 1:
                          raise ValueError("Unbound or ambiguous Actions run")
                      if associations[0]["number"] != pr["number"]:
                          continue
                      if current_identity(associations[0]) != current_identity(pr):
                          return None
                      # The advisory labeler may outlive the size gate. On the first
                      # attempt there are no earlier job verdicts to confuse with it.
                      first_size_attempt = workflow == "pr-size" and run["run_attempt"] == 1
                      if run["status"] != "completed" and not first_size_attempt:
                          return None
                      run_id = run["id"]
                      jobs = collection(api, f"actions/runs/{run_id}/jobs?filter=all", "jobs")
                      cancelled = run["conclusion"] == "cancelled"
                      for name in tuple(pending):
                          metadata_scan = cancelled and name == "gitleaks" and run.get("display_title") == "pr-gates metadata lint"
                          named = [job for job in jobs if job["name"] == name
                                   or advisory_name(job["name"], name, not cancelled or metadata_scan)]
                          if not named:
                              return None
                          attempt = max(job["run_attempt"] for job in named)
                          latest = [job for job in named if job["run_attempt"] == attempt]
                          if len(latest) != 1 or not 1 <= attempt <= run["run_attempt"]:
                              raise ValueError("Ambiguous Actions job attempt")
                          job = latest[0]
                          if (job["head_sha"], job["run_id"]) != (head["sha"], run_id):
                              raise ValueError("Actions job identity mismatch")
                          if job["name"] != name:
                              terminal_skip = job["conclusion"] == "skipped" or (metadata_scan and job["conclusion"] == "cancelled")
                              if job["status"] == "completed" and terminal_skip and job.get("runner_id", 0) is None:
                                  continue
                              raise ValueError(f"Invalid advisory job for {name}")
                          if (cancelled or job["status"] != "completed"
                                  or job["conclusion"] == "cancelled"
                                  or (run["status"] != "completed" and job["conclusion"] != "success")):
                              return None
                          if job["conclusion"] != "success":
                              raise ValueError(f"{name} concluded {job['conclusion']}: {job['html_url']}")
                          proof[name] = (run_id, attempt, job["id"])
                          pending.remove(name)
                      if not pending:
                          break
              return proof if set(proof) == set().union(*GATES.values()) else None

          def verify_current(api, pr):
              live = api(f"pulls/{pr['number']}")
              if current_identity(live) != current_identity(pr) or live["state"] != "open" or live["draft"]:
                  raise ValueError("Pull request head, base, or readiness changed")

          def main():
              pr = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["pull_request"]
              repository = os.environ["GITHUB_REPOSITORY"]

              def api(path):
                  return json.loads(subprocess.check_output(["gh", "api", f"repos/{repository}/{path}"], timeout=15))

              deadline = time.monotonic() + 420
              while time.monotonic() < deadline:
                  verify_current(api, pr)
                  proof = evidence(api, pr)
                  if proof and proof == evidence(api, pr):
                      verify_current(api, pr)
                      for name, (run, attempt, job) in sorted(proof.items()):
                          print(f"{name} passed on {pr['head']['sha']} (attempt {attempt}): "
                                f"https://github.com/{repository}/actions/runs/{run}/job/{job}")
                      return
                  time.sleep(45)
              raise ValueError("Timed out waiting for current lint, scan and size evidence")

          if __name__ == "__main__":
              main()
          PYTHON
