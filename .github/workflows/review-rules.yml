name: review-rules (shadow)
# ci-policy: non-required -- advisory signals; existing required gates stay unchanged.
# Repin to TogetherWeOwn/.github's squash-merge SHA after central PR #26 merges.
on:
  pull_request:
  merge_group:
permissions: {}
concurrency:
  group: review-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review-rules:
    permissions:
      contents: read
    uses: TogetherWeOwn/.github/.github/workflows/review-rules.yml@63699075b492914c137281acffd4c89e51cc1c4c
    with:
      packs: ts,security
      mode: warn
      # Runner separation: this workflow runs on pull_request and merge_group,
      # so pin GitHub-hosted runners explicitly instead of accepting the
      # reusable workflow's visibility-based default
      # (docs/private-flip-checklist.md).
      runs-on-json: '["ubuntu-latest"]'
