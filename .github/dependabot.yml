# Dependabot policy for two-web-next.
#
# Why grouped weekly: CI runner capacity is the bottleneck, and one grouped
# PR per ecosystem per week replaces up to N single-bump PRs. Security
# updates are NOT grouped (applies-to: version-updates on every group), so
# they keep arriving as separate, prioritized PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: UTC }
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        update-types: [major]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: UTC }
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    ignore:
      # svelte-check (latest 4.7.7) still peers typescript ^5 || ^6, so a TS 7
      # bump breaks `npm ci` in web/ with ERESOLVE (#1308, #812, #527, #408).
      # Remove this once svelte-check ships TypeScript 7 peer support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: UTC }
    commit-message: { prefix: "ci(deps)" }
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-major:
        applies-to: version-updates
        update-types: [major]
