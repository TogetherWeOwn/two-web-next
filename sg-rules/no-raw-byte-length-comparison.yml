# Keep the TSX twin in sync. Tooling and generated output are outside this rule.
id: no-raw-byte-length-comparison
language: TypeScript
severity: error
message: Use the shared byte-limit helpers in src/http/length-limit.ts.
files:
  - "{src,web/src,assets}/**/*.{ts,mts,cts,js,mjs,cjs}"
ignores:
  - src/http/length-limit.ts
rule:
  any:
    - matches: byte-length-access
    - kind: call_expression
      has:
        field: function
        any:
          - matches: byte-length-access
          - matches: expression-wrapper
            has:
              matches: byte-length-access
              stopBy:
                not:
                  matches: expression-wrapper
  inside:
    matches: comparison
    stopBy:
      # A ternary condition selects an operand without supplying its value.
      any:
        - matches: ternary-condition
        - not:
            matches: operand-wrapper
  not:
    any:
      - matches: ternary-condition
      - matches: attendee-return-cap
utils:
  # The attendee URL module is dependency-free. Remove this when its server
  # return-link callers move the cap check to a module that can import it.
  attendee-return-cap:
    all:
      - pattern: new TextEncoder().encode(href).byteLength
      - inside:
          pattern: "const fits = (href: string) => new TextEncoder().encode(href).byteLength <= maxBytes;"
          stopBy:
            kind: lexical_declaration
      - inside:
          kind: function_declaration
          has:
            field: name
            regex: "^authReturnHref$"
          stopBy: end
  operand-wrapper:
    any:
      - matches: expression-wrapper
      - kind: ternary_expression
      - kind: unary_expression
        has:
          field: operator
          regex: "^[+~-]$"
      - kind: binary_expression
        not:
          matches: comparison
  ternary-condition:
    inside:
      kind: ternary_expression
      field: condition
  expression-wrapper:
    any:
      - kind: parenthesized_expression
      - kind: non_null_expression
      - kind: as_expression
      - kind: satisfies_expression
      - kind: type_assertion
  byte-length-access:
    any:
      - kind: member_expression
        has:
          field: property
          regex: "^byteLength$"
      - kind: subscript_expression
        has:
          field: index
          regex: '^(?:"byteLength"|\x27byteLength\x27|`byteLength`)$'
  comparison:
    kind: binary_expression
    has:
      field: operator
      regex: "^(?:<=?|>=?|===?|!==?)$"
