id: http-no-hono
language: TypeScript
severity: error
message: "The HTTP core must not import or re-export Hono"
files:
  - src/http/**/*.{ts,js,mjs,cjs}
rule:
  kind: string
  regex: '^["\x27]hono(?:/[^"\x27]*)?["\x27]$'
  any:
    - inside:
        kind: import_statement
        field: source
    - inside:
        kind: export_statement
        field: source
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          pattern: import($$$)
