id: http-no-hono-tsx
language: tsx
severity: error
message: "The HTTP core must not import or re-export Hono"
files:
  - src/http/**/*.tsx
rule:
  all:
    - any:
        - kind: string
          regex: '^["\x27]hono(?:/[^"\x27]*)?["\x27]$'
        - kind: template_string
          regex: "^`hono(?:/[^`$]*)?`$"
  any:
    - inside:
        kind: import_statement
        field: source
    - inside:
        kind: import_require_clause
        field: source
    - inside:
        kind: export_statement
        field: source
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          any:
            - pattern: import($$$)
            - pattern: require($$$)
