# fetch(...) must be awaited, returned, or .then/.catch-chained (HARD gate).
#
# A floating fetch() keeps running after the handler settled: its rejection
# is unobserved and its response never reaches the caller. Deliberate
# fire-and-forget needs an explicit `void` with a comment saying why the
# outcome is safe to drop (a future rule revision can allow void explicitly).
#
# Every `inside` search stops at the nearest function boundary: an `await`
# or `return` outside a callback does not settle the promise created inside
# it. A concise arrow body (`(u) => fetch(u)`) is the callback's implicit
# return, so it stays exempt. Edge: `resolve(fetch(u))` inside a Promise
# executor is flagged; restructure to async/await instead.
id: fetch-must-be-awaited
# `ts` only: ast-grep applies a rule to a single language, so `src/**/*.tsx`
# is covered by the sibling rule in fetch-await-tsx.yml (`language: tsx`).
language: ts
severity: error
message: "fetch(...) must be awaited, returned, or .then/.catch-chained"
note: >-
  Write `await fetch(...)`, `return fetch(...)`, or chain
  `fetch(...).then(...)`.
files:
  # Server code only. assets/islands/*.js use assigned `.then` chains
  # (`inflight = fetch(...).then(...)`) behind generation guards; they are
  # covered by browser tests, not by this rule.
  - src/**/*.ts
rule:
  kind: call_expression
  pattern: fetch($$$)
  not:
    any:
      # await fetch(...) up the ancestor chain, within the same function.
      - inside:
          kind: await_expression
          stopBy:
            any:
              - kind: arrow_function
              - kind: function_declaration
              - kind: function_expression
              - kind: method_definition
      # return fetch(...), within the same function.
      - inside:
          kind: return_statement
          stopBy:
            any:
              - kind: arrow_function
              - kind: function_declaration
              - kind: function_expression
              - kind: method_definition
      # fetch(...).then(...) / .catch(...) / .finally(...) chains.
      - inside:
          stopBy:
            any:
              - kind: arrow_function
              - kind: function_declaration
              - kind: function_expression
              - kind: method_definition
          pattern: fetch($$$).then($$$)
      - inside:
          stopBy:
            any:
              - kind: arrow_function
              - kind: function_declaration
              - kind: function_expression
              - kind: method_definition
          pattern: fetch($$$).catch($$$)
      - inside:
          stopBy:
            any:
              - kind: arrow_function
              - kind: function_declaration
              - kind: function_expression
              - kind: method_definition
          pattern: fetch($$$).finally($$$)
      # `(u) => fetch(u)`: the call is the arrow body, i.e. the callback's
      # implicit return, so the promise reaches the caller.
      - inside:
          kind: arrow_function
          field: body
