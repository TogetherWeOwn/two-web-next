# ast-grep project config (quality gate: fetch-await HARD).
#
# Rules live in sg-rules/ (ast-grep 0.50.0 project mode only reads
# `ruleDirs`; inline `rules:` here are silently ignored). The ts-* rules are
# vendored byte-identical from the shared meta-only quality assets
# (quality/meta-only/rules/ts/); provenance is recorded in
# docs/quality-gates.md. Rule fixtures live in sg-tests/.
#
# Run the project scan and Node baseline check with npm run scan:fetch-await.
# The CI check job rejects error-severity findings and new Node comparisons.
# Rule tests: npx -y --package @ast-grep/cli@0.50.0 ast-grep test
ruleDirs:
  - sg-rules
testConfigs:
  - testDir: sg-tests
languageGlobs:
  # ast-grep's language globs match basenames, not paths.
  # The HTML grammar exposes Svelte script bodies as raw text.
  Html:
    - "*.svelte"
  tsx:
    - "*.jsx"
  TypeScript:
    - "**/*.mts"
    - "**/*.cts"
    - "**/*.cjs"
    - "**/*.mjs"
    - "**/*.js"
languageInjections:
  # Svelte can execute scripts with unknown lang values as JavaScript.
  # Parse every script body with the TypeScript grammar used for Node scripts.
  - hostLanguage: Html
    injected: ts
    rule:
      kind: raw_text
      pattern: $CONTENT
      inside:
        kind: script_element
