# Default rules, plus an allowlist for values that are public by design.
[extend]
useDefault = true

[[allowlists]]
description = "Public Discord ids: the Owen application (client) id is in every OAuth URL, the TWO guild id is in its public widget"
targetRules = ["discord-client-id"]
regexes = ['''1539711683898118154''', '''326474832151838730''']

[[allowlists]]
description = "Fixture moderator snowflake: the public Moderator role id, referenced in tests against fixture role lists only — the live grant stays env-only via DISCORD_MODERATOR_ROLE_IDS"
targetRules = ["discord-client-id"]
regexes = ['''1546777856984481792''']

[[allowlists]]
description = "Retired SySOp role id: public by design and still present in git history (pre-migration configs), where a push-to-main full-history scan would flag it without this entry — it no longer grants anything"
targetRules = ["discord-client-id"]
regexes = ['''508654771276873729''']

[[allowlists]]
description = "Synthetic Discord snowflake for the legacy import fixture; sequential digits, not a real client or credential"
targetRules = ["discord-client-id"]
regexes = ['''^123456789012345678$''']

[[allowlists]]
description = "Synthetic event-key fixtures (ULID-shaped, not credentials) in the event search tests"
targetRules = ["generic-api-key"]
regexes = ['''01ARZ3NDEKTSV4RRFFQ69G5FA[A-D]''']

[[allowlists]]
description = "Two synthetic ULID event keys in binding-only DB regression fixtures, not credentials"
targetRules = ["generic-api-key"]
regexes = ['''01ARZ3NDEKTSV4RRFFQ69G5FAV''', '''01ARZ3NDEKTSV4RRFFQ69G5FAW''']

[[allowlists]]
description = "Synthetic signing key used only by the isolated auth admission fixture, including its committed history"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^test/auth-admission\.test\.ts$''']
regexes = ['''^fixture-signing-secret-at-least-32-bytes$''']

[[allowlists]]
description = "Synthetic event ULID in the request-correlation fixture, not a credential (TOG-10838)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^01ARYZ6S41TSV4RRFFQ69G5FAV$''']
paths = ['''^test/request-correlation\.test\.ts$''']

[[allowlists]]
description = "Synthetic ULID event key in the W15 login-return DB fixture, not a credential"
targetRules = ["generic-api-key"]
regexes = ['''01J0AABBCCDDEEFFGGHHMMNNPP''']

[[allowlists]]
description = "Synthetic sequential guild id in offline homepage widget fixtures, not an OAuth credential"
targetRules = ["discord-client-id"]
condition = "AND"
paths = ['''^test/home-theme\.test\.ts$''']
regexes = ['''123456789012345678''']

[[allowlists]]
description = "Two synthetic ULID event keys in the portable legacy backfill import proof, not credentials"
targetRules = ["generic-api-key"]
regexes = ['''01J2ZB2X5X3Q8T1V9W4Y6Z7A8[BC]''']

[[allowlists]]
description = "Event key of an orphaned staging E2E fixture, kept in git history by an earlier spec; ULID-shaped, not a credential"
targetRules = ["generic-api-key"]
regexes = ['''01M41G95P1M3EWP30VWZPFYSG9''']

[[allowlists]]
description = "Synthetic idempotency-key fixtures in the agent replay corrupt-body test, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^test/agent-replay-corrupt\.test\.ts$''']
regexes = ['''^corrupt-mismatch-001$''', '''^corrupt-legacy-001$''', '''^corrupt-healthy-001$''', '''^corrupt-fresh-001$''']

[[allowlists]]
description = "Four synthetic ULID event keys in the local fixture sweep, used only by an in-memory fake API and HTML rows, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^e2e/local-fixture-sweep\.test\.mjs$''']
regexes = [
  '''^01ARZ3NDEKTSV4RRFFQ69G5FAE$''',
  '''^01ARZ3NDEKTSV4RRFFQ69G5FAF$''',
  '''^01ARZ3NDEKTSV4RRFFQ69G5FB0$''',
  '''^01ARZ3NDEKTSV4RRFFQ69G5FB1$''',
]

[[allowlists]]
description = "Three synthetic ULID event keys in the Kit event-detail session-renewal fixture, used only by in-memory event lookup and request paths, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^test/kit-event-detail-session-renewal\.test\.ts$''']
regexes = [
  '''^01ARZ3NDEKTSV4RRFFQ69G5FBV$''',
  '''^01ARZ3NDEKTSV4RRFFQ69G5FCV$''',
  '''^01ARZ3NDEKTSV4RRFFQ69G5FZV$''',
]

[[allowlists]]
description = "Synthetic malformed event key with a non-Crockford U in the admin route admission fixture, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^test/admin-event-route-key-admission\.test\.ts$''']
regexes = ['''^01ARZ3NDEKTSV4RRFFQ69G5FAU$''']

[[allowlists]]
description = "Synthetic hostile request-id fixture in the Kit error correlation tests, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^0123456789abcdef-IP-secret$''']
paths = ['''^test/kit-error-request-correlation\.test\.ts$''']

[[allowlists]]
description = "Synthetic Discord snowflake leak-marker in the queue/agent structured-fields acceptance test; patterned digits, not a real client or credential"
targetRules = ["discord-client-id"]
condition = "AND"
regexTarget = "secret"
paths = ['''^test/queue-agent-structured-fields-acceptance\.test\.ts$''']
regexes = ['''^777666555444333222$''']

[[allowlists]]
description = "Synthetic unknown-event ULID in the cancelled-event alternatives acceptance fixture, used only for an in-memory 404 lookup, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^test/event-gone-alternatives-acceptance\.test\.ts$''']
regexes = ['''^01ARZ3NDEKTSV4RRFFQ69G5FA9$''']

[[allowlists]]
description = "Deterministic RFC example-UUID idempotency fixture in the bot settings tests, asserted literally in expected headers and bodies, not a credential (including its committed history)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^test/bot-settings\.test\.ts$''']
regexes = ['''^123e4567-e89b-12d3-a456-426614174000$''']

[[allowlists]]
description = "Synthetic operator bearer fixture in the local accessibility harness, including its committed history; never provisioned as a live credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^ci/a11y-cases\.mjs$''']
regexes = ['''^a11y-operator-fixture-$''']

[[allowlists]]
description = "Two synthetic Discord event ids in the fixture-only public Hono payload acceptance suite, not clients or credentials"
targetRules = ["discord-client-id"]
condition = "AND"
regexTarget = "secret"
paths = ['''^test/hono-no-member-data-contract\.test\.ts$''']
regexes = ['''^111222333444555667$''', '''^222333444555666778$''']

[[allowlists]]
description = "Two synthetic offline PUBLIC Discord event fixtures in the Kit public-payload contract tests, not credentials or member identities"
targetRules = ["discord-client-id"]
condition = "AND"
regexTarget = "secret"
paths = ['''^test/kit-no-member-data-contract\.test\.ts$''']
regexes = ['''^111222333444555667$''', '''^222333444555666778$''']
